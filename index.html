<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ラダー工場の冒険</title>
<!-- アプリ化(PWA)用。GitHub Pages などで公開したときだけ有効。ファイルを直接開いた場合は無視される -->
<meta name="theme-color" content="#ff5d8f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ラダー冒険">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#fff6e5; --bg2:#fffaf0; --panel:#ffffff; --panel2:#fff1cf; --soft:#f1e6cf;
  --ink:#2b2340; --text:#2b2340; --sub:#6f6888; --line:#2b2340;
  --accent:#ffc23d; --accent2:#3d9bff; --pink:#ff5d8f; --mint:#22c58b; --purple:#8b5cf6;
  --on:#12c46b; --on-dim:rgba(18,196,107,.22); --wire:#9b94b0; --rail:#5b5470;
  --ng:#ff4f6d; --ok:#12b464; --lock:#b9b2c8; --area:#ff9f43;
}
*{box-sizing:border-box}
html,body{margin:0;color:var(--text);
  font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","BIZ UDPGothic","Yu Gothic UI","Meiryo",sans-serif;font-size:15px;line-height:1.6}
body{background:var(--bg);background-image:radial-gradient(#f3dfb6 1.4px,transparent 1.4px);background-size:22px 22px}
button{font:inherit;color:inherit;cursor:pointer}
.hidden{display:none!important}
.btn{background:#fff;border:2.5px solid var(--ink);border-radius:12px;padding:7px 14px;min-height:40px;font-weight:700;box-shadow:0 3px 0 var(--ink);transition:transform .06s,box-shadow .06s}
.btn:hover:not(:disabled){filter:brightness(1.04);transform:translateY(-1px);box-shadow:0 4px 0 var(--ink)}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.btn.primary{background:var(--accent);color:var(--ink)}
.btn.go{background:var(--mint);color:#fff}
.btn.stop{background:var(--pink);color:#fff}
.btn.small{padding:3px 10px;min-height:32px;font-size:13px;border-width:2px;box-shadow:0 2px 0 var(--ink)}
.btn:disabled{opacity:.4;cursor:default;box-shadow:0 1px 0 var(--ink)}
.badge{display:inline-block;font-size:11.5px;font-weight:700;padding:0 9px;border-radius:999px;background:#fff;border:2px solid var(--ink);color:var(--ink);white-space:nowrap;line-height:1.6}
.badge.build{background:#cfe7ff}
.badge.fill{background:#fff0b3}
.badge.bug{background:#ffd3dc}
.badge.short{background:#e6dbff}
.badge.boss{background:var(--ng);color:#fff}
.stars{color:var(--accent);letter-spacing:1px;-webkit-text-stroke:1px #c98a00}
.stars .off{color:#e8dfcc;-webkit-text-stroke:1px #d4c8ae}

/* ---------- マップ ---------- */
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:10px 16px;background:#fff;border-bottom:3px solid var(--ink);position:sticky;top:0;z-index:5}
.topbar h1{font-size:21px;margin:0;flex:1 1 auto;white-space:nowrap;font-weight:900;letter-spacing:.5px;color:var(--pink);text-shadow:2px 2px 0 var(--accent)}
.topbar h1 small{font-size:12px;color:var(--sub);text-shadow:none;font-weight:700;margin-left:6px}
.status{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;font-weight:700}
.lvbadge{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;background:var(--purple);color:#fff;border:2.5px solid var(--ink);box-shadow:0 3px 0 var(--ink);flex-direction:column;line-height:1}
.lvbadge small{font-size:9px}.lvbadge b{font-size:17px}
.xpwrap{display:flex;flex-direction:column;gap:2px}
.xpbar{width:130px;height:12px;background:#f3ecdf;border-radius:999px;overflow:hidden;border:2px solid var(--ink)}
.xpbar > i{display:block;height:100%;background:repeating-linear-gradient(-45deg,#ffc23d 0 8px,#ffd76e 8px 16px);background-size:22px 22px;animation:stripe 1s linear infinite;border-radius:999px}
@keyframes stripe{to{background-position:22px 0}}
.xptext{font-size:11px;color:var(--sub)}
.streak{background:#ffe6d6;border:2px solid var(--ink);border-radius:999px;padding:1px 10px}
.map{max-width:980px;margin:0 auto;padding:14px 14px 30px}
.area{background:#fff;border:3px solid var(--ink);border-radius:18px;margin-bottom:18px;box-shadow:0 5px 0 var(--ink);overflow:hidden}
.area-head{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--area);color:#fff;border-bottom:3px solid var(--ink)}
.area-icon{font-size:34px;line-height:1;width:54px;height:54px;display:flex;align-items:center;justify-content:center;background:#fff;border:2.5px solid var(--ink);border-radius:14px;flex:none;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.area-head h2{margin:0;font-size:18px;font-weight:900;text-shadow:0 2px 0 rgba(0,0,0,.25);line-height:1.3}
.area-head h2 small{display:block;font-size:11.5px;font-weight:700;opacity:.95;text-shadow:none}
.area-prog{margin-left:auto;background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:1px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.area-body{padding:12px 14px 14px}
.area .learn{color:var(--sub);font-size:12.5px;margin-bottom:10px}
.area.locked .area-head{background:#bdb6cc}
.area.locked .area-icon{filter:grayscale(1);opacity:.6}
.stage-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(220px,100%),1fr));gap:10px}
.stage-btn{position:relative;text-align:left;background:#fffdf8;border:2.5px solid var(--ink);border-radius:14px;padding:9px 10px;display:flex;gap:10px;align-items:center;box-shadow:0 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.stage-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 5px 0 var(--ink)}
.stage-btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.stage-btn:disabled{cursor:default;background:#f2eee6;box-shadow:0 2px 0 #b9b2c8;border-color:#b9b2c8;color:#9a93ad}
.stage-btn .num{flex:none;width:42px;height:42px;border-radius:50%;background:var(--area);color:#fff;border:2.5px solid var(--ink);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px}
.stage-btn:disabled .num{background:#d8d2e2;border-color:#b9b2c8}
.stage-btn .bd{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.stage-btn .row{display:flex;justify-content:space-between;align-items:center;gap:6px}
.stage-btn .ttl{font-weight:800;font-size:14.5px;line-height:1.35}
.stage-btn.boss{grid-column:1/-1;background:linear-gradient(100deg,#fff 0%,#ffe9ee 100%)}
.stage-btn.boss .num{width:52px;height:52px;font-size:26px;background:var(--ng)}
.stage-btn .clr{position:absolute;right:-6px;top:-10px;background:var(--mint);color:#fff;font-size:10.5px;font-weight:900;border:2px solid var(--ink);border-radius:8px;padding:0 6px;transform:rotate(8deg)}
.stage-btn .nxt{position:absolute;right:-6px;top:-12px;background:var(--pink);color:#fff;font-size:11px;font-weight:900;border:2px solid var(--ink);border-radius:8px;padding:0 7px;animation:bob 1s ease-in-out infinite}
.stage-btn.next{border-color:var(--pink);box-shadow:0 3px 0 var(--pink),0 0 0 3px #ffd3dc}
@keyframes bob{50%{transform:translateY(-4px)}}
.prep{color:var(--sub);font-size:13px;padding:10px;border:2.5px dashed #c9c1d8;border-radius:12px;text-align:center;font-weight:700}

/* ---------- 案内キャラ ---------- */
.talk{display:flex;gap:10px;align-items:flex-end;margin:0 0 10px}
.mascot{flex:none;width:58px;height:58px}
.mascot svg{width:100%;height:100%;display:block}
.mascot.bounce{animation:hop .9s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-6px)}}
.bubble{position:relative;background:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:8px 12px;font-size:14px;box-shadow:0 3px 0 var(--ink);flex:1;min-width:0}
.bubble::before{content:"";position:absolute;left:-11px;bottom:12px;border:8px solid transparent;border-right:10px solid var(--ink);border-left:0}
.bubble::after{content:"";position:absolute;left:-7px;bottom:14px;border:6px solid transparent;border-right:8px solid #fff;border-left:0}
.bubble b.who{display:block;font-size:11px;color:var(--purple)}
.map .talk{margin:2px 0 16px}

/* ---------- ステージ画面 ---------- */
.stage-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 12px;background:#fff;border-bottom:3px solid var(--ink);position:sticky;top:0;z-index:5;border-top:6px solid var(--area)}
.stage-head .t{font-weight:900;font-size:16px;flex:1 1 auto}
.stage-head .info{font-size:15px}
.stage{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);grid-template-areas:"editor machine" "bottom bottom";gap:12px;padding:12px;padding-bottom:88px;max-width:1500px;margin:0 auto}
.pane{background:#fff;border:2.5px solid var(--ink);border-radius:16px;padding:10px;min-width:0;box-shadow:0 4px 0 var(--ink)}
.pane h3{margin:0 0 8px;font-size:14px;color:var(--ink);font-weight:900;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pane h3 .note{font-weight:normal}
.editor{grid-area:editor}
.machine{grid-area:machine}
.bottom{grid-area:bottom}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;align-items:center}
.toolbar .cnt{margin-left:auto;font-size:13px;color:var(--sub);background:var(--panel2);border:2px solid var(--ink);border-radius:999px;padding:1px 10px}
.toolbar .cnt.good{background:#d4f7e6}
.rung{background:#fbf9ff;background-image:linear-gradient(#efeaf8 1px,transparent 1px),linear-gradient(90deg,#efeaf8 1px,transparent 1px);background-size:16px 16px;border:2px solid #d8d0ea;border-radius:12px;margin-bottom:8px;padding:4px 4px 0}
.rung-head{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--sub);padding:0 4px;flex-wrap:wrap}
.rung-head .n{margin-right:auto;font-weight:900;color:var(--purple)}
.rung-head button{background:#fff;border:2px solid #cfc6e2;border-radius:8px;padding:0 8px;min-height:26px;font-size:12px;color:var(--sub);font-weight:700}
.rung-head button:hover:not(:disabled){color:var(--ink);border-color:var(--ink)}
.rung-head button:disabled{opacity:.4}
.rung-svg{width:100%;height:auto;display:block;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.rung-svg line,.rung-svg path,.rung-svg rect.box,.rung-svg circle.hd{stroke:var(--wire);stroke-width:2.8;fill:none;stroke-linecap:round}
.rung-svg .rail{stroke:var(--rail);stroke-width:5}
.running .rung-svg .rail{stroke:var(--on)}
.rung-svg .pl .ls,.rung-svg .pl.cl .rs,.rung-svg .vl.pl,.rung-svg .out.pl > line{stroke:var(--on);stroke-dasharray:9 6;animation:flow .5s linear infinite}
.rung-svg .pl.cl .sym{stroke:var(--on)}
.rung-svg .out.pl path,.rung-svg .out.pl rect.box{stroke:var(--on)}
@keyframes flow{to{stroke-dashoffset:-15}}
.rung-svg .cfill{fill:transparent;stroke:none}
.rung-svg .cl .cfill{fill:var(--on-dim)}
.rung-svg .out .ofill{fill:transparent;stroke:none}
.rung-svg .out.q .ofill{fill:#7dffb8}
.rung-svg .out.q path,.rung-svg .out.q rect.box{stroke-width:3.5}
.rung-svg text{fill:var(--sub);font-size:11px;font-family:inherit;pointer-events:none}
.rung-svg text.lab{fill:var(--ink);font-size:11.5px;font-weight:700}
.rung-svg text.nm{fill:#e2476f;font-size:11px;font-weight:700}
.rung-svg text.big{fill:var(--ink);font-size:13px;font-weight:900}
.rung-svg text.q{fill:#d99a00;font-size:24px;font-weight:900}
.rung-svg *{pointer-events:none}
.rung-svg .hit,.rung-svg .vhit{pointer-events:all}
.rung-svg .hit{fill:transparent;stroke:none;cursor:pointer}
.rung-svg .hit:hover{fill:rgba(255,194,61,.18)}
.rung-svg .hit.locked{cursor:not-allowed}
.rung-svg .hit.locked:hover{fill:transparent}
.rung-svg .blank{stroke:#cfc6e2;stroke-dasharray:4 4;stroke-width:2;fill:#fff}
.rung-svg .qbox{stroke:#f0a800;stroke-dasharray:6 4;stroke-width:2.5;fill:rgba(255,194,61,.16)}
.rung-svg .vhit{fill:transparent;stroke:none;cursor:pointer}
.rung-svg .vdot{fill:#fff;stroke:#b6abd2;stroke-width:2}
.rung-svg .vhit:hover + .vdot{fill:var(--accent2);stroke:var(--ink)}
.rung-svg .lockmark{fill:var(--lock);font-size:10px}
.rung-svg g.pop{transform-box:fill-box;transform-origin:center;animation:popin .35s cubic-bezier(.3,1.8,.5,1)}
@keyframes popin{0%{transform:scale(.4)}100%{transform:scale(1)}}

/* 機械 */
.mach-wrap{display:flex;flex-direction:column;gap:10px}
.plant{background:linear-gradient(#dff1ff 0%,#eef8ff 70%,#cfe6c8 70%,#bfdcb5 100%);border:2.5px solid var(--ink);border-radius:14px;padding:12px;display:flex;flex-wrap:wrap;gap:14px;justify-content:center;align-items:flex-end;min-height:130px}
.opanel{background:#e3e7f0;background-image:linear-gradient(135deg,rgba(255,255,255,.6),rgba(255,255,255,0));border:2.5px solid var(--ink);border-radius:14px;padding:12px;display:flex;flex-wrap:wrap;gap:14px;justify-content:center;position:relative}
.opanel::before,.opanel::after{content:"";position:absolute;top:6px;width:7px;height:7px;border-radius:50%;background:#9aa3b5;border:1px solid #6b7385}
.opanel::before{left:6px}.opanel::after{right:6px}
.dev{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--sub);text-align:center;min-width:64px}
.dev .ad{font-size:10.5px;color:var(--sub);font-family:Consolas,monospace}
.dev .lbl{color:var(--ink);font-size:12.5px;font-weight:800}
.pb{width:60px;height:60px;border-radius:50%;border:3px solid var(--ink);background:#c9cfda;box-shadow:0 5px 0 var(--ink);touch-action:none;user-select:none;-webkit-user-select:none;position:relative;transition:transform .05s,box-shadow .05s}
.pb i{position:absolute;inset:6px;border-radius:50%;display:block;border:2px solid rgba(0,0,0,.25);box-shadow:inset 0 -5px 0 rgba(0,0,0,.18),inset 0 4px 0 rgba(255,255,255,.35)}
.pb.green i{background:#2fcf73}.pb.red i{background:#ff4f6d}.pb.yellow i{background:#ffc23d}.pb.blue i{background:#3d9bff}.pb.black i{background:#3a3550}
.pb.on{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.pb.on i{filter:brightness(1.25);box-shadow:inset 0 3px 0 rgba(0,0,0,.2)}
.pb.held{outline:3px solid var(--pink);outline-offset:3px}
.sw{width:64px;height:42px;border-radius:10px;background:#c9cfda;border:3px solid var(--ink);position:relative;touch-action:none;box-shadow:0 3px 0 var(--ink)}
.sw::after{content:"";position:absolute;width:12px;height:30px;left:23px;top:3px;background:#fff;border:2px solid var(--ink);border-radius:5px;transform:rotate(-30deg);transition:transform .15s}
.sw.on{background:#b9f0d2}
.sw.on::after{transform:rotate(30deg)}
.sens{width:60px;height:42px;border-radius:8px;background:#c9cfda;border:3px solid var(--ink);position:relative;font-size:11px;font-weight:700;color:var(--sub);touch-action:none;box-shadow:0 3px 0 var(--ink)}
.sens.on{background:#ffe08a;color:var(--ink);box-shadow:0 3px 0 var(--ink),0 0 14px rgba(255,194,61,.9)}
.sens.auto{cursor:default}
.lamp{width:48px;height:48px;border-radius:50%;background:#d6d1e0;border:3px solid var(--ink);box-shadow:inset 0 -5px 0 rgba(0,0,0,.12);transition:background .1s,box-shadow .1s}
.lamp.on{transform:scale(1.06)}
.lamp.on.yellow{background:#ffd84d;box-shadow:0 0 24px 8px rgba(255,200,40,.75),inset 0 -5px 0 rgba(0,0,0,.08)}
.lamp.on.green{background:#4dff8f;box-shadow:0 0 24px 8px rgba(40,220,120,.6),inset 0 -5px 0 rgba(0,0,0,.08)}
.lamp.on.red{background:#ff5a6e;box-shadow:0 0 24px 8px rgba(255,70,90,.6),inset 0 -5px 0 rgba(0,0,0,.08)}
.lamp.on.blue{background:#5ab0ff;box-shadow:0 0 24px 8px rgba(60,150,255,.6),inset 0 -5px 0 rgba(0,0,0,.08)}
.lamp.on.white{background:#fffef2;box-shadow:0 0 24px 8px rgba(255,240,180,.8),inset 0 -5px 0 rgba(0,0,0,.08)}
.motor svg{width:60px;height:60px}
.motor .fan{transform-origin:29px 29px}
.motor.on .fan{animation:spin .5s linear infinite}
.motor.rev.on .fan{animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.conv{width:170px;height:46px;position:relative}
.conv .belt{position:absolute;left:0;right:0;bottom:4px;height:16px;border-radius:8px;background:repeating-linear-gradient(90deg,#5b5470 0 10px,#3f3a52 10px 20px);border:2.5px solid var(--ink)}
.conv.on .belt{animation:belt .4s linear infinite}
.conv.rev.on .belt{animation-direction:reverse}
@keyframes belt{to{background-position:20px 0}}
.conv .box{position:absolute;bottom:22px;left:10px;width:26px;height:20px;background:#e0a35a;border:2.5px solid var(--ink);border-radius:4px}
.conv.on .box{animation:jig .25s ease-in-out infinite}
@keyframes jig{50%{transform:translateY(-2px)}}
.cyl{width:150px;height:40px;position:relative}
.cyl .body{position:absolute;left:0;top:6px;width:70px;height:28px;background:#8aa0c8;border:2.5px solid var(--ink);border-radius:6px}
.cyl .rod{position:absolute;left:70px;top:16px;height:8px;background:#e8ecf5;border:2px solid var(--ink);border-radius:2px}
.cyl .head{position:absolute;top:8px;width:10px;height:24px;background:#ffc23d;border:2px solid var(--ink);border-radius:3px}
.buzz{font-size:32px;line-height:1;filter:grayscale(1) opacity(.5)}
.buzz.on{filter:none;animation:shake .12s linear infinite}
@keyframes shake{0%{transform:rotate(-10deg)}50%{transform:rotate(10deg)}100%{transform:rotate(-10deg)}}
.tank{width:70px;height:90px;border:3px solid var(--ink);border-top:none;border-radius:0 0 10px 10px;position:relative;background:#f5fbff;overflow:hidden}
.tank .lv{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(#6cc4ff,#2f86e0)}
.mach-ctrl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--sub)}
.mach-ctrl label{display:flex;gap:6px;align-items:center;cursor:pointer}
.mach-ctrl .clock{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:800;background:#2b2340;color:#7dffb8;border-radius:8px;padding:1px 10px;font-family:Consolas,monospace}

/* 下部 */
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tabs button{background:#fff;border:2px solid var(--ink);border-radius:999px;padding:3px 14px;color:var(--ink);font-weight:700;font-size:13.5px}
.tabs button.act{background:var(--ink);color:#fff}
.story{color:var(--ink);font-size:14px;margin:0}
.task{font-size:15.5px;margin:0 0 8px;background:var(--panel2);border:2.5px solid var(--ink);border-radius:12px;padding:8px 12px;font-weight:700}
.task::before{content:"📋 おしごと";display:block;font-size:11px;color:#b07800}
.goal{font-size:13px;color:var(--sub)}
table.io{border-collapse:separate;border-spacing:0;width:100%;font-size:13.5px;border:2px solid var(--ink);border-radius:10px;overflow:hidden}
table.io th,table.io td{border-bottom:1px solid var(--soft);border-right:1px solid var(--soft);padding:5px 8px;text-align:left}
table.io th{background:var(--ink);color:#fff;font-weight:700}
table.io td.mono{font-family:Consolas,"Courier New",monospace;color:var(--purple);font-weight:700}
.hint{background:#fff7d6;border:2px solid var(--ink);border-left:8px solid var(--accent);padding:8px 10px;border-radius:10px;margin-bottom:8px}
.ctrlbar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:3px solid var(--ink);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center;z-index:6;flex-wrap:wrap}
.ctrlbar .btn{min-width:90px;font-size:15px}
.ctrlbar .btn.go:not(:disabled){animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 3px 0 var(--ink),0 0 0 0 rgba(34,197,139,.5)}50%{box-shadow:0 3px 0 var(--ink),0 0 0 7px rgba(34,197,139,0)}}

/* モーダル */
.modal-bg{position:fixed;inset:0;background:rgba(43,35,64,.55);display:flex;align-items:center;justify-content:center;z-index:20;padding:12px;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{background:#fff;border:3px solid var(--ink);border-radius:20px;max-width:760px;width:100%;max-height:92vh;overflow:auto;padding:16px 18px;box-shadow:0 6px 0 var(--ink);animation:mpop .3s cubic-bezier(.3,1.6,.5,1)}
@keyframes mpop{from{transform:scale(.8);opacity:0}}
.modal.ng{animation:mpop .3s cubic-bezier(.3,1.6,.5,1),mshake .4s .3s}

.modal h2{margin:0 0 10px;font-size:18px;font-weight:900}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.opt{background:#fff;border:2.5px solid #cfc6e2;border-radius:10px;padding:5px 12px;min-height:40px;font-weight:700}
.opt:hover{border-color:var(--ink)}
.opt.sel{border-color:var(--ink);background:var(--accent);box-shadow:0 2px 0 var(--ink)}
.opt small{color:var(--sub);display:block;font-size:11px;font-weight:normal}
.opt.sel small{color:var(--ink)}
.fieldrow{display:flex;gap:10px;align-items:center;margin:8px 0;flex-wrap:wrap}
.fieldrow input,.fieldrow select{background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:8px;padding:6px 8px;font:inherit;min-height:38px}
.result-ok{color:var(--ok);font-size:20px;font-weight:900}
.result-ng{color:var(--ng);font-size:18px;font-weight:900}
.clear-title{text-align:center;font-size:40px;font-weight:900;margin:0;color:var(--accent);-webkit-text-stroke:2px var(--ink);letter-spacing:4px;animation:zoomin .5s cubic-bezier(.3,1.8,.5,1)}
.clear-title.boss{color:var(--pink)}
@keyframes zoomin{from{transform:scale(.2) rotate(-10deg)}}
.bigstars{font-size:46px;letter-spacing:8px;text-align:center;margin:0 0 4px}
.bigstars .s{display:inline-block;color:var(--accent);-webkit-text-stroke:2px #c98a00;animation:starpop .45s cubic-bezier(.3,1.9,.5,1) both}
.bigstars .s.off{color:#e8dfcc;-webkit-text-stroke:1px #d4c8ae}
@keyframes starpop{from{transform:scale(0) rotate(-120deg);opacity:0}}
.starlist{list-style:none;padding:0;margin:0 0 10px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.starlist li{padding:1px 10px;border:2px solid var(--ink);border-radius:999px;font-size:13px;background:#fff}
.starlist li.got{background:#fff0b3}
.xpgain{text-align:center;font-size:22px;font-weight:900;color:var(--purple)}
.lvup{text-align:center;margin:8px auto;padding:8px 12px;border:3px solid var(--ink);border-radius:14px;background:linear-gradient(90deg,#ff5d8f,#ffc23d,#22c58b,#3d9bff,#8b5cf6);background-size:300% 100%;animation:rainbow 2s linear infinite;color:#fff;font-weight:900;font-size:18px;text-shadow:0 2px 0 rgba(0,0,0,.35);box-shadow:0 4px 0 var(--ink)}
@keyframes rainbow{to{background-position:300% 0}}
.newdex{text-align:center;font-size:13.5px;background:#e6dbff;border:2px solid var(--ink);border-radius:10px;padding:4px 10px;margin:6px 0}
.timeline{font-size:13.5px;background:var(--bg2);border:2px solid var(--ink);border-radius:10px;padding:8px 10px;margin:8px 0}
.timeline div{padding:1px 0}
.timeline .bad{color:var(--ng);font-weight:900}
.dex-item{border:2.5px solid var(--ink);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:#fffdf8;box-shadow:0 3px 0 var(--ink)}
.dex-item.locked{opacity:.55;box-shadow:none;border-style:dashed}
.dex-item h4{margin:0 0 4px;font-size:15px}
.dex-item .op{font-size:12px;color:var(--purple);font-weight:700}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:#fff;border:2.5px solid var(--ink);box-shadow:0 3px 0 var(--ink);padding:7px 16px;border-radius:999px;z-index:40;max-width:90vw;font-weight:700;animation:tdrop .25s cubic-bezier(.3,1.6,.5,1)}
@keyframes tdrop{from{transform:translate(-50%,-20px);opacity:0}}
.preview-svg{background:#fbf9ff;border:2px solid #d8d0ea;border-radius:10px;padding:4px;margin-bottom:6px}
.note{font-size:12.5px;color:var(--sub)}
ol.steps{padding-left:22px;margin:6px 0}
hr.sep{border:none;border-top:2.5px dashed #d8d0ea;margin:14px 0}

/* 紙ふぶき・ステージ開始 */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--r))}}
.intro{position:fixed;inset:0;z-index:25;display:flex;align-items:center;justify-content:center;background:rgba(43,35,64,.5);animation:fade .2s;cursor:pointer}
.intro .card{background:var(--area);color:#fff;border:3px solid var(--ink);border-radius:20px;padding:18px 34px;text-align:center;box-shadow:0 6px 0 var(--ink);animation:slidein .45s cubic-bezier(.3,1.5,.5,1);max-width:92vw}
.intro .card .a{font-size:13px;font-weight:700;opacity:.95}
.intro .card .s{white-space:nowrap;font-size:clamp(30px,10vw,44px);font-weight:900;line-height:1.1;-webkit-text-stroke:2px var(--ink);letter-spacing:2px}
.intro .card .n{font-size:20px;font-weight:900;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.intro.boss .card{background:var(--ng);animation:slidein .45s cubic-bezier(.3,1.5,.5,1),mshake .5s .45s 2}
.intro .card .warn{font-size:15px;font-weight:900;background:var(--ink);border-radius:999px;padding:0 12px;display:inline-block;margin-bottom:4px;animation:blink .4s steps(2) infinite}
@keyframes slidein{from{transform:translateX(-110vw) skewX(-12deg)}}
@keyframes blink{50%{opacity:.3}}

@media (max-width: 860px){
  .stage{grid-template-columns:minmax(0,1fr);grid-template-areas:"bottom" "machine" "editor";padding:8px;padding-bottom:86px;gap:10px}
  .topbar h1{font-size:18px}
  .topbar h1 small{display:none}
  .topbar{position:static}
  .plant,.opanel{padding:8px;gap:10px}
  .ctrlbar{gap:6px;padding-left:8px;padding-right:8px}
  .ctrlbar .btn{min-width:0;flex:1 1 0;padding:7px 2px;white-space:nowrap;font-size:14px}
  .clear-title{font-size:32px}
  .mascot{width:48px;height:48px}
}
/* ---------- 派手な演出 ---------- */
/* 火花(どこでも使う粒) */
.spark{position:fixed;left:0;top:0;width:9px;height:9px;border-radius:50%;pointer-events:none;z-index:45;animation:spk var(--d,.7s) cubic-bezier(.2,.8,.3,1) forwards}
.spark.star{border-radius:0;clip-path:polygon(50% 0,61% 38%,100% 50%,61% 62%,50% 100%,39% 62%,0 50%,39% 38%)}
@keyframes spk{0%{transform:translate(var(--x),var(--y)) scale(1);opacity:1}100%{transform:translate(calc(var(--x) + var(--dx)),calc(var(--y) + var(--dy))) scale(.2) rotate(240deg);opacity:0}}
/* 画面フラッシュ・揺れ */
.flash{position:fixed;inset:0;background:#fff;z-index:44;pointer-events:none;animation:flashA .45s ease-out forwards}
@keyframes flashA{from{opacity:.95}to{opacity:0}}
body.quake{animation:quake .5s}
@keyframes quake{10%,50%,90%{transform:translate(-7px,3px)}30%,70%{transform:translate(7px,-3px)}}
/* 判定中ドラムロール */
.judging{position:fixed;inset:0;z-index:28;background:rgba(43,35,64,.7);display:flex;align-items:center;justify-content:center;padding:12px;animation:fade .15s}
.judging .jb{background:#fff;border:3px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--ink);padding:16px 20px;width:min(420px,100%)}
.judging h2{margin:0 0 10px;text-align:center;font-weight:900;font-size:22px;letter-spacing:2px}
.judging h2 span{display:inline-block;animation:bob .5s ease-in-out infinite}
.judging h2 span:nth-child(2){animation-delay:.08s}.judging h2 span:nth-child(3){animation-delay:.16s}.judging h2 span:nth-child(4){animation-delay:.24s}.judging h2 span:nth-child(5){animation-delay:.32s}
.jrow{display:flex;align-items:center;gap:10px;padding:5px 8px;border:2px solid #e6dcc6;border-radius:10px;margin-bottom:6px;font-weight:700;font-size:14px;opacity:.35}
.jrow .mk{width:28px;height:28px;flex:none;border-radius:50%;border:2.5px solid var(--ink);display:flex;align-items:center;justify-content:center;font-weight:900;background:#fff}
.jrow.run{opacity:1;border-color:var(--accent);background:#fff7d6}
.jrow.run .mk::after{content:"";width:12px;height:12px;border:3px solid var(--ink);border-top-color:transparent;border-radius:50%;animation:spin .5s linear infinite}
.jrow.ok{opacity:1;border-color:var(--mint);background:#dcfaec}
.jrow.ok .mk{background:var(--mint);color:#fff;animation:popin .3s cubic-bezier(.3,1.8,.5,1)}
.jrow.ng{opacity:1;border-color:var(--ng);background:#ffe0e6}
.jrow.ng .mk{background:var(--ng);color:#fff;animation:popin .3s cubic-bezier(.3,1.8,.5,1)}
.bigx{position:fixed;left:50%;top:50%;z-index:46;font-size:min(46vw,260px);font-weight:900;color:var(--ng);-webkit-text-stroke:6px var(--ink);pointer-events:none;line-height:1;animation:bigx .7s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes bigx{0%{transform:translate(-50%,-50%) scale(3) rotate(-30deg);opacity:0}30%{transform:translate(-50%,-50%) scale(1) rotate(0);opacity:1}75%{opacity:1}100%{transform:translate(-50%,-50%) scale(1.1);opacity:0}}
/* クリアの後光 */
.clear-wrap{position:relative;text-align:center;padding:8px 0 2px;overflow:hidden;margin:-16px -18px 0;border-radius:18px 18px 0 0}
.clear-wrap::before{content:"";position:absolute;left:50%;top:50%;width:900px;height:900px;margin:-450px 0 0 -450px;background:repeating-conic-gradient(rgba(255,194,61,.35) 0 10deg,transparent 10deg 20deg);animation:spin 8s linear infinite;z-index:0}
.clear-wrap.boss::before{background:repeating-conic-gradient(rgba(255,93,143,.35) 0 10deg,transparent 10deg 20deg)}
.clear-wrap > *{position:relative;z-index:1}
.clear-title{animation:zoomin .5s cubic-bezier(.3,1.8,.5,1),glow 1.2s .5s ease-in-out infinite}
@keyframes glow{50%{transform:scale(1.07);filter:drop-shadow(0 0 10px #fff3a0)}}
.bigstars .s.on{animation:starpop .45s cubic-bezier(.3,1.9,.5,1) both,twinkle 1.4s ease-in-out infinite}
@keyframes twinkle{50%{filter:drop-shadow(0 0 8px #ffe066) brightness(1.15)}}
/* レベルアップ画面 */
.lvsplash{position:fixed;inset:0;z-index:35;display:flex;align-items:center;justify-content:center;flex-direction:column;background:radial-gradient(circle,#8b5cf6 0%,#3b1f7a 70%);overflow:hidden;cursor:pointer;animation:fade .2s;color:#fff;text-align:center;padding:16px}
.lvsplash::before{content:"";position:absolute;left:50%;top:50%;width:1600px;height:1600px;margin:-800px 0 0 -800px;background:repeating-conic-gradient(rgba(255,255,255,.12) 0 8deg,transparent 8deg 16deg);animation:spin 10s linear infinite}
.lvsplash > *{position:relative}
.lvsplash .big{font-size:clamp(46px,14vw,96px);font-weight:900;line-height:1;color:var(--accent);-webkit-text-stroke:3px var(--ink);text-shadow:0 6px 0 var(--ink);animation:zoomin .6s cubic-bezier(.3,1.8,.5,1),glow 1s .6s ease-in-out infinite;white-space:nowrap}
.lvsplash .lv{font-size:clamp(28px,8vw,48px);font-weight:900;margin-top:12px;animation:slidein .5s .3s cubic-bezier(.3,1.5,.5,1) both}
.lvsplash .lv b{display:inline-block;color:#7dffb8;font-size:1.3em;animation:popin .5s .8s cubic-bezier(.3,1.8,.5,1) both}
.lvsplash .ttl{margin-top:12px;font-size:18px;font-weight:900;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:999px;padding:4px 18px;box-shadow:0 4px 0 var(--ink);animation:popin .5s 1.1s cubic-bezier(.3,1.8,.5,1) both}
.lvsplash .tap{margin-top:18px;font-size:12px;opacity:.8;animation:blink 1s steps(2) infinite}
/* 機械がONになった瞬間 */
.dev .on-burst{animation:onburst .35s cubic-bezier(.3,1.8,.5,1)}
@keyframes onburst{0%{transform:scale(.7)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
/* マップの動く背景 */
.bgdeco{position:fixed;inset:0;pointer-events:none;z-index:-1;overflow:hidden}
.bgdeco span{position:absolute;bottom:-60px;font-size:28px;opacity:.22;animation:floatup linear infinite}
@keyframes floatup{to{transform:translateY(-120vh) rotate(360deg)}}
/* タイトル画面 */
.title-screen{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px 16px;text-align:center;cursor:pointer;animation:fade .5s}
.title-screen .mascot{width:120px;height:120px}
.title-screen h1{margin:0;font-size:clamp(30px,9vw,52px);font-weight:900;line-height:1.15;color:var(--pink);text-shadow:3px 3px 0 var(--accent);letter-spacing:1px}
.title-screen .sub{font-size:14px;color:var(--sub);font-weight:700;margin-top:-6px}
.title-screen .btn{font-size:18px;padding:10px 34px;margin-top:10px}
.title-screen .cont{font-size:13px;color:var(--sub)}
.topbar h1{cursor:pointer}
/* 方針:常に動き続ける飾りは置かない。動きは「操作した瞬間」と「節目」だけ */
.stage-btn .nxt{animation:none}
.xpbar > i{animation:none}
.ctrlbar .btn.go:not(:disabled){animation:none}
.clear-title{animation:zoomin .5s cubic-bezier(.3,1.8,.5,1)}
.bigstars .s.on{animation:starpop .45s cubic-bezier(.3,1.9,.5,1) both}
.clear-wrap::before{content:none}
.clear-wrap.boss::before{content:""}
.lvup{animation:none;background:var(--purple)}
.modal.ng{animation:mpop .3s cubic-bezier(.3,1.6,.5,1)}
.judging h2 span{animation:none}
.intro.boss .card{animation:slidein .45s cubic-bezier(.3,1.5,.5,1)}
.intro .card .warn{animation:none}

/* ---------- 1画面で遊べる配置(ラダー図を上に、常に通電) ---------- */
.stage{grid-template-areas:"mission mission" "editor machine" "bottom bottom"}
.mission{grid-area:mission;background:#fff;border:2.5px solid var(--ink);border-left:10px solid var(--area);border-radius:14px;padding:8px 12px;font-weight:800;font-size:15.5px;line-height:1.45;box-shadow:0 3px 0 var(--ink)}
.mission .chip{display:inline-block;font-size:11px;font-weight:900;background:var(--ink);color:#fff;border-radius:999px;padding:0 9px;margin-right:8px;vertical-align:2px}
.rstat{font-size:13px;font-weight:800;padding:4px 10px;margin:2px 2px 6px;border-radius:8px;background:#f1edf8;color:var(--sub);min-height:1.6em}
.rstat.ok{background:#dcfaec;color:#137a4b}
.rstat.ng{background:#ffe6eb;color:#c0294a}
.rstat:empty{display:none}
.rung-svg .xbg,.rung-svg .xm{display:none}
.rung-svg .xbg{fill:var(--ng);stroke:var(--ink);stroke-width:1.5}
.rung-svg .xm{fill:#fff;font-size:11px;font-weight:900}
.rung-svg .cell.blk .xbg,.rung-svg .cell.blk .xm{display:inline}
.rung-svg .cell.blk .sym{stroke:var(--ng)}
.rung-svg .cell.blk .blank{stroke:var(--ng);stroke-dasharray:none}
.ctrlbar .btn.primary{flex:1.4 1 0}
@media (max-width: 860px){
  .stage{grid-template-areas:"mission" "editor" "machine" "bottom";gap:8px;padding:6px 6px 80px}
  .mission{font-size:14.5px;padding:6px 10px}
  .stage-head{padding:6px 8px;gap:6px;flex-wrap:nowrap}

  .editor h3,.machine h3{display:none}
  .toolbar{margin-bottom:4px;gap:4px}
  .toolbar .btn.small{padding:2px 8px;font-size:12px;min-height:30px}
  .toolbar .cnt{font-size:12px}
  .rung{margin-bottom:4px}
  .mach-wrap{flex-direction:row;flex-wrap:wrap;gap:6px}
  .plant{flex:1 1 52%;min-height:0;padding:6px;gap:8px}
  .opanel{flex:1 1 38%;padding:6px;gap:8px;align-items:center}
  .mach-ctrl{flex:1 1 100%;font-size:12px}
  .dev{min-width:54px}

  .cyl{width:120px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important}
}

     ステージデータ
     ステージを増やすときは、このブロックの STAGES に追記するだけでよい。
     ===================================================================== -->
<script id="stage-data">
/*
 ラダーの書き方(answer / start 共通)
   1ラング = { r: [行0, 行1, ...], o: 出力 }

     a:I0.0  … a接点(%IX0.0)     b:I0.1 … b接点
     -       … 横線               .      … 空き
     ?       … 穴埋めの空欄(穴埋めステージ用。それ以外は固定)
     +       … 直前のマスの右側に、下の行への縦線
   出力: 'Q0.0'(コイル) / 'TON T0 2000'(ms) / 'TOF T0 1000' / 'CTU C0 3 I0.2'(PV, リセット) / 'CTD C0 3 I0.2'(PV, LD) / '?'(空欄)
 テスト: s: [[時刻ms, '入力', '期待出力'], ...]   例 [0,'I0.0=1',''] [200,'','Q0.0=1']
   入力はその時刻に変化させ、期待出力はその時刻のスキャン後に照合する。
 forbid: [{all:['Q0.0','Q0.1'], msg:'…'}] … どの時点でも同時ONなら不合格
*/

  {no:7, name:'検定の頂',     icon:'⛰️', color:'#e0a100', learn:'1級風の複合課題、接点数制限、制限時間'},
];

const STAGES = [
  // ---------------- エリア1 はじまりの村 ----------------
  {
    id:'1-1', area:1, title:'灯りをともせ', type:'build',
    story:'はじまりの村にやってきた。村の入口の灯りがつかない…。制御盤を開けると、ラダー図はまっさらだ。',

    target:1,
    tests:[
      {name:'押していないときは消灯', s:[[0,'',''],[300,'','Q0.0=0']]},

<!-- =====================================================================
     エンジン(シミュレータ・エディタ・機械表示・進捗保存)
     ===================================================================== -->
<script id="engine">
'use strict';
const SCAN_MS = 10;            // 1スキャン = 10ms(シミュレーション時間)
const SAVE_KEY = 'ladderQuest_v1';
const TYPE_NAME = {build:'組む', fill:'穴埋め', bug:'バグ探し', short:'最短挑戦'};

/* ---------- アドレス ---------- */
function A(s){
  if(s==null) return s;
  s = String(s).trim();
  if(s[0]==='%') return s.toUpperCase();
  const m = /^([IQM])(\d+)\.([0-7])$/i.exec(s);
  if(m) return '%'+m[1].toUpperCase()+'X'+m[2]+'.'+m[3];
  return s.toUpperCase();
}
function kindOf(a){
  if(!a) return '?';
  if(a.startsWith('%IX')) return 'I';
  if(a.startsWith('%QX')) return 'Q';
  if(a.startsWith('%MX')) return 'M';
  if(a[0]==='T') return 'T';
  if(a[0]==='C') return 'C';
  return '?';
}
function dispAddr(a){ const k=kindOf(a); return (k==='T'||k==='C') ? a+'.Q' : a; }
const clone = o => JSON.parse(JSON.stringify(o));

/* ---------- ラダーの記述(DSL)を読み込む ---------- */
function parseOut(s){
  if(s==null || s==='' || s==='?') return null;
  const p = String(s).trim().split(/\s+/);
  if(p.length===1) return {t:'COIL', a:A(p[0])};
  if(p[0]==='TON'||p[0]==='TOF') return {t:p[0], n:p[1].toUpperCase(), pt:+p[2]};
  if(p[0]==='CTU'||p[0]==='CTD') return {t:p[0], n:p[1].toUpperCase(), pv:+p[2], r:p[3]?A(p[3]):null};
  throw new Error('出力の書式エラー: '+s);
}
function parseRung(def, cols){
  const rows = Array.isArray(def.r) ? def.r : [def.r];
  const R = rows.length;
  const rung = {cells:[], v:[], lock:[], olock: def.o!=='?'};
  for(let r=0;r<R;r++){
    rung.cells.push(Array(cols).fill(null));
    rung.lock.push(Array(cols).fill(true));
    if(r<R-1) rung.v.push(Array(cols+1).fill(false));
  }
  rows.forEach((str,r)=>{
    let c=0;
    str.trim().split(/\s+/).filter(Boolean).forEach(tok=>{
      if(tok==='+'){
        if(r>=R-1 || c===0) throw new Error('縦線の位置エラー: '+str);
        rung.v[r][c]=true; return;
      }
      if(c>=cols) throw new Error('列があふれています: '+str);
      let cell=null, lk=true;
      if(tok==='.') cell=null;
      else if(tok==='-') cell={t:'W'};
      else if(tok==='?') { cell=null; lk=false; }
      else {
        const m=/^([ab]):(.+)$/.exec(tok);
        if(!m) throw new Error('トークンの書式エラー: '+tok);
        cell={t: m[1]==='a'?'NO':'NC', a:A(m[2])};
      }
      rung.cells[r][c]=cell; rung.lock[r][c]=lk; c++;
    });
  });
  rung.out = parseOut(def.o);
  return rung;
}
function parseProg(defs, cols){ return (defs||[]).map(d=>parseRung(d, cols)); }
function newRung(cols){
  return {cells:[Array.from({length:cols},()=>({t:'W'}))], v:[], lock:null, olock:false, out:null};
}
function countContacts(prog){
  let n=0;
  for(const rg of prog) for(const row of rg.cells) for(const c of row) if(c && (c.t==='NO'||c.t==='NC')) n++;
  return n;
}

/* ---------- PLCシミュレータ(スキャン方式) ---------- */
class PLC {
  constructor(){ this.reset(); }
  reset(){ this.mem={}; this.tm={}; this.ct={}; this.inputs={}; this.time=0; this.vis=null; }
  get(a){
    const k=kindOf(a);
    if(k==='T') return !!(this.tm[a] && this.tm[a].q);
    if(k==='C') return !!(this.ct[a] && this.ct[a].q);
    return !!this.mem[a];
  }
  conducts(cell){
    if(!cell) return false;
    if(cell.t==='W') return true;
    if(!cell.a) return false;
    const v=this.get(cell.a);
    return cell.t==='NO' ? v : !v;
  }
  // 1ラングの通電計算:左母線から右へ、境界ごとに通電を広げる(右→左の逆流はしない)
  evalRung(rung){
    const R=rung.cells.length, C=rung.cells[0].length;
    let prev=Array(R).fill(true);              // 境界0 = 左母線
    const nodes=[prev], closed=rung.cells.map(row=>row.map(()=>false));
    for(let b=1;b<=C;b++){
      const cur=Array(R).fill(false);
      for(let r=0;r<R;r++){
        const cond=this.conducts(rung.cells[r][b-1]);
        closed[r][b-1]=cond;
        if(cond && prev[r]) cur[r]=true;
      }
      if(R>1){
        let ch=true;
        while(ch){ ch=false;
          for(let r=0;r<R-1;r++){
            if(rung.v[r] && rung.v[r][b] && cur[r]!==cur[r+1]){ cur[r]=cur[r+1]=true; ch=true; }
          }
        }
      }
      nodes.push(cur); prev=cur;
    }
    return {power:prev[0], nodes, closed};
  }
  doOut(o, p, dt){
    if(!o) return;
    if(o.t==='COIL'){ if(o.a) this.mem[o.a]=p; return; }
    if(o.t==='TON'){
      const t=this.tm[o.n]||(this.tm[o.n]={et:0,q:false,in:false});
      t.type='TON'; t.pt=o.pt;
      if(p){ t.et = t.in ? Math.min(o.pt, t.et+dt) : 0; t.q = t.et>=o.pt; }
      else { t.et=0; t.q=false; }
      t.in=p; return;
    }
    if(o.t==='TOF'){
      const t=this.tm[o.n]||(this.tm[o.n]={et:0,q:false,in:false});
      t.type='TOF'; t.pt=o.pt;
      if(p){ t.q=true; t.et=0; }
      else {
        if(t.in) t.et=0; else if(t.q) t.et=Math.min(o.pt, t.et+dt);
        if(t.q && t.et>=o.pt) t.q=false;
      }
      t.in=p; return;
    }
    if(o.t==='CTU'){
      const c=this.ct[o.n]||(this.ct[o.n]={cv:0,q:false,in:false});
      c.type='CTU'; c.pv=o.pv;
      if(o.r && this.get(o.r)) c.cv=0;
      else if(p && !c.in) c.cv=Math.min(32767,c.cv+1);
      c.in=p; c.q = c.cv>=o.pv; return;
    }
    if(o.t==='CTD'){
      const c=this.ct[o.n]||(this.ct[o.n]={cv:0,q:true,in:false});
      c.type='CTD'; c.pv=o.pv;
      if(o.r && this.get(o.r)) c.cv=o.pv;
      else if(p && !c.in && c.cv>0) c.cv--;
      c.in=p; c.q = c.cv<=0; return;
    }
  }
  scan(prog, dt){
    for(const a in this.inputs) this.mem[a]=!!this.inputs[a];   // 入力リフレッシュ
    const vis=[];
    for(const rung of prog){                                   // 上から下へ
      const res=this.evalRung(rung);
      this.doOut(rung.out, res.power, dt);
      vis.push(res);
    }
    this.time+=dt; this.vis=vis;
  }
}

/* ---------- テスト(合否判定) ---------- */
function parseAssign(s){
  const o={};
  if(!s) return o;
  for(const part of String(s).trim().split(/\s+/).filter(Boolean)){
    const [k,v]=part.split('=');
    o[A(k)] = (v==='1');
  }
  return o;
}
function normTest(t){
  return {name:t.name, steps:t.s.map(([tm,i,e])=>({t:tm, in:parseAssign(i), ex:parseAssign(e)})).sort((a,b)=>a.t-b.t)};
}
function runOneTest(prog, test, stage){
  const plc=new PLC();
  const steps=test.steps;
  const end=Math.max(...steps.map(s=>s.t));
  const applied=steps.map(()=>false), checked=steps.map(()=>false);
  const forbid=(stage.forbid||[]).map(f=>({all:f.all.map(A), msg:f.msg}));
  for(let tau=0; tau<=end; tau+=SCAN_MS){
    steps.forEach((s,i)=>{ if(!applied[i] && s.t<=tau){ Object.assign(plc.inputs, s.in); applied[i]=true; } });
    plc.scan(prog, SCAN_MS);
    for(const f of forbid){
      if(f.all.every(a=>plc.get(a))) return {ok:false, t:tau, forbid:f, steps};
    }
    for(let i=0;i<steps.length;i++){
      const s=steps[i];
      if(checked[i] || s.t>tau) continue;
      checked[i]=true;
      for(const a in s.ex){
        const act=plc.get(a);
        if(act!==s.ex[a]) return {ok:false, t:s.t, addr:a, exp:s.ex[a], act, steps};
      }
    }
  }
  return {ok:true};
}
function runAllTests(prog, stage){
  const P=prep(stage);
  for(let i=0;i<P.tests.length;i++){
    const r=runOneTest(prog, P.tests[i], stage);
    if(!r.ok) return Object.assign(r,{idx:i, name:P.tests[i].name});
  }
  return {ok:true};
}

/* ---------- ステージ前処理 ---------- */
const PREP={};
function prep(st){
  if(PREP[st.id]) return PREP[st.id];
  const cols=st.cols||5;
  const P={
    cols, maxRows:st.maxRows||3, maxRungs:st.maxRungs||6,
    io:(st.io||[]).map(x=>Object.assign({},x,{a:A(x.a)})),
    mem:(st.mem||[]).map(x=>Object.assign({},x,{a:A(x.a)})),
    timers:st.timers||[], counters:st.counters||[],
    answer:parseProg(st.answer, cols),
    start: st.start ? parseProg(st.start, cols) : null,
    wrong:(st.wrong||[]).map(w=>parseProg(w, cols)),
    tests:st.tests.map(normTest),
    palette:st.palette||['NO','NC','COIL'],
  };
  P.target = st.target!=null ? st.target : countContacts(P.answer);
  PREP[st.id]=P;
  return P;
}
function nameOf(st, a){
  const P=prep(st);
  const f=P.io.concat(P.mem).find(x=>x.a===a);
  if(f) return f.name;
  const k=kindOf(a);
  if(k==='T'||k==='C') return a+'.Q';
  return '';
}
function areaStages(no){ return STAGES.filter(s=>s.area===no); }

/* ---------- 自己点検(コンソールから selfTest() で実行可) ---------- */
function selfTest(){
  const rep=[];
  for(const st of STAGES){
    const P=prep(st), row={id:st.id, answer:false, empty:false, start:null, wrong:[]};
    row.answer = runAllTests(P.answer, st).ok;
    row.empty  = !runAllTests([newRung(P.cols)], st).ok && !runAllTests([], st).ok;
    if(P.start) row.start = !runAllTests(P.start, st).ok;
    row.wrong = P.wrong.map(w=>!runAllTests(w, st).ok);
    row.pass = row.answer && row.empty && (row.start!==false) && row.wrong.every(x=>x);
    rep.push(row);
  }
  return rep;
}

/* ---------- 進捗データ ---------- */
function defaultSave(){ return {v:1, xp:0, stages:{}, dex:[], streak:{last:null,count:0,best:0}, drafts:{}}; }

}

const TITLES=[[1,'見習い'],[3,'新人オペレータ'],[5,'配線工'],[8,'保全マン'],[12,'制御技師'],[16,'熟練技師'],[20,'技能士']];

function lvlRange(L){ return [25*(L-1)*L, 25*L*(L+1)]; }

/* =====================================================================
   ここから画面(ブラウザでのみ実行)

const G = { save:null, stage:null, prog:null, plc:new PLC(), running:false, acc:0, last:0,
            hold:false, tab:'task', phys:{}, raf:0 };

function persist(){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(G.save)); }
  catch(e){ if(!G.warned){ G.warned=true; toast('ブラウザに保存できませんでした(データ→JSONに書き出すで保存してください)'); } }
}
function stRec(id){ return G.save.stages[id] || (G.save.stages[id]={cleared:false, stars:[false,false,false], best:null, hints:0}); }
function isCleared(id){ const r=G.save.stages[id]; return !!(r && r.cleared); }
function areaReady(no){ return areaStages(no).length>0; }
function areaUnlocked(no){
  if(!areaReady(no)) return false;
  if(no===1) return true;
  const prev=areaStages(no-1);
  return prev.length>0 && isCleared(prev[prev.length-1].id);
}
function stageUnlocked(st){
  if(!areaUnlocked(st.area)) return false;
  const list=areaStages(st.area), i=list.indexOf(st);
  return i===0 || isCleared(list[i-1].id);
}
function touchStreak(){
  const now=new Date(), today=ymd(now);
  const y=new Date(now.getFullYear(), now.getMonth(), now.getDate()-1);
  const s=G.save.streak;
  if(s.last===today) return;
  s.count = (s.last===ymd(y)) ? s.count+1 : 1;
  s.last=today; s.best=Math.max(s.best||0, s.count);
  persist();
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg){
  const d=document.createElement('div'); d.className='toast'; d.textContent=msg;
  document.body.appendChild(d); setTimeout(()=>d.remove(), 2600);
}
function starsHTML(arr){ return '<span class="stars">'+arr.map(b=>b?'★':'<span class="off">★</span>').join('')+'</span>'; }
function areaColor(no){ const a=AREAS[no-1]; return (a && a.color) || '#ff9f43'; }

/* ---------- 案内キャラ「リレーくん」(見た目だけの演出) ---------- */

function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
const LINES = {
  fail:['おしい!どこでずれたか、下の流れを見てみよう。','だいじょうぶ、実機でもよくあることだよ。','同じ順番でボタンを押してみると、原因が見えるかも!','あと一歩!接点の向き(a/b)も見直してみてね。'],

function confetti(n){

/* ---------- 効果音(Web Audioで合成。外部ファイルなし) ---------- */
const SFX = {
  ctx:null,
  on(){ try{ return localStorage.getItem('ladderQuest_sound')!=='off'; }catch(e){ return true; } },
  set(v){ try{ localStorage.setItem('ladderQuest_sound', v?'on':'off'); }catch(e){} },
  ac(){
    if(!this.on()) return null;
    try{
      if(!this.ctx){ const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; this.ctx=new C(); }
      if(this.ctx.state==='suspended') this.ctx.resume();
      return this.ctx;
    }catch(e){ return null; }
  },
  tone(f, t0, dur, type, vol, f2){
    const c=this.ac(); if(!c) return;
    const t=c.currentTime+(t0||0), o=c.createOscillator(), g=c.createGain();
    o.type=type||'square'; o.frequency.setValueAtTime(f,t);
    if(f2) o.frequency.exponentialRampToValueAtTime(f2, t+dur);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol||0.12, t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+0.02);
  },
  noise(t0, dur, vol){
    const c=this.ac(); if(!c) return;
    const t=c.currentTime+(t0||0), n=Math.floor(c.sampleRate*dur), b=c.createBuffer(1,n,c.sampleRate), d=b.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
    const s=c.createBufferSource(), g=c.createGain(), f=c.createBiquadFilter();
    f.type='bandpass'; f.frequency.value=1800; s.buffer=b; g.gain.value=vol||0.15;
    s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);
  },
  play(name){
    const T=(...a)=>this.tone(...a);
    switch(name){
      case 'click': T(660,0,.05,'square',.06); break;
      case 'place': T(520,0,.06,'square',.08); T(880,.05,.09,'square',.08); break;
      case 'remove': T(400,0,.08,'triangle',.1,200); break;
      case 'press': T(300,0,.05,'square',.07); break;
      case 'outOn': T(1200,0,.05,'triangle',.05); break;
      case 'run': T(392,0,.07,'square',.08); T(523,.07,.07,'square',.08); T(784,.14,.12,'square',.08); break;
      case 'stop': T(523,0,.08,'square',.07); T(330,.08,.14,'square',.07); break;
      case 'tick': T(880,0,.04,'square',.05); break;
      case 'testOk': T(988,0,.06,'square',.08); T(1319,.06,.1,'square',.08); break;
      case 'drum': for(let i=0;i<10;i++) this.noise(i*.05,.04,.06); break;
      case 'fail': T(523,0,.16,'triangle',.12); T(392,.16,.3,'triangle',.12); break;
      case 'clear': [523,659,784,1047].forEach((f,i)=>T(f,i*.09,.12,'square',.1)); T(784,.4,.1,'square',.1); T(1047,.5,.5,'square',.11); T(1319,.5,.5,'triangle',.07); break;
      case 'boss': [392,523,659,784,659,784].forEach((f,i)=>T(f,i*.11,.13,'square',.1)); T(1047,.7,.8,'square',.12); T(523,.7,.8,'triangle',.1); this.noise(.7,.4,.12); break;
      case 'star': T(1568,0,.08,'triangle',.09); T(2093,.06,.15,'triangle',.08); break;
      case 'lvup': [523,659,784,1047,1319,1568].forEach((f,i)=>T(f,i*.07,.1,'square',.09)); T(2093,.45,.6,'triangle',.1); T(1047,.45,.6,'square',.08); break;
      case 'intro': T(200,0,.25,'sawtooth',.06,1200); this.noise(0,.25,.06); break;

      case 'hint': T(740,0,.08,'sine',.12); T(988,.08,.16,'sine',.1); break;

/* ---------- 派手な演出の部品 ---------- */
function reduced(){ return window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches; }
function burst(x, y, n, opt){
  if(reduced()) return;
  opt=opt||{};
  const cols=opt.colors||['#ff5d8f','#ffc23d','#22c58b','#3d9bff','#8b5cf6','#fff'];
  for(let i=0;i<n;i++){
    const p=document.createElement('i');
    p.className='spark'+(i%2?' star':'');
    const a=Math.random()*Math.PI*2, sp=(opt.power||90)*(0.5+Math.random());
    const sz=(opt.size||9)*(0.6+Math.random()*0.8);
    p.style.width=p.style.height=sz+'px';
    p.style.background=cols[i%cols.length];
    p.style.setProperty('--x',(x-sz/2)+'px'); p.style.setProperty('--y',(y-sz/2)+'px');
    p.style.setProperty('--dx',Math.cos(a)*sp+'px'); p.style.setProperty('--dy',(Math.sin(a)*sp+(opt.fall||0))+'px');
    p.style.setProperty('--d',(0.5+Math.random()*0.5)*(opt.dur||1)+'s');
    if(opt.delay) p.style.animationDelay=opt.delay+'s';
    document.body.appendChild(p);
    setTimeout(()=>p.remove(), 1600+(opt.delay||0)*1000);
  }
}
function burstAt(el, n, opt){ if(!el) return; const r=el.getBoundingClientRect(); burst(r.left+r.width/2, r.top+r.height/2, n, opt); }
function fireworks(k){
  if(reduced()) return;
  for(let i=0;i<k;i++){
    setTimeout(()=>{
      burst(innerWidth*(0.15+Math.random()*0.7), innerHeight*(0.12+Math.random()*0.4), 34, {power:140, size:10, fall:40, dur:1.4});
      SFX.noise(0,.12,.05);
    }, i*260);
  }
}
function flash(){ if(reduced()) return; const f=document.createElement('div'); f.className='flash'; document.body.appendChild(f); setTimeout(()=>f.remove(),500); }
function quake(){ if(reduced()) return; document.body.classList.remove('quake'); void document.body.offsetWidth; document.body.classList.add('quake'); setTimeout(()=>document.body.classList.remove('quake'),550); }
function bgDecoHTML(){
  const items=['⚙️','⚡','💡','🔩','⚙️','✨','⚡','🔧'];
