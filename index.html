  if(land){
    const vh=Math.max(320, innerHeight - wrap.getBoundingClientRect().top - 10);
    size=Math.min(vh*0.62, 300);
    ww=Math.max(wrap.clientWidth, size*(N*0.95+0.6)); wh=vh;
    for(let i=0;i<N;i++) pts.push([size*0.75+i*size*0.95, wh*(i%2? .42:.58)]);
  } else {
    const vw=wrap.clientWidth;
    size=Math.min(vw*0.66, 420);
    ww=vw; wh=size*(N*0.9+0.55);
    for(let i=0;i<N;i++) pts.push([ww*(i%2? .64:.36), wh-size*0.55-i*size*0.9]);   // 下から上へ
  }
  W.style.width=ww+'px'; W.style.height=wh+'px';
  wrap.classList.toggle('land', land);
  const cur=AREAS.findIndex(a=>areaUnlocked(a.no) && areaStats(a.no).nClr<areaStats(a.no).list.length);
  let html='', lamps=[];
  AREAS.forEach((ar,i)=>{
    const I=ISLES[ar.no]||ISLES[1], w=size*(I.s||1), hgt=w/I.ar, [x,y]=pts[i];
    const ready=areaReady(ar.no), un=areaUnlocked(ar.no), {list,nStar}=areaStats(ar.no);
    const lx=I.lamp[0]*w, ly=I.lamp[1]*hgt;
    lamps.push([x-w/2+lx, y-hgt/2+ly]);
    html+=`<button class="isl ${un?'lit':'lock'}" data-act="isl" data-no="${ar.no}" style="left:${x}px;top:${y}px;width:${w}px;--area:${ar.color}" aria-label="エリア${ar.no} ${esc(ar.name)}">
      <img src="${IMG_BASE}${I.img}" alt="" draggable="false"><i class="glow" style="left:${lx}px;top:${ly}px"></i>
      ${i===cur?'<span class="isl-next">NEXT</span>':''}
      <span class="plate"><span class="n">エリア${ar.no}</span><span class="t">${esc(ar.name)}</span>
      <span class="s">${!ready?'準備中':!un?ic('lock'):'★ '+nStar+' / '+list.length*3}</span></span></button>`;
  });
  let svg='';
  for(let i=0;i<N-1;i++){
    const [x1,y1]=lamps[i],[x2,y2]=lamps[i+1];
    const d=`M${x1} ${y1} Q${(x1+x2)/2} ${Math.max(y1,y2)+size*0.10} ${x2} ${y2}`;
    const on=areaUnlocked(AREAS[i+1].no);
    svg+=`<path class="cable off" d="${d}"/>`;
    if(on) svg+=`<path class="cable on ${G.flowTo===i+2&&!reduced()?'flow':''}" pathLength="1" d="${d}"/>`;
  }
  W.innerHTML=html+`<svg class="cables" viewBox="0 0 ${ww} ${wh}">${svg}</svg>`;
  if(G.flowTo){ const k=G.flowTo; setTimeout(()=>{ if(G.flowTo===k){ SFX.play('outOn'); } }, 900); G.flowTo=0; }
  if(scroll){
    const p=pts[Math.max(0,cur)];
    setTimeout(()=>{
      if(land) wrap.scrollLeft=Math.max(0,p[0]-wrap.clientWidth/2);
      else { const top=W.getBoundingClientRect().top+scrollY, f=document.body.classList.contains('prologue')?0.3:0.45;
        window.scrollTo(0, Math.max(0, top+p[1]-innerHeight*f)); }
    }, 30);
  }
}

/* ---------- ステージ画面 ---------- */
function openStage(st){
  if(!st) return;
  if(G.replay){ const R=G.replay; R.timers.forEach(t=>{ if(t && t.clear) t.clear(); else clearTimeout(t); }); R.bar.remove(); G.replay=null; }
  touchStreak();
  stopRun(); stopCoach();
  document.querySelectorAll('.prolog').forEach(e=>e.remove());
  document.body.classList.remove('on-map','prologue'); document.body.classList.add('on-stage'); closeAreaSheet();
  G.stage=st; G.tab='task'; G.latch=new Set(); G.tapInfo={}; G.mapArea=st.area; G.tool=null;
  setupHandDrag();
  const P=prep(st);
  let d=st.tutorial ? null : G.save.drafts[st.id];      // チュートリアルは毎回まっさらから
  if(d && guideOn(st) !== !!(d[0] && d[0].guide)) d=null;  // ガイド枠の有無が変わったら、作りかけは使わない
  G.prog = d ? clone(d) : initialProg(st);
  G.plc=new PLC(); G.running=false; resetPhys();
  renderStage();
  // 初めて出てくる言葉があれば、ステージの前に「新しいことば」を見せる(大きな STAGE 表示の代わり)
  const fresh=(st.tutorial?[]:STAGE_TERMS[st.id]||[]).filter(k=>TERMS[k] && !(G.save.seenTerms||[]).includes(k));
  if(fresh.length) termPreview(st, fresh); else stageIntro(st);
  if(st.tutorial) setTimeout(()=>{ if(G.stage===st) startCoach(); }, reduced()?100:1600);
}
/* ---------- ことば(用語を、はじめての人にも分かる言葉で) ----------

// ステージごとに、初めて出てくることば
const STAGE_TERMS = {
  '1-1':['ラダー図','ラング','接点','a接点','コイル'], '1-2':['b接点'], '1-3':['直列'], '1-4':['並列','枝分かれ'],
  '2-1':['自己保持'], '2-2':['停止優先'], '2-3':['起動優先'], '2-4':['インターロック','正転・逆転'],
  '3-1':['タイマ','TON'], '3-2':['TOF'], '3-3':['点滅'],
  '4-1':['実習機','センサ','出力','入力'], '4-3':['手動運転'], '4-4':['サイクル動作','内部リレー','工程'], '4-5':['手動・自動'],
  '5-1':['非常停止','リセット'], '5-2':['異常'], '5-4':['連続運転'],
};
// 文章の中の用語を、タップできる形にする(同じ用語は最初の1回だけ。タグの中は触らない)
// js/ の追加ファイルが用語を足したら buildTermRe() で作り直す
function buildTermRe(){ return new RegExp('('+Object.keys(TERMS).sort((a,b)=>b.length-a.length).map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','g'); }
let TERM_RE = new RegExp('('+Object.keys(TERMS).concat(['正転','逆転','停止ボタン']).filter(k=>TERMS[k]).sort((a,b)=>b.length-a.length).map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','g');
function termify(html, seen){
  seen=seen||new Set();
  return String(html).split(/(<[^>]+>)/).map(part=>{
    if(part.startsWith('<')) return part;
    return part.replace(TERM_RE, w=>{ if(seen.has(w)) return w; seen.add(w); return `<button type="button" class="term" data-term="${w}">${w}</button>`; });
  }).join('');
}
function termCard(k){
  const t=TERMS[k]; if(!t) return '';
  const icon = k==='a接点'?toolIcon('NO') : k==='b接点'?toolIcon('NC') : k==='コイル'?toolIcon('COIL') : '';
  return `<div class="tcard">${icon?`<div class="ti">${icon}</div>`:''}<div class="tt"><b>${esc(k)}</b><small>${esc(t.yomi)}</small><p>${esc(t.plain)}</p><p class="tex">例:${esc(t.ex)}</p></div></div>`;
}
function showTerm(k){
  document.querySelectorAll('.term-pop').forEach(e=>e.remove());
  if(!TERMS[k]) return;
  const d=document.createElement('div'); d.className='term-pop';
  d.innerHTML=`${termCard(k)}<button class="btn small" data-tclose="1">閉じる</button>`;
  document.body.appendChild(d); SFX.play('click');
  const close=e=>{ if(e && e.target.closest && e.target.closest('.term-pop') && !e.target.closest('[data-tclose]')) return; d.remove(); document.removeEventListener('pointerdown', close, true); };
  setTimeout(()=>document.addEventListener('pointerdown', close, true), 0);
  d.querySelector('[data-tclose]').onclick=()=>close();
}
document.addEventListener('click', e=>{
  const t=e.target.closest && e.target.closest('.term'); if(!t) return;
  e.preventDefault(); e.stopPropagation(); showTerm(t.dataset.term);
}, true);
// ことば帳:用語の説明をまとめて読む。まだ出てきていない言葉は「エリアNで登場」とだけ出す

function termPreview(st, keys){

function initialProg(st){
  const P=prep(st);
  if(guideOn(st)) return guideProg(P);
  return P.start ? clone(P.start) : [newRung(P.cols)];
}
/* ---------- ガイド枠(エリア1〜2の「組む」ステージ) ----------
   模範解答の形から、接点を置く場所だけを点線の枠にして残す。横線・縦線(並列の分かれ道)は最初から描いておき、動かせない */
// 2026-11-17:置ける場所を決めるのはやめ、どこにでも置ける形にした(ガイド枠は使わない)
function guideOn(st){ return false; }
function guideProg(P){
  return P.answer.map(src=>{
    const g=clone(src); g.guide=true; g.olock=false; g.out=null;
    g.lock=g.cells.map(row=>row.map(()=>true));
    g.cells.forEach((row,r)=>row.forEach((c,ci)=>{ if(c && (c.t==='NO'||c.t==='NC')){ row[ci]=null; g.lock[r][ci]=false; } }));
    return g;
  });
}
function saveDraft(){ if(G.stage){ G.save.drafts[G.stage.id]=G.prog; persist(); } }

// 問題文:「目的」+「何をしたら → どうなればOKか」の一覧。{PB1|起動ボタン} は「起動ボタン」+小さく部品名
function fillNames(st, text){
  const P=prep(st);
  return esc(text).replace(/\{([A-Za-z0-9]+)(?:\|([^}]+))?\}/g, (m, sym, label)=>{
    const io=P.io.find(x=>x.name===sym);
    const shown=io ? showName(st, io.a) : sym;
    if(!label) return `<b class="nm">${esc(shown)}</b>`;
    return `<b class="nm">${label}${shown && shown!==label ? `<small>${esc(shown)}</small>` : ''}</b>`;
  });
}
function missionHTML(st){ return termify(missionRaw(st)); }
function missionRaw(st){
  if(!st.steps) return `<span class="chip">依頼</span>${esc(nameText(st, st.task))}`;
  const list=`<ol class="msteps">${st.steps.map(([d,r])=>`<li><span class="mdo">${fillNames(st,d)}</span><span class="marr">→</span><span class="mres">${fillNames(st,r)}</span></li>`).join('')}</ol>
    ${st.tip?`<div class="mtip">${fillNames(st,st.tip)}</div>`:''}`;
  // 条件が5つ以上ある(大きなボスなど)ときは折りたたむ。目的の行をタップで開け閉め
  if(st.steps.length>=5) return `<details class="mdet"><summary class="mgoal"><span class="chip">依頼</span>${esc(st.goal)}
      <span class="mmore"><span class="o">条件を見る(${st.steps.length})</span><span class="c">閉じる</span></span></summary>${list}</details>`;
  return `<div class="mgoal"><span class="chip">依頼</span>${esc(st.goal)}</div>${list}`;
}

function onStageClick(e){
  const t=e.target.closest('[data-act]'); if(!t) return;
  const act=t.dataset.act, ri=+t.dataset.ri, r=+t.dataset.r, c=+t.dataset.c;
  switch(act){
    case 'map': saveDraft(); showMap(); break;
    case 'reset': resetRun(); startRun(); break;
    case 'judge': judge(); break;
    case 'cell': if(G.dragged && Date.now()-G.dragged<400) break; if(G.tool) placeTool(ri, r, c, 'cell'); else cellPicker(ri, r, c); break;
    case 'out': if(G.dragged && Date.now()-G.dragged<400) break; if(G.tool) placeTool(ri, 0, 0, 'out'); else outPicker(ri); break;
    case 'tool': if(G.dragged && Date.now()-G.dragged<400) break; selectTool(t.dataset.k); break;
    case 'v': toggleV(ri, r, +t.dataset.b); break;
    case 'addRung': addRung(); break;
    case 'rowAdd': rowAdd(ri); break;
    case 'rowDel': rowDel(ri); break;
    case 'rungDel': rungDel(ri); break;
    case 'up': moveRung(ri,-1); break;
    case 'down': moveRung(ri,1); break;
    case 'clearAll': clearAll(); break;
    case 'answer': showAnswer(); break;
    case 'tab': G.tab=t.dataset.tab; renderBottom();
      if(t.dataset.go){ const b=document.getElementById('bottom'); if(b) b.scrollIntoView({behavior:reduced()?'auto':'smooth', block:'start'}); }
      break;
    case 'hint': openHint(); break;
    case 'settings': openSettings(); break;
  }
}

/* ---------- エディタ ---------- */
const GEO={X0:24, CW:78, OW:150, TOP:36, RH:66};
function isFill(){ return G.stage && G.stage.type==='fill'; }
function cellLocked(rg,r,c){ return (isFill()||rg.guide) && rg.lock && rg.lock[r] ? rg.lock[r][c]!==false : false; }
function outLocked(rg){ return (isFill()||rg.guide) && rg.olock!==false; }

function contactSVG(cell, x, y, st){
  const cx=x+GEO.CW/2;
  let s=`<line class="ls" x1="${x}" y1="${y}" x2="${cx-9}" y2="${y}"/>`;
  s+=`<rect class="cfill" x="${cx-9}" y="${y-14}" width="18" height="28"/>`;
  s+=`<line class="sym" x1="${cx-9}" y1="${y-15}" x2="${cx-9}" y2="${y+15}"/><line class="sym" x1="${cx+9}" y1="${y-15}" x2="${cx+9}" y2="${y+15}"/>`;
  if(cell.t==='NC') s+=`<line class="sym" x1="${cx-14}" y1="${y+13}" x2="${cx+14}" y2="${y-13}"/>`;
  s+=`<line class="rs" x1="${cx+9}" y1="${y}" x2="${x+GEO.CW}" y2="${y}"/>`;
  // アドレス表示ありなら「上:アドレス/下:名前」、なしなら「上:名前」だけ
  s+=`<text class="lab" x="${cx}" y="${y-20}" text-anchor="middle">${esc(addrOn()?dispAddr(cell.a):(showName(st,cell.a)||dispAddr(cell.a)))}</text>`;
  if(addrOn()) s+=`<text class="nm" x="${cx}" y="${y+28}" text-anchor="middle">${esc(showName(st,cell.a))}</text>`;
  return s;
}
function outSVG(o, x0, xR, y, st, ri){
  const cx=(x0+xR)/2;
  let s='';
  if(!o){
    return s;
  }
  if(o.t==='COIL'){
    s+=`<line x1="${x0}" y1="${y}" x2="${cx-14}" y2="${y}"/>`;
    s+=`<circle class="ofill" cx="${cx}" cy="${y}" r="13"/>`;
    s+=`<path d="M${cx-8} ${y-15} A 17 17 0 0 0 ${cx-8} ${y+15}"/><path d="M${cx+8} ${y-15} A 17 17 0 0 1 ${cx+8} ${y+15}"/>`;
    s+=`<line x1="${cx+14}" y1="${y}" x2="${xR}" y2="${y}"/>`;
    s+=`<text class="lab" x="${cx}" y="${y-21}" text-anchor="middle">${esc(addrOn()?dispAddr(o.a):(showName(st,o.a)||o.a))}</text>`;
    if(addrOn()) s+=`<text class="nm" x="${cx}" y="${y+29}" text-anchor="middle">${esc(showName(st,o.a))}</text>`;
    return s;
  }
  const bw=104, bh=50, bx=cx-bw/2, by=y-20;
  s+=`<line x1="${x0}" y1="${y}" x2="${bx}" y2="${y}"/>`;
  s+=`<rect class="ofill" x="${bx}" y="${by}" width="${bw}" height="${bh}" rx="4"/>`;
  s+=`<rect class="box" x="${bx}" y="${by}" width="${bw}" height="${bh}" rx="4"/>`;
  s+=`<line x1="${bx+bw}" y1="${y}" x2="${xR}" y2="${y}"/>`;
  s+=`<text class="big" x="${cx}" y="${by-5}" text-anchor="middle">${o.t} ${esc(o.n)}</text>`;
  if(o.t==='TON'||o.t==='TOF'){
    s+=`<text class="lab" x="${bx+6}" y="${by+18}">PT ${(o.pt/1000).toFixed(1)}s</text>`;
    s+=`<text class="lab" id="et-${ri}" x="${bx+6}" y="${by+36}">ET 0.0s</text>`;
  } else {
    s+=`<text class="lab" x="${bx+6}" y="${by+18}">PV ${o.pv}  CV <tspan id="cv-${ri}">0</tspan></text>`;
    s+=`<text class="lab" x="${bx+6}" y="${by+36}">${o.t==='CTU'?'R':'LD'}: ${esc(o.r||'なし')}</text>`;
  }
  return s;
}
function rungSVG(rg, ri, st, opt){
  opt=opt||{};
  const ed=!opt.readonly;
  const R=rg.cells.length, C=rg.cells[0].length, {X0,CW,OW,TOP,RH}=GEO;
  const xO=X0+C*CW, xR=xO+OW, W=xR+14, H=TOP+(R-1)*RH+40;
  const yc=r=>TOP+r*RH;
  let s=`<svg class="rung-svg" viewBox="0 0 ${W} ${H}" data-ri="${ri}">`;
  s+=`<line class="rail" x1="${X0}" y1="4" x2="${X0}" y2="${H-4}"/><line class="rail" x1="${xR}" y1="4" x2="${xR}" y2="${H-4}"/>`;
  for(let r=0;r<R;r++){
    for(let c=0;c<C;c++){
      const cell=rg.cells[r][c], x=X0+c*CW, y=yc(r), lk=cellLocked(rg,r,c);
      // 部品を選んでいるときは、置けるマスを光らせる(1行目の最初の空きは特に強く)
      const tg = ed && !lk && toolFor('cell') ? (r===0 && c===firstEmpty(rg) ? 'tgt tgt1' : 'tgt') : '';
      s+=`<g class="cell" id="c-${ri}-${r}-${c}">`;
      if(ed) s+=`<rect class="hit ${lk?'locked':''} ${tg}" data-act="cell" data-ri="${ri}" data-r="${r}" data-c="${c}" x="${x+1}" y="${y-RH/2+1}" width="${CW-2}" height="${RH-2}" rx="6"/>`;
      if(!cell){
        if(isFill() && !lk) s+=`<rect class="qbox" x="${x+8}" y="${y-22}" width="${CW-16}" height="44" rx="6"/><text class="q" x="${x+CW/2}" y="${y+8}" text-anchor="middle">?</text>`;
        else if(ed && !lk && rg.guide) s+=`<line class="slotw" x1="${x}" y1="${y}" x2="${x+10}" y2="${y}"/><line class="slotw" x1="${x+CW-10}" y1="${y}" x2="${x+CW}" y2="${y}"/><rect class="blank slot" x="${x+10}" y="${y-20}" width="${CW-20}" height="40" rx="6"/><text class="slot-plus" x="${x+CW/2}" y="${y+6}" text-anchor="middle">+</text>`;
        else if(ed && !lk) s+=`<rect class="blank" x="${x+10}" y="${y-18}" width="${CW-20}" height="36" rx="5"/>`;
      } else if(cell.t==='W'){
        s+=`<line class="ls" x1="${x}" y1="${y}" x2="${x+CW}" y2="${y}"/>`;
      } else {
        s+=contactSVG(cell,x,y,st);
      }
      if(isFill() && !lk && cell) s+=`<rect class="qbox" x="${x+4}" y="${y-31}" width="${CW-8}" height="62" rx="6" style="fill:none"/>`;
      if(ed) s+=`<circle class="xbg" cx="${x+CW-9}" cy="${y-17}" r="8"/><text class="xm" x="${x+CW-9}" y="${y-13}" text-anchor="middle">✕</text>`;
      s+='</g>';
    }
  }
  // 縦線
  for(let r=0;r<R-1;r++){
    for(let b=1;b<=C;b++){
      const x=X0+b*CW, y1=yc(r), y2=yc(r+1);
      if(rg.v[r][b]) s+=`<line class="vl" id="v-${ri}-${r}-${b}" x1="${x}" y1="${y1}" x2="${x}" y2="${y2}"/>`;
      if(ed && !isFill() && !rg.guide){
        s+=`<rect class="vhit" data-act="v" data-ri="${ri}" data-r="${r}" data-b="${b}" x="${x-15}" y="${y1+12}" width="30" height="${y2-y1-24}"/>`;
        if(!rg.v[r][b]) s+=`<circle class="vdot" cx="${x}" cy="${(y1+y2)/2}" r="5"/>`;
      }
    }
  }
  // 出力
  const olk=outLocked(rg);
  s+=`<g class="out" id="o-${ri}">`;
  const otg = ed && !olk && toolFor('out') ? (rg.out ? 'tgt' : 'tgt tgt1') : '';
  if(ed) s+=`<rect class="hit ${olk?'locked':''} ${otg}" data-act="out" data-ri="${ri}" x="${xO+2}" y="${yc(0)-RH/2+1}" width="${OW-4}" height="${RH-2}" rx="6"/>`;
  // 出力がまだ無いときも、左の線と右の母線を「出力」の枠までつないで見せる(線が宙に浮かないように)
  if(!rg.out && ed) s+=`<line class="owire" x1="${xO}" y1="${yc(0)}" x2="${xO+30}" y2="${yc(0)}"/><line class="owire" x1="${xO+OW-30}" y1="${yc(0)}" x2="${xR}" y2="${yc(0)}"/>`;
  if(rg.out) s+=outSVG(rg.out, xO, xR, yc(0), st, ri);
  else if(isFill() && !olk) s+=`<rect class="qbox" x="${xO+30}" y="${yc(0)-22}" width="${OW-60}" height="44" rx="6"/><text class="q" x="${xO+OW/2}" y="${yc(0)+8}" text-anchor="middle">?</text>`;
  else if(ed) s+=`<rect class="blank" x="${xO+30}" y="${yc(0)-18}" width="${OW-60}" height="36" rx="5"/><text x="${xO+OW/2}" y="${yc(0)+4}" text-anchor="middle">出力</text>`;
  s+='</g></svg>';
  return s;
}
function renderEditor(){
  const st=G.stage, P=prep(st), guided=G.prog.some(r=>r.guide), fill=isFill()||guided;   // ガイド枠のときも形は固定
  G.prog.forEach(tidyRows);
  const n=countContacts(G.prog);
  let h=`<h3>ラダーエディタ <span class="note">${fill?'「?」のマスに部品を置く':'好きなマスに置ける/<b>下の段に置くと枝分かれ(または)</b>'}</span></h3>
    ${guided?`<div class="guide-note">${ic('hint')} 点線の<b>+</b>の枠に部品を置こう。線のつなぎ方は、最初から用意してあるよ(設定で枠なしにもできます)</div>`:''}
    <div class="toolbar">
      ${fill?'':`<button class="btn small" data-act="addRung" ${G.prog.length>=P.maxRungs?'disabled':''}>+ ラング追加</button>`}
      <button class="btn small" data-act="answer">模範解答</button>
      <span class="cnt ${n>0&&n<=P.target?'good':''}">接点数 <b>${n}</b> 個(★目標 ${P.target}個以下)</span>
    </div><div id="rungs">`;
  G.prog.forEach((rg,ri)=>{
    h+=`<div class="rung"><div class="rung-head"><span class="n">ラング ${ri+1}</span><div class="rstat" id="rs-${ri}"></div>`;
    if(!fill){
      h+=`<button data-act="up" data-ri="${ri}" ${ri===0?'disabled':''}>↑</button>
          <button data-act="down" data-ri="${ri}" ${ri===G.prog.length-1?'disabled':''}>↓</button>
          <button data-act="rungDel" data-ri="${ri}">削除</button>`;
    }
    h+=`</div>${rungSVG(rg,ri,st)}</div>`;
  });
  h+='</div>'+handHTML(st);
  const el=document.getElementById('editor');
  // 描き直しで手札などの横スクロールが一番左に戻らないよう、スクロール位置を覚えて戻す
  const keep=[];
  el.querySelectorAll('*').forEach((x,i)=>{ if(x.scrollLeft||x.scrollTop) keep.push([x.className+'#'+[...el.querySelectorAll('.'+String(x.className).split(' ')[0])].indexOf(x), x.scrollLeft, x.scrollTop]); });
  el.innerHTML=h;
  keep.forEach(([key,l,t])=>{ const [cls,idx]=key.split('#'); const c=cls.split(' ')[0]; if(!c) return; const x=el.querySelectorAll('.'+c)[+idx]; if(x){ x.scrollLeft=l; x.scrollTop=t; } });
  el.classList.toggle('placing', !!G.tool);
  el.classList.toggle('running', G.running);
  if(G.pop){ placedFx(document.getElementById(G.pop)); G.pop=null; }
  updateLadderVis();
}
// 部品を置いた瞬間の手応え:上から「すっ」と落ちてはまり、マスの枠が一瞬濃く光る+カチッという音+(Androidは)短い振動
// (2026-11-19 火花・広がる輪・金色の光はやめた)
function placedFx(pe){
  SFX.play('place');
  try{ if(navigator.vibrate) navigator.vibrate(15); }catch(e){}
  if(!pe) return;
  pe.classList.remove('seat','placed'); void pe.getBBox();
  pe.classList.add('seat','placed');
  setTimeout(()=>pe.classList.remove('placed','seat'), 450);
}
function edited(){ saveDraft(); renderEditor(); }
function addRung(){ const P=prep(G.stage); if(G.prog.length<P.maxRungs){ G.prog.push(newRung(P.cols)); edited(); } }
function rowAdd(ri){
  const P=prep(G.stage), rg=G.prog[ri];
  if(rg.cells.length>=P.maxRows) return;
  rg.cells.push(Array(P.cols).fill(null)); rg.v.push(Array(P.cols+1).fill(false)); edited();
}
function rowDel(ri){
  const rg=G.prog[ri]; if(rg.cells.length<=1) return;
  rg.cells.pop(); rg.v.pop(); edited();
}
function rungDel(ri){
  if(!confirm('ラング'+(ri+1)+'を削除しますか?')) return;
  G.prog.splice(ri,1);
  if(G.prog.length===0) G.prog.push(newRung(prep(G.stage).cols));
  edited();
}
function moveRung(ri,d){ const j=ri+d; if(j<0||j>=G.prog.length) return; [G.prog[ri],G.prog[j]]=[G.prog[j],G.prog[ri]]; edited(); }
function toggleV(ri,r,b){ if(isFill() || (G.prog[ri]&&G.prog[ri].guide)) return; const rg=G.prog[ri]; rg.v[r][b]=!rg.v[r][b]; edited(); }
function clearAll(){
  if(!confirm('回路を最初の状態に戻しますか?')) return;
  G.prog=initialProg(G.stage); edited();
}

/* ---------- 部品選択 ---------- */
function openModal(html, onClick){
  const root=document.getElementById('modal-root');
  root.innerHTML=`<div class="modal-bg"><div class="modal">${html}</div></div>`;
  const bg=root.firstChild;
  bg.addEventListener('click', e=>{
    if(e.target===bg){ closeModal(); return; }
    const t=e.target.closest('[data-m]');
    if(t && t.dataset.m==='close'){ closeModal(); return; }
    if(t && onClick) onClick(t, e);
  });
  return bg;
}
function closeModal(){ document.getElementById('modal-root').innerHTML=''; }

function contactChoices(st){
  const P=prep(st), list=[];
  P.io.forEach(x=>list.push({a:x.a, label:showName(st,x.a)||x.name, sub:dispAddr(x.a)}));
  P.mem.forEach(x=>list.push({a:x.a, label:showName(st,x.a)||x.name, sub:dispAddr(x.a)}));
  P.timers.forEach(n=>list.push({a:n, label:n+'.Q', sub:'タイマ出力'}));
  P.counters.forEach(n=>list.push({a:n, label:n+'.Q', sub:'カウンタ出力'}));
  return list;
}
function cellPicker(ri,r,c){
  const rg=G.prog[ri], st=G.stage, P=prep(st);
  if(cellLocked(rg,r,c)){ toast('このマスは固定されています'); return; }
  const cur=rg.cells[r][c];
  const pal=P.palette;
  // 1タップで置ける一覧(種類+信号の組み合わせ)。押した瞬間に確定して閉じる
  const draw=()=>{
    const isSel=(t,a)=> cur ? (cur.t===t && (a==null || cur.a===a)) : t==='E';
    let h=`<h2>ラング${ri+1} / ${r+1}行目 / ${c+1}列目</h2>
      <div class="opts"><button class="opt ${isSel('E')?'sel':''}" data-m="put" data-t="E">空き</button>
      <button class="opt ${isSel('W')?'sel':''}" data-m="put" data-t="W">─ 横線</button></div>`;
    const ch=contactChoices(st);
    if(pal.includes('NO')) h+=`<div class="note">┤├ a接点(ONで通る)</div><div class="opts">`+
      ch.map(x=>`<button class="opt ${isSel('NO',x.a)?'sel':''}" data-m="put" data-t="NO" data-v="${x.a}">┤├ ${esc(x.label)}<small>${esc(x.sub)}</small></button>`).join('')+`</div>`;
    if(pal.includes('NC')) h+=`<div class="note">┤/├ b接点(OFFで通る)</div><div class="opts">`+
      ch.map(x=>`<button class="opt ${isSel('NC',x.a)?'sel':''}" data-m="put" data-t="NC" data-v="${x.a}">┤/├ ${esc(x.label)}<small>${esc(x.sub)}</small></button>`).join('')+`</div>`;
    if(!isFill() && !rg.guide && rg.cells.length>1){
      const vb=[];
      if(r<rg.cells.length-1){ vb.push([r,c,'左に縦線(下の行へ)'],[r,c+1,'右に縦線(下の行へ)']); }
      if(r>0){ vb.push([r-1,c,'左に縦線(上の行へ)'],[r-1,c+1,'右に縦線(上の行へ)']); }
      const ok=vb.filter(([vr,b])=>b>=1);
      if(ok.length) h+=`<div class="note">縦線(並列)</div><div class="opts">`+ok.map(([vr,b,l])=>`<button class="opt ${rg.v[vr][b]?'sel':''}" data-m="v" data-r="${vr}" data-b="${b}">${l}</button>`).join('')+`</div>`;
    }
    h+=`<div class="acts"><button class="btn" data-m="close">閉じる</button></div>`;
    return h;
  };
  const bg=openModal(draw(), (t)=>{
    const m=t.dataset.m;
    if(m==='v'){ const vr=+t.dataset.r, b=+t.dataset.b; rg.v[vr][b]=!rg.v[vr][b]; saveDraft(); bg.querySelector('.modal').innerHTML=draw(); renderEditor(); return; }
    if(m==='put'){
      const type=t.dataset.t, addr=t.dataset.v;
      rg.cells[r][c] = type==='E'?null : type==='W'?{t:'W'} : {t:type, a:addr};
      if(type==='E') SFX.play('remove'); else G.pop=`c-${ri}-${r}-${c}`;
      if(r===0 && (type==='NO'||type==='NC')) autoWire(rg);
      closeModal(); edited(); return;
    }
  });
}
/* ---------- 部品の手札(選ぶ → 光ったマスをタップ。ドラッグでも置ける) ---------- */
// 手札は「接点(条件)」「コイル(動かすもの)」「その他」の段に分ける
function handTools(st){
  const P=prep(st), pal=P.palette, ch=contactChoices(st);
  const contacts=[], coils=[], util=[];
  ch.forEach(x=>{
    const items=[];
    if(pal.includes('NO')) items.push({k:'NO|'+x.a, t:'NO', a:x.a, name:'a接点'});
    if(pal.includes('NC')) items.push({k:'NC|'+x.a, t:'NC', a:x.a, name:'b接点'});
    if(items.length) contacts.push({label:x.label, sub:x.sub, items});
    if(pal.includes('COIL') && ['Q','M'].includes(kindOf(x.a))) coils.push({k:'COIL|'+x.a, t:'COIL', a:x.a, name:x.label});
  });
  ['TON','TOF','CTU','CTD'].filter(k=>pal.includes(k)).forEach(k=>coils.push({k:'FB|'+k, t:'FB', a:k, name:k}));
  if(!isFill() && !(G.prog||[]).some(r=>r.guide)) util.push({k:'W|', t:'W', name:'横線'});
  util.push({k:'E|', t:'E', name:'消す'});
  const sec=[];
  if(contacts.length) sec.push({title:'接点', hint:'条件(ボタン・センサなど)', cls:'s-contact', groups:contacts});
  if(coils.length) sec.push({title:'コイル', hint:'右端の「出力」に置く(動かすもの)', cls:'s-coil', groups:[{label:'', items:coils}]});
  sec.push({title:'その他', hint:'', cls:'s-util', groups:[{label:'', items:util}]});
  return sec;
}
function toolObj(){ if(!G.tool) return null; const [t,a]=G.tool.split('|'); return {t, a:a||null}; }
// 選んでいる部品が、マス(cell)/出力(out)に置けるか
function toolFor(where){
  const o=toolObj(); if(!o) return false;
  if(where==='cell') return ['NO','NC','W','E'].includes(o.t);
  return ['COIL','FB','E'].includes(o.t);
}
// 1行目にまだ接点がないとき、最初に置くとよいマス(空きか横線の最初)
function firstEmpty(rg){ if(rg.cells[0].some(c=>c && (c.t==='NO'||c.t==='NC'))) return -1; return rg.cells[0].findIndex(c=>!c || c.t==='W'); }
function toolIcon(t){
  const L='stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round"';
  if(t==='NO') return `<svg viewBox="0 0 40 24"><path d="M2 12H14M14 3V21M26 3V21M26 12H38" ${L}/></svg>`;
  if(t==='NC') return `<svg viewBox="0 0 40 24"><path d="M2 12H14M14 3V21M26 3V21M26 12H38M11 21 29 3" ${L}/></svg>`;
  if(t==='COIL') return `<svg viewBox="0 0 40 24"><path d="M2 12H11M29 12H38M15 3Q9 12 15 21M25 3Q31 12 25 21" ${L}/></svg>`;
  if(t==='FB') return `<svg viewBox="0 0 40 24"><rect x="9" y="3" width="22" height="18" rx="2" ${L}/><path d="M2 12H9M31 12H38" ${L}/></svg>`;
  if(t==='W') return `<svg viewBox="0 0 40 24"><path d="M2 12H38" ${L}/></svg>`;
  return `<svg viewBox="0 0 40 24"><path d="M13 5 27 19M27 5 13 19" ${L}/></svg>`;
}
function handHTML(st){
  const secs=handTools(st), o=toolObj();
  const tip = !o ? '<b>① 下の部品をタップ</b>(またはマスへドラッグ)して選ぼう。置いた部品はドラッグで動かせる。ダブルタップで固定(動かなくなる)'
    : `<b>② 光っているマスをタップ</b>して置こう。${o.t==='COIL'||o.t==='FB'?'コイルは右端の「出力」に置きます。':''}もう一度部品をタップで選ぶのをやめる`;
  // 手札のカードには、ふだんの言葉の説明を小さく添える(a接点=ONで通る、b接点=ONで切れる)
  const SUB={NO:'ONで通る', NC:'ONで切れる', W:'線をつなぐ', E:'部品を消す'};
  const card=it=>`<button class="hcard t-${it.t} ${G.tool===it.k?'sel':''}" data-act="tool" data-k="${esc(it.k)}" aria-pressed="${G.tool===it.k}">${toolIcon(it.t)}<span>${esc(it.name)}</span>${SUB[it.t]?`<small>${SUB[it.t]}</small>`:''}</button>`;
  const QM={'接点':'接点','コイル':'コイル'};
  const secHTML=s=>`<div class="hsec ${s.cls}"><div class="hsec-h"><b>${s.title}</b>${QM[s.title]?`<button type="button" class="term qm" data-term="${QM[s.title]}" aria-label="${s.title}とは">?</button>`:''}${s.hint?`<span>${s.hint}</span>`:''}</div>
    <div class="hand-row">${s.groups.map(g=>`
      <div class="hgrp">${g.label?`<div class="gh">${esc(g.label)}${g.sub&&g.sub!==g.label?` <span>${esc(g.sub)}</span>`:''}</div>`:''}<div class="gc">${g.items.map(card).join('')}</div></div>`).join('')}
    </div></div>`;
  // 接点は1段、コイルとその他は横に並べて縦の長さを抑える
  const c=secs.filter(s=>s.cls==='s-contact'), rest=secs.filter(s=>s.cls!=='s-contact');
  return `<div class="hand"><div class="hand-tip">${tip}</div>${c.map(secHTML).join('')}<div class="hsec-row">${rest.map(secHTML).join('')}</div></div>`;
}
// 選んだ部品を、マス/出力に置く。置けたら true
function placeTool(ri, r, c, where){
  const o=toolObj(), rg=G.prog[ri]; if(!o || !rg) return false;
  if(where==='cell'){
    if(!toolFor('cell')){ toast('その部品は右端の「出力」に置きます'); return true; }
    if(cellLocked(rg,r,c)){ toast('このマスは固定されています'); return true; }
    rg.cells[r][c] = o.t==='E' ? null : o.t==='W' ? {t:'W'} : {t:o.t, a:o.a};
    if(o.t==='E') SFX.play('remove'); else G.pop=`c-${ri}-${r}-${c}`;
    if(r===0 && (o.t==='NO'||o.t==='NC')) autoWire(rg);
    if(r>0) branchWire(rg, r);
    edited(); return true;
  }
  if(!toolFor('out')){ toast('接点は「出力」より左のマスに置きます'); return true; }
  if(outLocked(rg)){ toast('この出力は固定されています'); return true; }
  if(o.t==='E'){ rg.out=null; SFX.play('remove'); edited(); return true; }
  if(o.t==='COIL'){ rg.out={t:'COIL', a:o.a}; G.pop=`o-${ri}`; edited(); return true; }
  if(o.t==='FB'){ if(!rg.out || rg.out.t!==o.a){ const P=prep(G.stage); rg.out = (o.a==='TON'||o.a==='TOF') ? {t:o.a, n:P.timers[0]||'T0', pt:1000} : {t:o.a, n:P.counters[0]||'C0', pv:3, r:null}; saveDraft(); renderEditor(); } outPicker(ri); return true; }
  return false;
}
function selectTool(k){ G.tool = G.tool===k ? null : k; SFX.play('tick'); renderEditor(); }
// ドラッグで置く(手札のカードを押したまま、マスの上で離す)
/* ドラッグ操作
   ・手札のカードを押したまま、マスの上で離す → 置く
   ・置いてある部品を長押し(マウスはそのまま)してから動かす → 別のマスへ移動(相手がいれば入れ替え)
     ラダー図の外で離す → 取り外し */
function setupHandDrag(){
  if(G.dragInit) return; G.dragInit=true;     // 1回だけ登録
  let d=null;
  const targetAt=(x,y)=>{ const el=document.elementFromPoint(x,y); return el&&el.closest&&el.closest('.rung-svg [data-act="cell"], .rung-svg [data-act="out"]'); };
  const startGhost=(t)=>{ const g=document.createElement('div'); g.className='drag-ghost'; g.innerHTML=toolIcon(t); document.body.appendChild(g); d.g=g; G.dragging=true; };
  // スマホで部品を動かしている間は、画面がスクロールしないようにする
  document.addEventListener('touchmove', e=>{ if(G.dragging) e.preventDefault(); }, {passive:false});
  document.addEventListener('pointerdown', e=>{
    if(e.button>0 || !G.stage) return;
    const b=e.target.closest && e.target.closest('#editor .hcard');
    if(b){ d={kind:'hand', k:b.dataset.k, x:e.clientX, y:e.clientY, on:false, g:null, hl:null}; return; }
    // 置いてある部品
    const h=e.target.closest && e.target.closest('#editor .rung-svg .hit'); if(!h) return;
    const ri=+h.dataset.ri, rg=G.prog[ri]; if(!rg) return;
    let src=null, t=null;
    if(h.dataset.act==='cell'){ const r=+h.dataset.r, c=+h.dataset.c, cell=rg.cells[r][c];
      // pin = ダブルタップで固定した部品(ドラッグで動かさない。js/pin.js)
      if(cell && (cell.t==='NO'||cell.t==='NC') && !cellLocked(rg,r,c) && !cell.pin){ src={kind:'cell', ri, r, c}; t=cell.t; } }
    else if(h.dataset.act==='out'){ if(rg.out && !outLocked(rg) && !rg.out.pin){ src={kind:'out', ri}; t=rg.out.t==='COIL'?'COIL':'FB'; } }
    if(!src) return;
    // 2026-11-25:長押しをやめ、置いた部品の上から指を動かしたらすぐドラッグにする。
    // 部品の上から始めたときは画面をスクロールさせない(空いているマスからはスクロールできる)
    d={kind:'move', src, t, x:e.clientX, y:e.clientY, on:false, armed:true, g:null, hl:null};
    if(e.pointerType!=='mouse') G.dragging=true;
  });
  addEventListener('pointermove', e=>{
    if(!d) return;
    const dist=Math.hypot(e.clientX-d.x, e.clientY-d.y);
    if(!d.on){
      if(dist<10) return;
      if(d.kind==='move' && !d.armed){ d.cancel=true; clearTimeout(d.timer); d=null; return; }   // 長押し前に動いたら、ただのスクロール
      d.on=true;
      if(d.kind==='hand'){ G.tool=d.k; renderEditor(); startGhost(d.k.split('|')[0]); }
      else startGhost(d.t);
    }
    d.g.style.left=e.clientX+'px'; d.g.style.top=e.clientY+'px';
    const t=targetAt(e.clientX,e.clientY);
    if(d.hl && d.hl!==t) d.hl.classList.remove('over'); if(t){ t.classList.add('over'); d.hl=t; }
  }, {passive:true});
  const end=e=>{
    if(!d) return; const dd=d; d=null; G.dragging=false; clearTimeout(dd.timer);
    if(dd.g) dd.g.remove();
    if(!dd.on){ if(dd.kind==='move' && dd.armed && dd.timer){ G.dragged=Date.now(); renderEditor(); } return; }   // ただのタップはクリックとして扱う(長押しだけで離したときは何もしない)
    G.dragged=Date.now();
    const t=targetAt(e.clientX,e.clientY);
    if(dd.kind==='hand'){ if(t) placeTool(+t.dataset.ri, +t.dataset.r, +t.dataset.c, t.dataset.act); else renderEditor(); return; }
    movePart(dd.src, t);
  };
  addEventListener('pointerup', end); addEventListener('pointercancel', ()=>{ if(d){ clearTimeout(d.timer); if(d.g) d.g.remove(); } d=null; G.dragging=false; });
}
// 置いてある部品を動かす。t=離した場所(なければ取り外し)
function movePart(src, t){
  const A_=G.prog[src.ri];
  if(!t){   // ラダー図の外で離した → 取り外し
    if(src.kind==='cell'){ A_.cells[src.r][src.c]=null; if(src.r>0) branchWire(A_, src.r); } else A_.out=null;
    SFX.play('remove'); toast('部品を取り外しました'); edited(); return;
  }
  const ri=+t.dataset.ri, B_=G.prog[ri];
  if(src.kind==='cell'){
    if(t.dataset.act!=='cell'){ toast('接点は「出力」より左のマスに置きます'); renderEditor(); return; }
    const r=+t.dataset.r, c=+t.dataset.c;
    if(ri===src.ri && r===src.r && c===src.c){ renderEditor(); return; }
    if(cellLocked(B_,r,c)){ toast('このマスは固定されています'); renderEditor(); return; }
    const a=A_.cells[src.r][src.c], b=B_.cells[r][c];
    B_.cells[r][c]=a;
    // 相手が接点なら入れ替え。空き・横線なら、元の場所は空きにする(1行目の本線は横線に戻す)
    A_.cells[src.r][src.c] = (b && (b.t==='NO'||b.t==='NC')) ? b : (src.r===0 && !A_.guide && G.stage.type!=='fill' ? {t:'W'} : null);
    if(src.r>0) branchWire(A_, src.r);
    if(r>0) branchWire(B_, r);
    G.pop=`c-${ri}-${r}-${c}`; edited(); return;
  }
  // 出力(コイル)
  if(t.dataset.act!=='out'){ toast('コイルは右端の「出力」に置きます'); renderEditor(); return; }
  if(ri===src.ri){ renderEditor(); return; }
  if(outLocked(B_)){ toast('この出力は固定されています'); renderEditor(); return; }
  const tmp=B_.out; B_.out=A_.out; A_.out=tmp||null;
  G.pop=`o-${ri}`; edited();
}
// 組む・最短挑戦では、1行目(出力につながる本線)の空きマスを自動で横線にする
function autoWire(rg){
  const ty=G.stage && G.stage.type;
  if(ty!=='build' && ty!=='short') return;
  if(rg.guide) return;                       // ガイド枠のときは線が用意済み(枠を横線で埋めない)
  rg.cells[0].forEach((cell,c)=>{ if(!cell) rg.cells[0][c]={t:'W'}; });
}
/* 下の段(2行目以降)に部品を置いたら、自動で枝分かれ(並列)の縦線を引く。
   その段で横につながった部品のかたまりごとに、左端と右端だけ上の段へつなぐ(かたまりの内側には縦線を引かない)。
   左端が1列目なら左の母線につながっているので縦線は不要。上の段のその位置が空いていれば、さらに上までつなぐ */
function branchWire(rg, r){
  if(r<=0 || isFill() || rg.guide) return;
  const C=rg.cells[0].length, row=rg.cells[r];
  for(let b=1;b<=C;b++) rg.v[r-1][b]=false;
  const link=b=>{
    let k=r-1; rg.v[k][b]=true;
    while(k>0 && !rg.cells[k][b-1] && !(b<C && rg.cells[k][b])){ k--; rg.v[k][b]=true; }
  };
  let c=0;
  while(c<C){
    if(!row[c]){ c++; continue; }
    let e=c; while(e+1<C && row[e+1]) e++;
    if(c>0) link(c);
    link(e+1);
    c=e+1;
  }
}
// いちばん下に、いつも空いた段を1つ用意しておく(そこに置くと枝分かれになる)。空いた段が2つ以上続いたら減らす
function tidyRows(rg){
  if(isFill() || rg.guide) return;
  const P=prep(G.stage), C=rg.cells[0].length;
  const empty=r=>rg.cells[r].every(x=>!x);
  while(rg.cells.length>1 && empty(rg.cells.length-1) && empty(rg.cells.length-2)){ rg.cells.pop(); rg.v.pop(); }
  if(rg.cells.length<P.maxRows && !empty(rg.cells.length-1)){ rg.cells.push(Array(C).fill(null)); rg.v.push(Array(C+1).fill(false)); }
  if(rg.cells.length===1 && P.maxRows>1){ rg.cells.push(Array(C).fill(null)); rg.v.push(Array(C+1).fill(false)); }
  // 最後の段の縦線は使わない(下に段がない)
  rg.v[rg.cells.length-1]=Array(C+1).fill(false);
}
function outPicker(ri){
  const rg=G.prog[ri], st=G.stage, P=prep(st);
  if(outLocked(rg)){ toast('この出力は固定されています'); return; }
  const o=rg.out ? clone(rg.out) : null;
  let type=o?o.t:'E';
  let addr=o&&o.t==='COIL'?o.a:null;
  let tn=o&&o.n?o.n:(P.timers[0]||'T0'), pt=o&&o.pt?o.pt:1000;
  let cn=o&&o.n?o.n:(P.counters[0]||'C0'), pv=o&&o.pv?o.pv:3, rs=o&&o.r?o.r:'';
  const pal=P.palette;
  const draw=()=>{
    let h=`<h2>ラング${ri+1} の出力</h2><div class="opts"><button class="opt ${type==='E'?'sel':''}" data-m="none">なし</button></div>`;
    if(pal.includes('COIL')){
      const ch=P.io.filter(x=>kindOf(x.a)==='Q').concat(P.mem);
      h+=`<div class="note">( ) コイル(押すとすぐ置けます)</div><div class="opts">`+ch.map(x=>`<button class="opt ${type==='COIL'&&addr===x.a?'sel':''}" data-m="coil" data-v="${x.a}">( ) ${esc(showName(st,x.a)||x.name)}${addrOn()?`<small>${dispAddr(x.a)}</small>`:''}</button>`).join('')+`</div>`;
    }
    const fb=['TON','TOF','CTU','CTD'].filter(k=>pal.includes(k));
    if(fb.length) h+=`<div class="note">タイマ・カウンタ(設定してから「決定」)</div><div class="opts">${fb.map(k=>`<button class="opt ${type===k?'sel':''}" data-m="type" data-v="${k}">${k}</button>`).join('')}</div>`;
    if(type==='TON'||type==='TOF'){
      h+=`<div class="fieldrow">インスタンス名 <select data-f="tn">${(P.timers.length?P.timers:['T0']).map(n=>`<option ${n===tn?'selected':''}>${n}</option>`).join('')}</select>
          設定時間 PT <input data-f="pt" type="number" min="0.1" max="600" step="0.1" value="${pt/1000}" style="width:90px"> 秒</div>`;
    }
    if(type==='CTU'||type==='CTD'){
      const rch=contactChoices(st).filter(x=>['I','M'].includes(kindOf(x.a)));
      h+=`<div class="fieldrow">インスタンス名 <select data-f="cn">${(P.counters.length?P.counters:['C0']).map(n=>`<option ${n===cn?'selected':''}>${n}</option>`).join('')}</select>
          設定値 PV <input data-f="pv" type="number" min="1" max="999" step="1" value="${pv}" style="width:80px"></div>
          <div class="fieldrow">${type==='CTU'?'リセット入力 R':'プリセット入力 LD'} <select data-f="rs"><option value="">なし</option>${rch.map(x=>`<option value="${x.a}" ${x.a===rs?'selected':''}>${esc(x.label)} (${dispAddr(x.a)})</option>`).join('')}</select></div>`;
    }
    const fbSel=['TON','TOF','CTU','CTD'].includes(type);
    h+=`<div class="acts"><button class="btn" data-m="close">閉じる</button>${fbSel?'<button class="btn primary" data-m="ok">決定</button>':''}</div>`;
    return h;
  };
  const readFields=()=>{
    const q=s=>bg.querySelector(`[data-f="${s}"]`);
    if(q('tn')) tn=q('tn').value;
    if(q('pt')) pt=Math.round(Math.max(0.1, parseFloat(q('pt').value)||1)*10)*100;
    if(q('cn')) cn=q('cn').value;
    if(q('pv')) pv=Math.max(1, parseInt(q('pv').value)||1);
    if(q('rs')) rs=q('rs').value;
  };
  const bg=openModal(draw(), (t)=>{
    const m=t.dataset.m;
    readFields();
    if(m==='none'){ rg.out=null; SFX.play('remove'); closeModal(); edited(); return; }
    if(m==='coil'){ rg.out={t:'COIL', a:t.dataset.v}; G.pop=`o-${ri}`; closeModal(); edited(); return; }
    if(m==='type') type=t.dataset.v;
    else if(m==='addr') addr=t.dataset.v;
    else if(m==='ok'){
      if(type==='E') rg.out=null;
      else if(type==='COIL'){ if(!addr){ toast('割り付ける出力を選んでください'); return; } rg.out={t:'COIL', a:addr}; }
      else if(type==='TON'||type==='TOF') rg.out={t:type, n:tn, pt};
      else rg.out={t:type, n:cn, pv, r:rs||null};
      if(type!=='E') G.pop=`o-${ri}`;
      closeModal(); edited(); return;
    } else return;
    bg.querySelector('.modal').innerHTML=draw();
  });
}

/* ---------- 止まっている場所と理由 ---------- */
// 電気が来ているのに通さないマスのうち、1行目・左側を優先して1つ選ぶ
function blockOf(rg, res){
  if(res.power) return null;
  const R=rg.cells.length, C=rg.cells[0].length;
  for(let r=0;r<R;r++) for(let c=0;c<C;c++){
    if(res.nodes[c][r] && !res.closed[r][c]) return {r,c,cell:rg.cells[r][c]};
  }
  return null;
}
function rungStatusHTML(rg, res, blk){
  const st=G.stage, nm=a=>{ const n=showName(st,a); return n?(addrOn()?`${esc(n)}(${esc(dispAddr(a))})`:esc(n)):esc(dispAddr(a)); };
  const o=rg.out;
  if(res.power){
    if(!o) return `${ic('bolt')} 電気は右まで届いています。右端に出力を置こう`;
    if(o.t==='COIL') return `${ic('check')} 通電中 → ${nm(o.a)} ON`;
    if(o.t==='TON') return G.plc.get(o.n) ? `${ic('check')} 通電中 → ${esc(o.n)} タイムアップ(${esc(o.n)}.Q ON)` : `${ic('hourglass')} 通電中 → ${esc(o.n)} が時間を計っています`;
    if(o.t==='TOF') return `${ic('check')} 通電中 → ${esc(o.n)} ON(切れてから時間を計る)`;
    return `${ic('check')} 通電中 → ${esc(o.n)} に1回数える信号`;
  }
  // 止まっているときは文字を出さない(光が途切れた所を見れば分かる形にする)
  return '';
}

/* ---------- 通電表示の更新 ---------- */
function updateLadderVis(){
  const vis=G.plc.vis;
  G.prog.forEach((rg,ri)=>{
    const res=vis && vis[ri] && vis[ri].closed.length===rg.cells.length ? vis[ri] : null;
    const R=rg.cells.length, C=rg.cells[0].length;
    const blk=res ? blockOf(rg,res) : null;
    for(let r=0;r<R;r++) for(let c=0;c<C;c++){
      const el=document.getElementById(`c-${ri}-${r}-${c}`); if(!el) continue;
      el.classList.toggle('pl', !!(res && res.nodes[c][r]));
      el.classList.toggle('cl', !!(res && res.closed[r][c]));
      el.classList.toggle('blk', !!(blk && blk.r===r && blk.c===c));
    }
    const se=document.getElementById(`rs-${ri}`);
    if(se){ const h=res?rungStatusHTML(rg,res,blk):''; if(se.dataset.h!==h){ se.dataset.h=h; se.innerHTML=h; se.className='rstat'+(res&&res.power?' ok':(blk?' ng':'')); } }
    for(let r=0;r<R-1;r++) for(let b=1;b<=C;b++){
      const el=document.getElementById(`v-${ri}-${r}-${b}`); if(!el) continue;
      el.classList.toggle('pl', !!(res && res.nodes[b][r] && res.nodes[b][r+1]));
    }
    const oe=document.getElementById(`o-${ri}`);
    if(oe){
      oe.classList.toggle('pl', !!(res && res.power));
      let q=false;
      const o=rg.out;
      if(o && res){
        if(o.t==='COIL') q=G.plc.get(o.a);
        else q=G.plc.get(o.n);
      }
      oe.classList.toggle('q', q);
      if(o && (o.t==='TON'||o.t==='TOF')){
        const e=document.getElementById(`et-${ri}`), t=G.plc.tm[o.n];
        if(e) e.textContent='ET '+((t?t.et:0)/1000).toFixed(1)+'s';
      }
      if(o && (o.t==='CTU'||o.t==='CTD')){
        const e=document.getElementById(`cv-${ri}`), c=G.plc.ct[o.n];
        if(e) e.textContent=String(c?c.cv:0);
      }
    }
  });
}

/* ---------- 実習機 PLC TRAINER-S01 そっくりのパネル ----------
   配置は「PLC-TRAINER-S01 回路図1」の実体図に合わせる:
     上:コンベア(左端に LS2、その上に LS3〜LS5、右端に LS1)、コンベア用リレー RY1(左行)・RY2(右行)
     下:MAN/AUTO(SS0)、運転 OFF/ON(SS1)、PL1〜PL4 と PB1〜PB4、PB5(非常停止)、DSW と 7セグ DPL2・DPL1
   ステージの machine に {type:'trainer', map:DEV_TRAINER_MAP, pallet:{...}} を書く。
   ステージの io に無い部品は、使わない部品として薄く表示する。
   ※ ランプの色は仮(実機の色が分かったら TRAINER_LED を合わせる) */
const TRAINER_LED = {PL1:'green', PL2:'yellow', PL3:'red', PL4:'white'};   // PL=パイロットランプ
function trainerHTML(st, d){
  const used=new Set((st.io||[]).map(x=>A(x.a)));
  const m=d.map||{}, A_=k=>m[k] && used.has(A(m[k])) ? A(m[k]) : null;
  const tag=k=>A_(k)?`<span class="ad">${dispAddr(A_(k))}</span>`:'';
  // パレットがあるときは、ベルト両端のセンサはパレットの位置で自動的に入る(手では押せない)
  const pal=d.pallet?palletCfg(d):null, pi=(st.machine||[]).indexOf(d);
  const kindOfSens=k=> pal && (k===pal.left||k===pal.right) ? 'auto' : 'sw';
  const btn=(k,cls,kind)=>{ const a=A_(k);
    return a?`<button class="${cls}" data-in="${a}" data-kind="${kind}" aria-label="${k}"><i></i></button>`
            :`<button class="${cls} unused" disabled aria-label="${k}(使わない)"><i></i></button>`; };
  const led=k=>{ const a=A_(k); return `<i class="tr-led ${TRAINER_LED[k]} ${a?'':'unused'}" ${a?`data-out="${a}"`:''}></i>`; };
  const belt=A_('BELT'), beltL=A_('BELTL');
  const beltAttr = belt ? `data-out="${belt}"${beltL?` data-rev="${beltL}"`:''}` : beltL ? `data-out="${beltL}" data-revonly="1"` : '';
  const relay=(k,lab)=>{ const a=A_(k); return `<span class="tr-ry">${lab}<i class="tr-led red ${a?'':'unused'}" ${a?`data-out="${a}"`:''}></i></span>`; };
  const lsRow=k=>`<div class="tr-lsrow"><b>${k}</b>${btn(k,'tr-sens sm',kindOfSens(k))}${tag(k)}</div>`;
  return `<div class="trainer">
    <div class="tr-relay">${relay('BELTL','RY1')}${relay('BELT','RY2')}<span class="tr-cap">Conv. Relay</span></div>
    <div class="tr-conv">
      <div class="tr-lsl">${['LS5','LS4','LS3','LS2'].map(lsRow).join('')}</div>
      <div class="tbelt ${belt||beltL?'':'unused'}" ${beltAttr}><i></i>${pal?`<b class="pallet" data-pallet="${pi}" title="パレット"></b>`:''}<span>${beltL?`←左行${tag('BELTL')} `:''}${belt?`右行→${tag('BELT')}`:''}</span></div>
      <div class="tr-lsr">${lsRow('LS1')}</div>
    </div>
    ${pal?`<div class="tr-pal-ctl"><button class="btn small" data-pal-move="${pi}" data-to="0">パレットを左端へ</button><button class="btn small" data-pal-move="${pi}" data-to="1">右端へ</button></div>`:''}
    <div class="tr-ops">
      <div class="tr-sws">
        <div class="tr-cell"><span class="tr-cap">MAN AUTO</span>${btn('SS0','tr-slide','sw')}<b>SS0</b>${tag('SS0')}</div>
        <div class="tr-cell"><span class="tr-cap">Cont. Oper. OFF ON</span>${btn('SS1','tr-slide','sw')}<b>SS1</b>${tag('SS1')}</div>
      </div>
      <div class="tr-pbs">${[1,2,3,4].map(i=>`<div class="tr-cell">${A_('PL'+i)?`<span class="led-ad">PL${i}<span class="ad"> ${dispAddr(A_('PL'+i))}</span></span>`:`<span class="led-ad dim">PL${i}</span>`}${led('PL'+i)}${btn('PB'+i,'tr-pb','pb')}<b>PB${i}</b>${tag('PB'+i)}</div>`).join('')}
        <div class="tr-cell"><span class="led-ad dim">非常停止</span>${btn('PB5','tr-pbr','pbnc')}<b>PB5</b>${tag('PB5')}</div></div>
      <div class="tr-dsw"><div class="tr-cell"><span class="tr-knob"><i></i></span><b>DSW</b></div>
        <div class="tr-cell"><span class="tr-dpl" id="tr-dpl2">8</span><b>DPL2</b></div><div class="tr-cell"><span class="tr-dpl" id="tr-dpl1">8</span><b>DPL1</b></div></div>
    </div>
  </div>`;
}

/* ---------- 機械 ---------- */
const IN_TYPES=['pb','sw','sensor'];
function devLabel(st, d){ return showName(st, A(d.a)) || d.label || ''; }
function renderMachine(){
  const st=G.stage;
  const devs=st.machine||[];
  let ip='', pl='';
  devs.forEach((d,i)=>{
    const a=A(d.a), lab=esc(devLabel(st,d)), ad=`<span class="ad">${dispAddr(a)}</span>`;
    switch(d.type){
      case 'pb': ip+=`<div class="dev"><button class="pb ${d.color||'green'}" data-in="${a}" data-kind="pb" aria-label="${lab}"><i></i></button><span class="lbl">${lab}</span>${ad}</div>`; break;
      case 'sw': ip+=`<div class="dev"><button class="sw" data-in="${a}" data-kind="sw" aria-label="${lab}"></button><span class="lbl">${lab}</span>${ad}</div>`; break;
      case 'sensor': ip+=`<div class="dev"><button class="sens ${d.auto?'auto':''}" data-in="${a}" data-kind="${d.auto?'auto':'sw'}" aria-label="${lab}">センサ</button><span class="lbl">${lab}</span>${ad}</div>`; break;
      case 'lamp': pl+=`<div class="dev"><div class="lamp ${d.color||'yellow'}" data-out="${a}"></div><span class="lbl">${lab}</span>${ad}</div>`; break;
      case 'buzzer': pl+=`<div class="dev"><div class="buzz" data-out="${a}">${ic('bell')}</div><span class="lbl">${lab}</span>${ad}</div>`; break;
      case 'motor': pl+=`<div class="dev"><div class="motor ${d.look?'look-'+d.look:''}" data-out="${a}" ${d.rev?`data-rev="${A(d.rev)}"`:''}>${motorArt(d.look)}</div><span class="lbl">${lab}</span><span class="ad">${dispAddr(a)}${d.rev?' / 逆 '+dispAddr(A(d.rev)):''}</span></div>`; break;
      case 'conveyor': pl+=`<div class="dev"><div class="conv" data-out="${a}" ${d.rev?`data-rev="${A(d.rev)}"`:''}><div class="box"></div><div class="belt"></div></div><span class="lbl">${lab}</span><span class="ad">${dispAddr(a)}${d.rev?' / 逆 '+dispAddr(A(d.rev)):''}</span></div>`; break;
      case 'cylinder': pl+=`<div class="dev"><div class="cyl" data-cyl="${i}"><div class="body"></div><div class="rod"></div><div class="head"></div></div><span class="lbl">${lab}</span>${ad}</div>`; break;
      case 'tank': pl+=`<div class="dev"><div class="tank" data-tank="${i}"><div class="lv"></div></div><span class="lbl">${lab}</span><span class="ad">給水 ${dispAddr(A(d.a))}${d.drain?' / 排水 '+dispAddr(A(d.drain)):''}</span></div>`; break;
    }
  });
  const hasPB=devs.some(d=>d.type==='pb' || d.type==='trainer');
  const el=document.getElementById('machine');
  const tr=devs.find(d=>d.type==='trainer');
  el.innerHTML=`<h3>機械</h3><div class="mach-wrap">
      ${tr ? trainerHTML(st, tr) : `<div class="plant">${pl||'<span class="note">出力機器なし</span>'}</div>
      <div class="opanel">${ip||'<span class="note">操作盤なし</span>'}</div>`}
      <div class="mach-ctrl">
        ${hasPB?`<span class="hold-tip">ボタンは<b>ダブルタップで押しっぱなし</b>(もう一度ダブルタップで離す)</span>`:''}
        <span class="clock" id="clock">停止中 0.0s</span>
      </div></div>`;
  // パレットを手で置き直す(検定の「製品を投入部に手で戻す」に当たる)
  el.querySelectorAll('[data-pal-move]').forEach(b=>b.addEventListener('click', ()=>{
    const p=G.phys[b.dataset.palMove]; if(!p) return;
    p.pos=+b.dataset.to; applyPhysSensors(); SFX.play('click'); updateMachineVis();
  }));
  el.querySelectorAll('[data-in]').forEach(btn=>{
    const a=btn.dataset.in, kind=btn.dataset.kind;
    if(kind==='auto') return;
    // pbnc = 押すと切れる押しボタン(非常停止)。ふだんは入力ON、押している間OFF
    const PRESS = kind==='pbnc' ? false : true;
    btn.addEventListener('contextmenu', e=>e.preventDefault());
    /* ダブルタップの判定(押しっぱなしの固定・解除)
       ・「短いタップ」= 押していた時間が TAP_SHORT 未満
       ・短いタップを離してから DBL_GAP 以内に、同じボタンをもう一度押したらダブルタップ
       ・固定・解除に使ったタップの「離す」は数えない(3連打で固定→すぐ解除、を防ぐ) */
    const TAP_SHORT=260, DBL_GAP=330;
    const info=()=> (G.tapInfo[a] ||= {down:0, lastUp:0, lastShort:false, consume:false});
    btn.addEventListener('pointerdown', e=>{
      e.preventDefault();
      SFX.play('press');
      if(kind==='sw'){ setIn(a, !G.plc.inputs[a]); return; }
      const now=Date.now(), t=info();
      const dbl = t.lastShort && now-t.lastUp < DBL_GAP;
      t.lastShort=false; t.down=now;
      try{ btn.setPointerCapture(e.pointerId); }catch(_){}
      if(G.latch.has(a)){
        // 固定中:1回のタップでは離れない。ダブルタップで解除
        if(dbl){ G.latch.delete(a); t.consume=true; setIn(a,!PRESS); SFX.play('remove'); try{ navigator.vibrate&&navigator.vibrate([12,40,12]); }catch(_){} }
        return;
      }
      if(dbl){ G.latch.add(a); t.consume=true; setIn(a,PRESS); SFX.play('place'); try{ navigator.vibrate&&navigator.vibrate(25); }catch(_){} return; }
      setIn(a, PRESS);
    });
    const isPB = kind==='pb' || kind==='pbnc';
    const up=()=>{
      if(!isPB) return;
      const t=info(), now=Date.now();
      if(t.consume){ t.consume=false; t.lastShort=false; t.lastUp=now; return; }
      t.lastShort = now-t.down < TAP_SHORT; t.lastUp=now;
      if(G.latch.has(a)) return;
      setIn(a,!PRESS);
      // 1回目の短いタップのあと少しの間、「もう1回で固定」の目印を出す
      if(t.lastShort){ btn.classList.add('tap1'); clearTimeout(btn._t1); btn._t1=setTimeout(()=>btn.classList.remove('tap1'), DBL_GAP); }
    };
    btn.addEventListener('pointerup', up);
    btn.addEventListener('pointercancel', ()=>{ const t=info(); t.consume=false; t.lastShort=false; if(isPB && !G.latch.has(a)) setIn(a,!PRESS); });
    btn.addEventListener('keydown', e=>{ if(e.key===' '||e.key==='Enter'){ e.preventDefault(); if(kind==='sw'){ if(!e.repeat) setIn(a,!G.plc.inputs[a]); } else setIn(a,PRESS);} });
    btn.addEventListener('keyup', e=>{ if((e.key===' '||e.key==='Enter') && isPB && !G.latch.has(a)) setIn(a,!PRESS); });
  });
  updateMachineVis();
}
function setIn(a,v){ G.plc.inputs[a]=v; updateMachineVis(); }
/* ---------- 機械の動き(シリンダ・タンク・実習機のベルトとパレット) ----------
   画面の実行と判定(テスト)の両方で同じ動きを使えるよう、ステージ・状態・PLC を引数で受け取る */
// 実習機のベルト:map.BELT=右行き、map.BELTL=左行き。pallet:{start:'right'|'left', travel:端から端までのms, left:'LS1', right:'LS2'}
// 実機は右端が LS1、左端が LS2(左側には品種センサ LS3〜LS5 も並ぶ)
function palletCfg(d){ const p=d.pallet||{}; return {start:p.start||'right', travel:p.travel||3000, left:p.left||'LS2', right:p.right||'LS1'}; }
function physInit(st){
  const ph={};
  (st && st.machine||[]).forEach((d,i)=>{
    if(d.type==='cylinder') ph[i]={pos:0};
    if(d.type==='tank') ph[i]={lv:d.init||0};
    if(d.type==='trainer' && d.pallet) ph[i]={pos: palletCfg(d).start==='left'?0:1};
  });
  return ph;
}
function physStep(st, ph, plc, dt){
  (st.machine||[]).forEach((d,i)=>{
    const p=ph[i]; if(!p) return;
    if(d.type==='cylinder'){
      const on=plc.get(A(d.a)), T=d.time||1000;
      p.pos=Math.max(0, Math.min(1, p.pos + (on?1:-1)*dt/T));
    }
    if(d.type==='tank'){
      const f=plc.get(A(d.a)), dr=d.drain?plc.get(A(d.drain)):false;
      p.lv=Math.max(0, Math.min(1, p.lv + (f?dt/(d.fill||5000):0) - (dr?dt/(d.drainTime||5000):0)));
    }
    if(d.type==='trainer' && d.pallet){
      const m=d.map||{}, c=palletCfg(d);
      const r=m.BELT?plc.get(A(m.BELT)):false, l=m.BELTL?plc.get(A(m.BELTL)):false;
      if(r!==l) p.pos=Math.max(0, Math.min(1, p.pos + (r?1:-1)*dt/c.travel));   // 両方ONなら動かない
    }
  });
  physSensors(st, ph, plc);
}
function physSensors(st, ph, plc){
  (st && st.machine||[]).forEach((d,i)=>{
    const p=ph[i]; if(!p) return;
    if(d.type==='cylinder'){
      if(d.ext) plc.inputs[A(d.ext)] = p.pos>=1;
      if(d.ret) plc.inputs[A(d.ret)] = p.pos<=0;
    }
    if(d.type==='tank'){
      if(d.lo) plc.inputs[A(d.lo)] = p.lv>=0.15;
      if(d.hi) plc.inputs[A(d.hi)] = p.lv>=0.85;
    }
    if(d.type==='trainer' && d.pallet){
      const m=d.map||{}, c=palletCfg(d);
      if(m[c.left])  plc.inputs[A(m[c.left])]  = p.pos<=0.01;
      if(m[c.right]) plc.inputs[A(m[c.right])] = p.pos>=0.99;
    }
  });
}
// 判定でも機械の動きを使うステージか(センサが機械の動きで決まるもの)
function usesPhys(st){ return (st.machine||[]).some(d=>(d.type==='trainer'&&d.pallet) || (d.type==='cylinder'&&(d.ext||d.ret)) || (d.type==='tank'&&(d.lo||d.hi))); }
// 押すと切れるボタン(非常停止 PB5)は、何もしていないとき入力ON
function ncInputs(st){
  const out=[];
  (st && st.machine||[]).forEach(d=>{
    if(d.type==='trainer' && d.map && d.map.PB5) out.push(A(d.map.PB5));
    if(d.type==='pb' && d.nc) out.push(A(d.a));
  });
  const used=new Set((st && st.io||[]).map(x=>A(x.a)));
  return out.filter(a=>used.has(a));
}
function initNC(st, plc){ ncInputs(st).forEach(a=>{ plc.inputs[a]=true; }); }
function resetPhys(){ G.phys=physInit(G.stage); applyPhysSensors(); initNC(G.stage, G.plc); }
function physics(dt){ if(G.stage) physStep(G.stage, G.phys, G.plc, dt); }
function applyPhysSensors(){ if(G.stage) physSensors(G.stage, G.phys, G.plc); }
function updateMachineVis(){
  const el=document.getElementById('machine'); if(!el) return;
  el.querySelectorAll('[data-in]').forEach(b=>{
    // 押すと切れるボタンは、入力がOFFのときが「押されている」見た目
    const nc=b.dataset.kind==='pbnc', on = nc ? !G.plc.inputs[b.dataset.in] : !!G.plc.inputs[b.dataset.in];
    b.classList.toggle('on', on);
    if(b.dataset.kind==='pb'||nc) b.classList.toggle('held', G.latch.has(b.dataset.in) && on);
  });
  const outv=a=> G.running || G.plc.time>0 ? G.plc.get(a) : false;
  el.querySelectorAll('[data-out]').forEach(d=>{
    const f=outv(d.dataset.out), r=d.dataset.rev?outv(d.dataset.rev):false;
    if((f||r) && !d.classList.contains('on') && G.running){
      // 電磁接触器の音。ランプは「じわっ」と点き、モーターはゆっくり回り始めてから速くなる(火花はやめた)
      SFX.play('outOn'); relayReact('happy', 1300);
      d.classList.remove('warm','spinup'); void d.offsetWidth; d.classList.add('warm','spinup');
      clearTimeout(d._w); d._w=setTimeout(()=>d.classList.remove('warm'), 450);
      clearTimeout(d._s); d._s=setTimeout(()=>d.classList.remove('spinup'), 900);
    }
    d.classList.toggle('on', f||r);
    d.classList.toggle('rev', !f && r);
  });
  el.querySelectorAll('[data-cyl]').forEach(d=>{
    const p=G.phys[d.dataset.cyl]||{pos:0}, L=8+p.pos*60;
    d.querySelector('.rod').style.width=L+'px';
    d.querySelector('.head').style.left=(70+L)+'px';
  });
  el.querySelectorAll('[data-tank]').forEach(d=>{
    const p=G.phys[d.dataset.tank]||{lv:0};
    d.querySelector('.lv').style.height=(p.lv*100)+'%';
  });
  el.querySelectorAll('[data-pallet]').forEach(b=>{
    const p=G.phys[b.dataset.pallet]||{pos:1};
    b.style.left=`calc(${(p.pos*100).toFixed(2)}% - ${(p.pos*34).toFixed(1)}px)`;
  });
  el.querySelectorAll('[data-revonly]').forEach(d=>{ d.classList.toggle('rev', d.classList.contains('on')); });
  const ol=document.getElementById('tr-oled');
  if(ol){ const t=Object.values(G.plc.tm||{})[0], c=Object.values(G.plc.ct||{})[0];
    ol.textContent = c ? 'CNT '+c.cv : t ? 'T '+((t.et||0)/1000).toFixed(1)+'s' : (G.running?'RUN ':'STOP ')+(G.plc.time/1000).toFixed(1)+'s'; }
  const ck=document.getElementById('clock');
  if(ck) ck.textContent=(G.running?'実行中 ':'停止中 ')+(G.plc.time/1000).toFixed(1)+'s';
}

/* ---------- 実行ループ ---------- */
function startRun(){
  if(G.running) return;
  G.running=true; G.acc=0; G.last=performance.now();
  updateRunUI();
  // 実時間に合わせてスキャンを進める(タブが裏に回っても時間がずれにくいよう setInterval を使用)
  const loop=()=>{
    if(!G.running) return;
    const ts=performance.now();
    let el=ts-G.last; G.last=ts;
    if(el>1000) el=1000;
    G.acc+=el;
    while(G.acc>=SCAN_MS){
      physics(SCAN_MS);
      G.plc.scan(G.prog, SCAN_MS);
      G.acc-=SCAN_MS;
    }
    updateLadderVis(); updateMachineVis();
  };
  G.raf=setInterval(loop, 20);
}
function stopRun(){
  G.running=false; clearInterval(G.raf);
  if(G.stage) updateRunUI();
}

// 入力の種類(押しボタン・切替スイッチ・センサ・押すと切れるボタン)
function inKind(st, a){
  for(const d of (st.machine||[])){
    if(d.type==='trainer'){ for(const k in (d.map||{})) if(A(d.map[k])===a){ if(k==='PB5') return 'pbnc'; if(/^PB/.test(k)) return 'pb'; if(/^SS/.test(k)) return 'sw'; if(/^LS/.test(k)) return 'sensor'; } continue; }
    if(d.a && A(d.a)===a) return d.type==='pb' ? (d.nc?'pbnc':'pb') : d.type;
    for(const key of ['ext','ret','lo','hi']) if(d[key] && A(d[key])===a) return 'sensor';
  }
  return '?';
}
// 不合格の説明:テストでの操作を、ふだんの言葉で順に書く(「押してすぐ離す」はまとめる)
// 「運転ボタン(ボタン1)」のように、割付表の役割名+部品名で書く
function ioLabel(st, a){
  const P=prep(st), n=showName(st,a)||dispAddr(a), io=P.io.find(x=>x.a===a)||P.mem.find(x=>x.a===a);
  const role=io&&io.desc ? io.desc.split(/[((]/)[0].trim() : '';
  const base = role && role!==n ? `${role}(${n})` : n;
  return addrOn() ? `${base} ${dispAddr(a)}` : base;
}
// テストの操作を、ふだんの言葉で時刻順に書く(upto 秒まで。「押してすぐ離す」はまとめる)
function opsTimeline(st, steps, upto){
  const name=a=>ioLabel(st,a), sec=t=>(t/1000).toFixed(1)+'秒';
  const verb=(a,v)=>{ const k=inKind(st,a), n=name(a);
    if(k==='pb') return v?`${n}を押す(押したまま)`:`${n}を離す`;
    if(k==='pbnc') return v?`${n}を離す`:`${n}を押す(押したまま)`;
    if(k==='sw') return `${n}を${v?'ON':'OFF'}にする`;
    if(k==='sensor') return `${n}が${v?'ON':'OFF'}になる`;
    return `${n}を${v?'ON':'OFF'}`; };
  const skip=new Set(); let tl='';
  steps.forEach(s=>{
    if(s.t>upto) return;
    const ins=[];
    for(const [a,v] of Object.entries(s.in)){
      if(skip.has(s.t+'|'+a)) continue;
      const back=steps.find(x=>x.t===s.t+TAP_MS && x.in[a]===!v);
      const k=inKind(st,a);
      if(back && (k==='pb'||k==='pbnc') && (k==='pb'?v:!v)){ skip.add(back.t+'|'+a); ins.push(`${name(a)}を押してすぐ離す`); continue; }
      ins.push(verb(a,v));
    }
    if(ins.length) tl+=`<div>${sec(s.t)}:${esc(ins.join('、'))}</div>`;
  });
  return tl;
}
function failHTML(st, r){
  const name=a=>ioLabel(st,a), sec=t=>(t/1000).toFixed(1)+'秒';
  const tl=opsTimeline(st, r.steps, r.t);
  const state=(a,v)=>{ const k=kindOf(a); return k==='Q' ? (v?'ON(動く・つく)':'OFF(止まる・消える)') : (v?'ON':'OFF'); };
  let bad;
  if(r.forbid) bad=`${sec(r.t)}:危険! ${esc(r.forbid.msg || r.forbid.all.map(name).join(' と ')+' が同時にON')}`;
  else bad=`${sec(r.t)}の時点で、${esc(name(r.addr))} は <b>${state(r.addr,r.exp)}</b> のはずが、<b>${state(r.addr,r.act)}</b> になっていました`;
  return `<p class="result-ng">不合格… テスト${r.idx+1}「${esc(r.name)}」</p>
    <div class="note">このテストでの操作(最初は全部OFF・離した状態)</div>
    <div class="timeline">${tl||'<div>(何も操作しない)</div>'}<div class="bad">${bad}</div></div>
    <p class="note">機械のボタンで同じ順番に操作して、ラダー図の光がどこで途切れるか見てみよう。</p>`;
}
/* 不合格のテストを、機械とラダー図で再生する。落ちた時刻に、その出力をラダー図と機械の両方で赤く点滅させる */
function replayFail(st, r){
  stopReplay();
  resetRun(); G.latch=new Set(); startRun();
  const bar=document.createElement('div'); bar.className='replay-bar';
  bar.innerHTML=`<span>${ic('reset')} 再生中</span><span class="rt">0.0秒</span><button class="btn small" data-rp="stop">やめる</button>`;
  document.body.appendChild(bar);
  const timers=[]; G.replay={bar, timers};
  bar.querySelector('[data-rp]').onclick=()=>stopReplay();
  const t0=performance.now();
  const clock=setInterval(()=>{ const t=(performance.now()-t0)/1000; bar.querySelector('.rt').textContent=t.toFixed(1)+'秒'; }, 100);
  timers.push({clear:()=>clearInterval(clock)});
  r.steps.forEach(s=>{
    if(s.t>r.t) return;
    timers.push(setTimeout(()=>{ for(const [a,v] of Object.entries(s.in)) setIn(a,v); }, s.t));
  });
  timers.push(setTimeout(()=>{
    clearInterval(clock);
    const name=ioLabel(st, r.addr||'');
    bar.classList.add('ng');
    bar.innerHTML=r.forbid ? `<span>${esc(r.forbid.msg||'危険な状態')}</span><button class="btn small" data-rp="stop">閉じる</button>`
      : `<span>${(r.t/1000).toFixed(1)}秒:${esc(name)} は ${r.exp?'ON':'OFF'} のはずが ${r.act?'ON':'OFF'}</span><button class="btn small" data-rp="stop">閉じる</button>`;
    bar.querySelector('[data-rp]').onclick=()=>stopReplay();
    SFX.play('fail');
    // その出力のラングと機械を赤く点滅
    const ri=G.prog.findIndex(rg=>rg.out && (rg.out.a===r.addr || rg.out.n===r.addr));
    const els=[ri>=0?document.getElementById('o-'+ri):null, ...document.querySelectorAll(`#machine [data-out="${r.addr}"]`)].filter(Boolean);
    els.forEach(e=>{ e.classList.remove('failflash'); void e.getBoundingClientRect(); e.classList.add('failflash'); });
    if(ri>=0){ const o=document.getElementById('o-'+ri); if(o) o.scrollIntoView({block:'center', behavior:reduced()?'auto':'smooth'}); }
    stopRun();   // 止めて、その瞬間の光の流れを見られるようにする
    updateLadderVis(); updateMachineVis();
  }, r.t+40));
}
function stopReplay(){
  const R=G.replay; if(!R) return;
  R.timers.forEach(t=>{ if(t && t.clear) t.clear(); else clearTimeout(t); });
  R.bar.remove(); G.replay=null;
  document.querySelectorAll('.failflash').forEach(e=>e.classList.remove('failflash'));
  if(G.stage){ resetRun(); startRun(); }
}
function judge(){
  if(G.judging) return;
  const st=G.stage, P=prep(st), r=runAllTests(G.prog, st);
  const finish=()=>{
    G.judging=false;
    if(!r.ok){
      SFX.play('fail');
      const bg=openModal(`${talkHTML(pick(LINES.fail),'sad')}${failHTML(st,r)}<div class="acts">${r.steps?`<button class="btn" data-m="replay">${ic('reset')} この操作を再生</button>`:''}<button class="btn primary" data-m="close">直してみる</button></div>`, t=>{
        if(t.dataset.m==='replay'){ closeModal(); replayFail(st, r); }
      });
      bg.querySelector('.modal').classList.add('ng');
      return;
    }
    onClear();
  };
  if(reduced()){ finish(); return; }
  // 判定中の演出:試験装置の検査画面。テスト項目を1行ずつ「待機 → 試験中 → OK/NG」と埋めていく(結果は計算済み)
  G.judging=true;
  const upto = r.ok ? P.tests.length : r.idx+1;
  const ov=document.createElement('div'); ov.className='tbench';
  ov.innerHTML=`<div class="tb">
    <div class="tb-head"><span class="tb-title">動作試験</span><span class="tb-id">${esc(st.id)} ${esc(st.title)}</span></div>
    <div class="tb-bar"><i id="tbbar"></i></div>
    ${P.tests.map((t,i)=>`<div class="tb-row" id="jr${i}"><span class="no">No.${i+1}</span><span class="nm">${esc(t.name||'')}</span><span class="st">待機</span><i class="lp"></i></div>`).join('')}
    <div class="tb-foot">タップで結果へ</div></div>`;
  document.body.appendChild(ov);
  let done=false;
  const end=()=>{ if(done) return; done=true; ov.remove(); finish(); };
  ov.addEventListener('click', end);   // タップで演出を飛ばす
  const step=Math.max(220, Math.min(420, 1600/P.tests.length));
  const bar=ov.querySelector('#tbbar');
  let i=0;
  const next=()=>{
    if(done) return;
    if(i>0){
      const prev=ov.querySelector('#jr'+(i-1)), bad=!r.ok && i-1===r.idx;
      prev.classList.remove('run'); prev.classList.add(bad?'ng':'ok');
      prev.querySelector('.st').textContent=bad?'NG':'OK';
      SFX.play(bad?'ngbuzz':'okbeep');
      bar.style.width=Math.round(i/P.tests.length*100)+'%';
      if(bad) bar.classList.add('ng');
    }
    if(i>=upto){ setTimeout(end, r.ok?380:700); return; }
    const cur=ov.querySelector('#jr'+i); cur.classList.add('run'); cur.querySelector('.st').textContent='試験中'; SFX.play('scan');
    i++; setTimeout(next, step);
  };
  setTimeout(next, 200);
}

  const html=`<div class="pass ${st.boss?'boss':''}">

    </div>
    <div class="plamps">
      ${[['テスト合格',stars[0]],[`接点数 ${n}個(目標${P.target}以下)`,stars[1]],['ヒントなし',stars[2]]].map(([l,on],i)=>
        `<div class="plamp ${on?'on':''}" style="--d:${T0+.6+i*.28}s"><i></i><span>${l}</span></div>`).join('')}
    </div>
    <div class="xpgain">${gain>0?`+<span id="xpcount">0</span> XP`:'<span class="note">(獲得XPなし:すでに取得済み)</span>'}</div>
    ${lvUp?`<div class="lvcard"><small>レベルアップ</small><b>Lv.${oldL} → Lv.${newL}</b>${newTitle?`<span>${ic('medal')} 称号「${esc(titleOf(newL))}」</span>`:''}</div>`:''}
    </div>
    ${newDex.some(id=>PALS[id])?`<div class="pal-join">${newDex.filter(id=>PALS[id]).map(id=>`<div class="pal-card">${palSVG(id,'happy')}<b>${esc((DEX.find(x=>x.id===id)||{}).name||id)}</b><small>を手札で使えるようになった</small></div>`).join('')}</div>`:''}
    ${dexNames.length?`<div class="newdex">${ic('book')} 命令図鑑に追加:<b>${esc(dexNames.join('、'))}</b></div>`:''}
    ${talkHTML(pick(st.boss?LINES.boss:LINES.clear),'happy')}
    <div class="acts">
      <button class="btn" data-m="close">このステージに残る</button>
      ${st.boss
        ? `${next?`<button class="btn" data-m="next">次のステージへ</button>`:''}<button class="btn primary" data-m="map">${ic('map')} マップで送電を見る</button>`
        : `<button class="btn" data-m="map">マップへ</button>${next?`<button class="btn primary" data-m="next">次のステージへ</button>`:''}`}
    </div>`;
  openModal(html, t=>{
    if(t.dataset.m==='map'){ closeModal(); saveDraft(); showMap(); }
    if(t.dataset.m==='next'){ closeModal(); saveDraft(); openStage(next); }
  });
  // 音:ボスは送電のうなり → 判子 → 表示灯のカチッ → チャイム。ふつうは判子から
  const ms=s=>Math.round(s*1000);
  if(st.boss) SFX.play('power');
  setTimeout(()=>SFX.play('stamp'), ms(T0+.2));
  stars.forEach((on,i)=>{ if(on) setTimeout(()=>SFX.play('relay'), ms(T0+.6+i*.28)); });
  setTimeout(()=>SFX.play('chime'), ms(T0+1.5));
  const xc=document.getElementById('xpcount');
  if(xc) xc.textContent=gain;   // 数え上げはやめ、そのまま表示
  const head=document.querySelector('.stage-head .info'); if(head) head.innerHTML=starsHTML(rec.stars);
  renderBottom();
}
function nextStage(st){
  const i=STAGES.indexOf(st);
  for(let j=i+1;j<STAGES.length;j++) if(stageUnlocked(STAGES[j])) return STAGES[j];
  return null;
}
function openplcHTML(st){
  const P=prep(st), op=st.openplc||{};
  const usesT=P.answer.some(r=>r.out && (r.out.t==='TON'||r.out.t==='TOF'));
  const usesC=P.answer.some(r=>r.out && (r.out.t==='CTU'||r.out.t==='CTD'));
  return `<h2>OpenPLC Editorで同じ回路を組んでみよう</h2>
    <div class="note">割付表(変数表に登録。Type は BOOL、Location にアドレスを入力)</div>
    ${ioTableHTML(st)}
    <ol class="steps">
      <li>新規プロジェクトを作り、言語「LD」のプログラムを追加する</li>
      <li>上の割付表どおりに変数を登録する(変数名は「名前」の列を使うと分かりやすい)</li>
      <li>左パワーレール → 接点 → 出力 → 右パワーレール の順に置き、下の図と同じ形に線でつなぐ</li>
      ${usesT?'<li>タイマは関数ブロックの TON / TOF を置き、PT に時間(例: T#2s)を入れる。接点では インスタンス名.Q を使う</li>':''}
      ${usesC?'<li>カウンタは関数ブロックの CTU / CTD を置き、PV に設定値、R(CTDはLD)に信号をつなぐ</li>':''}
      <li>シミュレーションを開始し、入力を強制ON/OFFして次を確認する</li>
    </ol>
    ${(op.check||[]).length?`<div class="note">確認ポイント</div><ul>${op.check.map(c=>`<li>${esc(c)}</li>`).join('')}</ul>`:''}
    ${op.note?`<p class="note">${esc(op.note)}</p>`:''}
    <div class="note">参考:模範解答の形</div>
    ${P.answer.map((rg,i)=>`<div class="preview-svg">${rungSVGStatic(rg,i,st)}</div>`).join('')}`;
}
function rungSVGStatic(rg, i, st){
  // 読み取り専用で描画(穴埋めの「?」表示を出さないため一時的に種類を無視)
  const saved=G.stage; const fake=Object.assign({},st,{type:'build'});
  G.stage=fake;
  const s=rungSVG(rg, 'p'+i, st, {readonly:true});
  G.stage=saved;
  return s;
}
function showAnswer(){
  const st=G.stage, P=prep(st), rec=stRec(st.id);
  const view=()=>{
    openModal(`<h2>模範解答</h2>${P.answer.map((rg,i)=>`<div class="preview-svg">${rungSVGStatic(rg,i,st)}</div>`).join('')}
      <p class="note">接点数 ${countContacts(P.answer)}個。ほかの組み方でもテストに合格すればクリアです。</p>
      <div class="acts"><button class="btn" data-m="close">閉じる</button>${st.type==='fill'?'':'<button class="btn primary" data-m="load">エディタに読み込む</button>'}</div>`, t=>{
      if(t.dataset.m==='load'){
        if(!confirm('今の回路を模範解答で置き換えますか?')) return;
        G.prog=clone(P.answer); closeModal(); edited();
      }
    });
  };
  if(isCleared(st.id)) return view();
  openModal(`<h2>模範解答を見る?</h2><p>クリア前に見ると、このステージの★3(ヒント未使用)は取れなくなります。</p>
    <div class="acts"><button class="btn" data-m="close">やめる</button><button class="btn primary" data-m="yes">見る</button></div>`, t=>{
    if(t.dataset.m==='yes'){ rec.peeked=true; persist(); view(); }
  });
}

/* ---------- 命令図鑑 ---------- */
function showDex(){
  const got=G.save.dex;
  let h=`<h2>命令図鑑 (${DEX.filter(d=>got.includes(d.id)).length}/${DEX.length})</h2>
    <div class="opts" style="margin:-4px 0 8px"><button class="btn small" data-m="words">${ic('book')} ことば帳(用語の説明)</button></div>`;
  // 仲間の欄:覚えた命令のキャラが並ぶ。まだの仲間はシルエット
  h+=`<div class="pal-shelf">${Object.keys(PALS).map(id=>{
      const d=DEX.find(x=>x.id===id)||{}, have=got.includes(id);
      return `<div class="pal-card ${have?'':'unk'}">${palSVG(id, have?'happy':'normal')}
        <b>${have?esc(d.name||id):'???'}</b>${have?`<small>「${esc(PALS[id].say)}」</small>`:`<small>エリア${d.area||'?'}で覚える</small>`}</div>`;
    }).join('')}</div><p class="note" style="margin:2px 0 10px">新しい部品や命令を覚えると、ここに並び、手札で使えるようになります。</p>`;
  for(const d of DEX){
    if(got.includes(d.id)){
      h+=`<div class="dex-item ${PALS[d.id]?'has-pal':''}">${PALS[d.id]?palSVG(d.id,'normal','dex-pal'):''}<div><h4>${esc(d.name)}</h4><div class="op">${esc(d.op)}</div><p style="margin:4px 0">${esc(d.text)}</p><div class="note">ポイント:${esc(d.tip)}</div></div></div>`;
    } else {
      const ready=areaReady(d.area);
      h+=`<div class="dex-item locked"><h4>???</h4><div class="note">エリア${d.area}「${esc(AREAS[d.area-1].name)}」で解放${ready?'':'(準備中)'}</div></div>`;
    }
  }
  h+=`<div class="acts"><button class="btn primary" data-m="close">閉じる</button></div>`;
  openModal(h, t=>{ if(t.dataset.m==='words'){ closeModal(); showGlossary(); } });
}

/* ---------- データ(書き出し/読み込み) ---------- */
function showData(){
  const html=`<h2>データ</h2>
    <p class="note">進捗はこのブラウザに自動保存されています。別の端末に移したり、後輩に渡したりするときはJSONファイルに書き出してください。</p>
    <div class="opts">
      <button class="btn primary" data-m="export">JSONに書き出す</button>
      <button class="btn" data-m="import">JSONを読み込む</button>
      <button class="btn danger" data-m="wipe">進捗をすべて消す</button>
    </div>
    <input type="file" id="impfile" accept=".json,application/json" class="hidden">
    <div class="acts"><button class="btn" data-m="close">閉じる</button></div>`;
  const bg=openModal(html, t=>{
    const m=t.dataset.m;
    if(m==='export') exportSave();
    if(m==='import') bg.querySelector('#impfile').click();
    if(m==='wipe'){
      if(confirm('進捗・XP・下書きをすべて消します。元に戻せません。よろしいですか?')){
        G.save=defaultSave(); persist(); closeModal(); showMap(); toast('進捗を消しました');
      }
    }
  });
  bg.querySelector('#impfile').addEventListener('change', e=>{
    const f=e.target.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=()=>{
      try{
        const s=JSON.parse(rd.result);
        if(!validSave(s)) throw new Error('形式が違います');
        if(!confirm('読み込んだデータで今の進捗を上書きします。よろしいですか?')) return;
        G.save=Object.assign(defaultSave(), s); persist(); closeModal(); showMap(); toast('読み込みました');
      }catch(err){ toast('読み込めませんでした:'+err.message); }
    };
    rd.readAsText(f);
  });
}
function exportSave(){
  const blob=new Blob([JSON.stringify(G.save,null,1)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='ladder_save_'+ymd(new Date()).replace(/-/g,'')+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
  toast('書き出しました');
}

/* ---------- 起動 ---------- */
function setupPWA(){
  // https(または localhost)で配信されているときだけ、オフライン用のサービスワーカーを登録する
  if(!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return;
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
  // 進捗がブラウザの容量整理で消されにくくなるよう依頼する(許可されなくても動作に影響なし)
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
}
/* ---------- 設定画面 ---------- */
function openSettings(){
  const draw=()=>{
    const o=(k,v,label,sub)=>`<button class="opt ${G.set[k]===v?'sel':''}" data-m="set" data-k="${k}" data-v="${v}">${label}${sub?`<small>${sub}</small>`:''}</button>`;
    const mel=G.set.astyle==='mel';
    const ex = (G.set.names==='symbol'?'PB1':G.set.names==='both'?'ボタン1 PB1':'ボタン1') + (G.set.addr?(mel?'(X5)':'(%IX0.5)'):'');
    const am=(v,label,sub)=>{ const sel = v==='off' ? !G.set.addr : (G.set.addr && (v==='mel')===mel);
      return `<button class="opt ${sel?'sel':''}" data-m="addrmode" data-v="${v}">${label}<small>${sub}</small></button>`; };
    return `<h2>${ic('gear')} 設定</h2>
      <div class="note">部品の名前</div>
      <div class="opts">${o('names','easy','やさしい名前','ボタン1・ランプ1')}${o('names','symbol','記号','PB1・PL1')}${o('names','both','両方','ボタン1 PB1')}</div>
      <div class="note">アドレス(入力・出力の番号)</div>
      <div class="opts">${am('off','表示しない','はじめての人向け')}${am('mel','三菱式','X0・Y0(検定・実習機)')}${am('iec','OpenPLC式','%IX0.0・%QX0.0')}</div>
      <div class="set-ex">表示の例:<b>${esc(ex)}</b></div>
      <div class="note">効果音</div>
      <div class="opts"><button class="opt ${SFX.on()?'sel':''}" data-m="snd" data-v="1">ON</button><button class="opt ${SFX.on()?'':'sel'}" data-m="snd" data-v="0">OFF</button></div>
      ${typeof bgmSettingsHTML==='function'?bgmSettingsHTML():''}
      <div class="note">そのほか</div>
      <div class="opts"><button class="btn small" data-m="lesson">${ic('hint')} 基礎講座(ラダー図のしくみ)</button><button class="btn small" data-m="words">${ic('book')} ことば帳</button><button class="btn small" data-m="install">${ic('save')} アプリとして使う・人に教える</button><button class="btn small" data-m="tut">${ic('hint')} チュートリアルをもう一度</button><button class="btn small" data-m="data">${ic('save')} データ(書き出し・読み込み)</button></div>
      <div class="acts"><button class="btn primary" data-m="close">閉じる</button></div>`;
  };
  const bg=openModal(draw(), t=>{
    const m=t.dataset.m;
    if(m==='set'){ const k=t.dataset.k, v=t.dataset.v; G.set[k] = (k==='addr'||k==='guide') ? v==='true' : v; saveSettings(); applySettings();
      bg.querySelector('.modal').innerHTML=draw();
      // ガイド枠を切り替えたら、今のステージを組み直しの状態から始め直す
      if(k==='guide' && G.stage && !G.stage.tutorial && G.stage.type==='build' && G.stage.area<=2){ G.prog=initialProg(G.stage); saveDraft(); }
      if(G.stage){ renderEditor(); renderMachine(); renderBottom(); } return; }
    if(m==='addrmode'){ const v=t.dataset.v; G.set.addr = v!=='off'; if(v!=='off') G.set.astyle=v; saveSettings(); applySettings();
      bg.querySelector('.modal').innerHTML=draw(); if(G.stage){ renderEditor(); renderMachine(); renderBottom(); } return; }
    if(m==='words'){ closeModal(); showGlossary(); return; }
    if(m==='lesson'){ closeModal(); if(typeof showLesson==='function') showLesson(); return; }
    if(m==='install'){ closeModal(); showInstall(); return; }
    if(m==='snd'){ SFX.set(t.dataset.v==='1'); document.querySelectorAll('[data-snd]').forEach(x=>x.innerHTML=ic(SFX.on()?'sound':'mute')); bg.querySelector('.modal').innerHTML=draw(); return; }
    if(m==='tut'){ closeModal(); openStage(tutStage()); return; }
    if(m==='data'){ closeModal(); showData(); return; }
  });
}

function boot(){
  setupPWA();
  G.set=loadSettings(); applySettings();
  G.save=loadSave();
  window.addEventListener('beforeunload', ()=>{ if(G.stage) saveDraft(); });
  // アプリを裏から戻したときに音が消えないよう、戻った時と最初のタップで起こし直す
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) SFX.wake(); });
  window.addEventListener('pageshow', ()=>SFX.wake());
  window.addEventListener('focus', ()=>SFX.wake());
  document.addEventListener('pointerdown', ()=>SFX.wake(), true);
  showTitle();
}
/* ---------- 追加のファイルを読み込んでから起動する ----------
   2026-11-24 から、新しく書く部分は js/ フォルダに分けて置く(1ファイルを数百行までにするため)。
   作業用の ladder_game.html から開いたときは ladder-app/js/ を、公開版(index.html)では js/ を読む */
const JS_BASE = /ladder_game\.html$/i.test(location.pathname) ? 'ladder-app/js/' : 'js/';
const EXTRA_JS = ['ext-instr.js', 'area6.js', 'demo.js', 'mission.js', 'mem.js', 'mobile.js', 'lesson.js', 'pin.js', 'practice.js', 'usability.js', 'bridge.js', 'story.js', 'wrap.js', 'bgm-tracks.js', 'bgm.js'];

function loadScript(src){
  return new Promise(resolve=>{
    const s = document.createElement('script');
    s.src = src;
    s.onload = ()=>resolve(true);
    // 読み込めなくても、今あるステージだけで起動する
    s.onerror = ()=>{ console.warn('読み込めませんでした: ' + src); resolve(false); };
    document.body.appendChild(s);
  });
}

async function loadExtrasAndBoot(){
  for(const f of EXTRA_JS){
    await loadScript(JS_BASE + f);
  }
  boot();
}

if(typeof document!=='undefined') loadExtrasAndBoot();
</script>
