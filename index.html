/* ---------- エディタ ---------- */
const GEO={X0:24, CW:78, OW:150, TOP:36, RH:66};
function isFill(){ return G.stage && G.stage.type==='fill'; }
function cellLocked(rg,r,c){ return isFill() && rg.lock && rg.lock[r] ? rg.lock[r][c]!==false : false; }
function outLocked(rg){ return isFill() && rg.olock!==false; }

function contactSVG(cell, x, y, st){
  const cx=x+GEO.CW/2;
  let s=`<line class="ls" x1="${x}" y1="${y}" x2="${cx-9}" y2="${y}"/>`;
  s+=`<rect class="cfill" x="${cx-9}" y="${y-14}" width="18" height="28"/>`;
  s+=`<line class="sym" x1="${cx-9}" y1="${y-15}" x2="${cx-9}" y2="${y+15}"/><line class="sym" x1="${cx+9}" y1="${y-15}" x2="${cx+9}" y2="${y+15}"/>`;
  if(cell.t==='NC') s+=`<line class="sym" x1="${cx-14}" y1="${y+13}" x2="${cx+14}" y2="${y-13}"/>`;
  s+=`<line class="rs" x1="${cx+9}" y1="${y}" x2="${x+GEO.CW}" y2="${y}"/>`;
  s+=`<text class="lab" x="${cx}" y="${y-20}" text-anchor="middle">${esc(dispAddr(cell.a))}</text>`;
  s+=`<text class="nm" x="${cx}" y="${y+28}" text-anchor="middle">${esc(nameOf(st,cell.a))}</text>`;
  return s;
}
function outSVG(o, x0, xR, y, st, ri){
  const cx=(x0+xR)/2;
  let s='';
  if(!o){
    return s;
  }
  if(o.t==='COIL'){
    s+=`<line x1="${x0}" y1="${y}" x2="${cx-14}" y2="${y}"/>`;
    s+=`<circle class="ofill" cx="${cx}" cy="${y}" r="13"/>`;
    s+=`<path d="M${cx-8} ${y-15} A 17 17 0 0 0 ${cx-8} ${y+15}"/><path d="M${cx+8} ${y-15} A 17 17 0 0 1 ${cx+8} ${y+15}"/>`;
    s+=`<line x1="${cx+14}" y1="${y}" x2="${xR}" y2="${y}"/>`;
    s+=`<text class="lab" x="${cx}" y="${y-21}" text-anchor="middle">${esc(o.a)}</text>`;
    s+=`<text class="nm" x="${cx}" y="${y+29}" text-anchor="middle">${esc(nameOf(st,o.a))}</text>`;
    return s;
  }
  const bw=104, bh=50, bx=cx-bw/2, by=y-20;
  s+=`<line x1="${x0}" y1="${y}" x2="${bx}" y2="${y}"/>`;
  s+=`<rect class="ofill" x="${bx}" y="${by}" width="${bw}" height="${bh}" rx="4"/>`;
  s+=`<rect class="box" x="${bx}" y="${by}" width="${bw}" height="${bh}" rx="4"/>`;
  s+=`<line x1="${bx+bw}" y1="${y}" x2="${xR}" y2="${y}"/>`;
  s+=`<text class="big" x="${cx}" y="${by-5}" text-anchor="middle">${o.t} ${esc(o.n)}</text>`;
  if(o.t==='TON'||o.t==='TOF'){
    s+=`<text class="lab" x="${bx+6}" y="${by+18}">PT ${(o.pt/1000).toFixed(1)}s</text>`;
    s+=`<text class="lab" id="et-${ri}" x="${bx+6}" y="${by+36}">ET 0.0s</text>`;
  } else {
    s+=`<text class="lab" x="${bx+6}" y="${by+18}">PV ${o.pv}  CV <tspan id="cv-${ri}">0</tspan></text>`;
    s+=`<text class="lab" x="${bx+6}" y="${by+36}">${o.t==='CTU'?'R':'LD'}: ${esc(o.r||'なし')}</text>`;
  }
  return s;
}
function rungSVG(rg, ri, st, opt){
  opt=opt||{};
  const ed=!opt.readonly;
  const R=rg.cells.length, C=rg.cells[0].length, {X0,CW,OW,TOP,RH}=GEO;
  const xO=X0+C*CW, xR=xO+OW, W=xR+14, H=TOP+(R-1)*RH+40;
  const yc=r=>TOP+r*RH;
  let s=`<svg class="rung-svg" viewBox="0 0 ${W} ${H}" data-ri="${ri}">`;
  s+=`<line class="rail" x1="${X0}" y1="4" x2="${X0}" y2="${H-4}"/><line class="rail" x1="${xR}" y1="4" x2="${xR}" y2="${H-4}"/>`;
  for(let r=0;r<R;r++){
    for(let c=0;c<C;c++){
      const cell=rg.cells[r][c], x=X0+c*CW, y=yc(r), lk=cellLocked(rg,r,c);
      s+=`<g class="cell" id="c-${ri}-${r}-${c}">`;
      if(ed) s+=`<rect class="hit ${lk?'locked':''}" data-act="cell" data-ri="${ri}" data-r="${r}" data-c="${c}" x="${x+1}" y="${y-RH/2+1}" width="${CW-2}" height="${RH-2}" rx="6"/>`;
      if(!cell){
        if(isFill() && !lk) s+=`<rect class="qbox" x="${x+8}" y="${y-22}" width="${CW-16}" height="44" rx="6"/><text class="q" x="${x+CW/2}" y="${y+8}" text-anchor="middle">?</text>`;
        else if(ed && !lk) s+=`<rect class="blank" x="${x+10}" y="${y-18}" width="${CW-20}" height="36" rx="5"/>`;
      } else if(cell.t==='W'){
        s+=`<line class="ls" x1="${x}" y1="${y}" x2="${x+CW}" y2="${y}"/>`;
      } else {
        s+=contactSVG(cell,x,y,st);
      }
      if(isFill() && !lk && cell) s+=`<rect class="qbox" x="${x+4}" y="${y-31}" width="${CW-8}" height="62" rx="6" style="fill:none"/>`;
      if(ed) s+=`<circle class="xbg" cx="${x+CW-9}" cy="${y-17}" r="8"/><text class="xm" x="${x+CW-9}" y="${y-13}" text-anchor="middle">✕</text>`;
      s+='</g>';
    }
  }
  // 縦線
  for(let r=0;r<R-1;r++){
    for(let b=1;b<=C;b++){
      const x=X0+b*CW, y1=yc(r), y2=yc(r+1);
      if(rg.v[r][b]) s+=`<line class="vl" id="v-${ri}-${r}-${b}" x1="${x}" y1="${y1}" x2="${x}" y2="${y2}"/>`;
      if(ed && !isFill()){
        s+=`<rect class="vhit" data-act="v" data-ri="${ri}" data-r="${r}" data-b="${b}" x="${x-15}" y="${y1+12}" width="30" height="${y2-y1-24}"/>`;
        if(!rg.v[r][b]) s+=`<circle class="vdot" cx="${x}" cy="${(y1+y2)/2}" r="5"/>`;
      }
    }
  }
  // 出力
  const olk=outLocked(rg);
  s+=`<g class="out" id="o-${ri}">`;
  if(ed) s+=`<rect class="hit ${olk?'locked':''}" data-act="out" data-ri="${ri}" x="${xO+2}" y="${yc(0)-RH/2+1}" width="${OW-4}" height="${RH-2}" rx="6"/>`;
  if(rg.out) s+=outSVG(rg.out, xO, xR, yc(0), st, ri);
  else if(isFill() && !olk) s+=`<rect class="qbox" x="${xO+30}" y="${yc(0)-22}" width="${OW-60}" height="44" rx="6"/><text class="q" x="${xO+OW/2}" y="${yc(0)+8}" text-anchor="middle">?</text>`;
  else if(ed) s+=`<rect class="blank" x="${xO+30}" y="${yc(0)-18}" width="${OW-60}" height="36" rx="5"/><text x="${xO+OW/2}" y="${yc(0)+4}" text-anchor="middle">出力</text>`;
  s+='</g></svg>';
  return s;
}
function renderEditor(){
  const st=G.stage, P=prep(st), fill=isFill();
  const n=countContacts(G.prog);
  let h=`<h3>ラダーエディタ <span class="note">マスをタップして部品を置く/●をタップで縦線</span></h3>
    <div class="toolbar">
      ${fill?'':`<button class="btn small" data-act="addRung" ${G.prog.length>=P.maxRungs?'disabled':''}>+ ラング追加</button>`}
      <button class="btn small" data-act="clearAll">最初に戻す</button>
      <button class="btn small" data-act="answer">模範解答</button>
      <span class="cnt ${n>0&&n<=P.target?'good':''}">接点数 <b>${n}</b> 個(★目標 ${P.target}個以下)</span>
    </div><div id="rungs">`;
  G.prog.forEach((rg,ri)=>{
    h+=`<div class="rung"><div class="rung-head"><span class="n">ラング ${ri+1}</span>`;
    if(!fill){
      h+=`<button data-act="up" data-ri="${ri}" ${ri===0?'disabled':''}>↑</button>
          <button data-act="down" data-ri="${ri}" ${ri===G.prog.length-1?'disabled':''}>↓</button>
          <button data-act="rowAdd" data-ri="${ri}" ${rg.cells.length>=P.maxRows?'disabled':''}>行+</button>
          <button data-act="rowDel" data-ri="${ri}" ${rg.cells.length<=1?'disabled':''}>行−</button>
          <button data-act="rungDel" data-ri="${ri}">削除</button>`;
    }
    h+=`</div>${rungSVG(rg,ri,st)}<div class="rstat" id="rs-${ri}"></div></div>`;
  });
  h+='</div>';
  const el=document.getElementById('editor');
  el.innerHTML=h;
  el.classList.toggle('running', G.running);
  if(G.pop){ const pe=document.getElementById(G.pop); if(pe){ pe.classList.add('pop'); burstAt(pe, 14, {power:50, size:7}); } SFX.play('place'); G.pop=null; }
  updateLadderVis();
}
function edited(){ saveDraft(); renderEditor(); }
function addRung(){ const P=prep(G.stage); if(G.prog.length<P.maxRungs){ G.prog.push(newRung(P.cols)); edited(); } }
function rowAdd(ri){
  const P=prep(G.stage), rg=G.prog[ri];
  if(rg.cells.length>=P.maxRows) return;
  rg.cells.push(Array(P.cols).fill(null)); rg.v.push(Array(P.cols+1).fill(false)); edited();
}
function rowDel(ri){
  const rg=G.prog[ri]; if(rg.cells.length<=1) return;
  rg.cells.pop(); rg.v.pop(); edited();
}
function rungDel(ri){
  if(!confirm('ラング'+(ri+1)+'を削除しますか?')) return;
  G.prog.splice(ri,1);
  if(G.prog.length===0) G.prog.push(newRung(prep(G.stage).cols));
  edited();
}
function moveRung(ri,d){ const j=ri+d; if(j<0||j>=G.prog.length) return; [G.prog[ri],G.prog[j]]=[G.prog[j],G.prog[ri]]; edited(); }
function toggleV(ri,r,b){ if(isFill()) return; const rg=G.prog[ri]; rg.v[r][b]=!rg.v[r][b]; edited(); }
function clearAll(){
  if(!confirm('回路を最初の状態に戻しますか?')) return;
  G.prog=initialProg(G.stage); edited();
}

/* ---------- 部品選択 ---------- */
function openModal(html, onClick){
  const root=document.getElementById('modal-root');
  root.innerHTML=`<div class="modal-bg"><div class="modal">${html}</div></div>`;
  const bg=root.firstChild;
  bg.addEventListener('click', e=>{
    if(e.target===bg){ closeModal(); return; }
    const t=e.target.closest('[data-m]');
    if(t && t.dataset.m==='close'){ closeModal(); return; }
    if(t && onClick) onClick(t, e);
  });
  return bg;
}
function closeModal(){ document.getElementById('modal-root').innerHTML=''; }

function contactChoices(st){
  const P=prep(st), list=[];
  P.io.forEach(x=>list.push({a:x.a, label:x.name, sub:x.a}));
  P.mem.forEach(x=>list.push({a:x.a, label:x.name, sub:x.a}));
  P.timers.forEach(n=>list.push({a:n, label:n+'.Q', sub:'タイマ出力'}));
  P.counters.forEach(n=>list.push({a:n, label:n+'.Q', sub:'カウンタ出力'}));
  return list;
}
function cellPicker(ri,r,c){
  const rg=G.prog[ri], st=G.stage, P=prep(st);
  if(cellLocked(rg,r,c)){ toast('このマスは固定されています'); return; }
  const cur=rg.cells[r][c];
  const pal=P.palette;
  // 1タップで置ける一覧(種類+信号の組み合わせ)。押した瞬間に確定して閉じる
  const draw=()=>{
    const isSel=(t,a)=> cur ? (cur.t===t && (a==null || cur.a===a)) : t==='E';
    let h=`<h2>ラング${ri+1} / ${r+1}行目 / ${c+1}列目</h2>
      <div class="opts"><button class="opt ${isSel('E')?'sel':''}" data-m="put" data-t="E">空き</button>
      <button class="opt ${isSel('W')?'sel':''}" data-m="put" data-t="W">─ 横線</button></div>`;
    const ch=contactChoices(st);
    if(pal.includes('NO')) h+=`<div class="note">┤├ a接点(ONで通る)</div><div class="opts">`+
      ch.map(x=>`<button class="opt ${isSel('NO',x.a)?'sel':''}" data-m="put" data-t="NO" data-v="${x.a}">┤├ ${esc(x.label)}<small>${esc(x.sub)}</small></button>`).join('')+`</div>`;
    if(pal.includes('NC')) h+=`<div class="note">┤/├ b接点(OFFで通る)</div><div class="opts">`+
      ch.map(x=>`<button class="opt ${isSel('NC',x.a)?'sel':''}" data-m="put" data-t="NC" data-v="${x.a}">┤/├ ${esc(x.label)}<small>${esc(x.sub)}</small></button>`).join('')+`</div>`;
    if(!isFill() && rg.cells.length>1){
      const vb=[];
      if(r<rg.cells.length-1){ vb.push([r,c,'左に縦線(下の行へ)'],[r,c+1,'右に縦線(下の行へ)']); }
      if(r>0){ vb.push([r-1,c,'左に縦線(上の行へ)'],[r-1,c+1,'右に縦線(上の行へ)']); }
      const ok=vb.filter(([vr,b])=>b>=1);
      if(ok.length) h+=`<div class="note">縦線(並列)</div><div class="opts">`+ok.map(([vr,b,l])=>`<button class="opt ${rg.v[vr][b]?'sel':''}" data-m="v" data-r="${vr}" data-b="${b}">${l}</button>`).join('')+`</div>`;
    }
    h+=`<div class="acts"><button class="btn" data-m="close">閉じる</button></div>`;
    return h;
  };
  const bg=openModal(draw(), (t)=>{
    const m=t.dataset.m;
    if(m==='v'){ const vr=+t.dataset.r, b=+t.dataset.b; rg.v[vr][b]=!rg.v[vr][b]; saveDraft(); bg.querySelector('.modal').innerHTML=draw(); renderEditor(); return; }
    if(m==='put'){
      const type=t.dataset.t, addr=t.dataset.v;
      rg.cells[r][c] = type==='E'?null : type==='W'?{t:'W'} : {t:type, a:addr};
      if(type==='E') SFX.play('remove'); else G.pop=`c-${ri}-${r}-${c}`;
      if(r===0 && (type==='NO'||type==='NC')) autoWire(rg);
      closeModal(); edited(); return;
    }
  });
}
// 組む・最短挑戦では、1行目(出力につながる本線)の空きマスを自動で横線にする
function autoWire(rg){
  const ty=G.stage && G.stage.type;
  if(ty!=='build' && ty!=='short') return;
  rg.cells[0].forEach((cell,c)=>{ if(!cell) rg.cells[0][c]={t:'W'}; });
}
function outPicker(ri){
  const rg=G.prog[ri], st=G.stage, P=prep(st);
  if(outLocked(rg)){ toast('この出力は固定されています'); return; }
  const o=rg.out ? clone(rg.out) : null;
  let type=o?o.t:'E';
  let addr=o&&o.t==='COIL'?o.a:null;
  let tn=o&&o.n?o.n:(P.timers[0]||'T0'), pt=o&&o.pt?o.pt:1000;
  let cn=o&&o.n?o.n:(P.counters[0]||'C0'), pv=o&&o.pv?o.pv:3, rs=o&&o.r?o.r:'';
  const pal=P.palette;
  const draw=()=>{
    let h=`<h2>ラング${ri+1} の出力</h2><div class="opts"><button class="opt ${type==='E'?'sel':''}" data-m="none">なし</button></div>`;
    if(pal.includes('COIL')){
      const ch=P.io.filter(x=>kindOf(x.a)==='Q').concat(P.mem);
      h+=`<div class="note">( ) コイル(押すとすぐ置けます)</div><div class="opts">`+ch.map(x=>`<button class="opt ${type==='COIL'&&addr===x.a?'sel':''}" data-m="coil" data-v="${x.a}">( ) ${esc(x.name)}<small>${x.a}</small></button>`).join('')+`</div>`;
    }
    const fb=['TON','TOF','CTU','CTD'].filter(k=>pal.includes(k));
    if(fb.length) h+=`<div class="note">タイマ・カウンタ(設定してから「決定」)</div><div class="opts">${fb.map(k=>`<button class="opt ${type===k?'sel':''}" data-m="type" data-v="${k}">${k}</button>`).join('')}</div>`;
    if(type==='TON'||type==='TOF'){
      h+=`<div class="fieldrow">インスタンス名 <select data-f="tn">${(P.timers.length?P.timers:['T0']).map(n=>`<option ${n===tn?'selected':''}>${n}</option>`).join('')}</select>
          設定時間 PT <input data-f="pt" type="number" min="0.1" max="600" step="0.1" value="${pt/1000}" style="width:90px"> 秒</div>`;
    }
    if(type==='CTU'||type==='CTD'){
      const rch=contactChoices(st).filter(x=>['I','M'].includes(kindOf(x.a)));
      h+=`<div class="fieldrow">インスタンス名 <select data-f="cn">${(P.counters.length?P.counters:['C0']).map(n=>`<option ${n===cn?'selected':''}>${n}</option>`).join('')}</select>
          設定値 PV <input data-f="pv" type="number" min="1" max="999" step="1" value="${pv}" style="width:80px"></div>
          <div class="fieldrow">${type==='CTU'?'リセット入力 R':'プリセット入力 LD'} <select data-f="rs"><option value="">なし</option>${rch.map(x=>`<option value="${x.a}" ${x.a===rs?'selected':''}>${esc(x.label)} (${x.a})</option>`).join('')}</select></div>`;
    }
    const fbSel=['TON','TOF','CTU','CTD'].includes(type);
    h+=`<div class="acts"><button class="btn" data-m="close">閉じる</button>${fbSel?'<button class="btn primary" data-m="ok">決定</button>':''}</div>`;
    return h;
  };
  const readFields=()=>{
    const q=s=>bg.querySelector(`[data-f="${s}"]`);
    if(q('tn')) tn=q('tn').value;
    if(q('pt')) pt=Math.round(Math.max(0.1, parseFloat(q('pt').value)||1)*10)*100;
    if(q('cn')) cn=q('cn').value;
    if(q('pv')) pv=Math.max(1, parseInt(q('pv').value)||1);
    if(q('rs')) rs=q('rs').value;
  };
  const bg=openModal(draw(), (t)=>{
    const m=t.dataset.m;
    readFields();
    if(m==='none'){ rg.out=null; SFX.play('remove'); closeModal(); edited(); return; }
    if(m==='coil'){ rg.out={t:'COIL', a:t.dataset.v}; G.pop=`o-${ri}`; closeModal(); edited(); return; }
    if(m==='type') type=t.dataset.v;
    else if(m==='addr') addr=t.dataset.v;
    else if(m==='ok'){
      if(type==='E') rg.out=null;
      else if(type==='COIL'){ if(!addr){ toast('割り付ける出力を選んでください'); return; } rg.out={t:'COIL', a:addr}; }
      else if(type==='TON'||type==='TOF') rg.out={t:type, n:tn, pt};
      else rg.out={t:type, n:cn, pv, r:rs||null};
      if(type!=='E') G.pop=`o-${ri}`;
      closeModal(); edited(); return;
    } else return;
    bg.querySelector('.modal').innerHTML=draw();
  });
}

/* ---------- 止まっている場所と理由 ---------- */
// 電気が来ているのに通さないマスのうち、1行目・左側を優先して1つ選ぶ
function blockOf(rg, res){
  if(res.power) return null;
  const R=rg.cells.length, C=rg.cells[0].length;
  for(let r=0;r<R;r++) for(let c=0;c<C;c++){
    if(res.nodes[c][r] && !res.closed[r][c]) return {r,c,cell:rg.cells[r][c]};
  }
  return null;
}
function rungStatusHTML(rg, res, blk){
  const st=G.stage, nm=a=>{ const n=nameOf(st,a); return n?`${esc(n)}(${esc(dispAddr(a))})`:esc(dispAddr(a)); };
  const o=rg.out;
  if(res.power){
    if(!o) return '⚡ 電気は右まで届いています。右端に出力を置こう';
    if(o.t==='COIL') return `✅ 通電中 → ${nm(o.a)} ON`;
    if(o.t==='TON') return G.plc.get(o.n) ? `✅ 通電中 → ${esc(o.n)} タイムアップ(${esc(o.n)}.Q ON)` : `⏳ 通電中 → ${esc(o.n)} が時間を計っています`;
    if(o.t==='TOF') return `✅ 通電中 → ${esc(o.n)} ON(切れてから時間を計る)`;
    return `✅ 通電中 → ${esc(o.n)} に1回数える信号`;
  }
  if(!blk) return '✕ どこかで線がつながっていません(縦線の位置を確認)';
  const c=blk.cell;
  if(!c) return '✕ ここで止まる:空きマスで線が切れています';
  if(c.t==='NO') return `✕ ここで止まる:a接点 ${nm(c.a)} がOFFなので閉じない`;
  if(c.t==='NC') return `✕ ここで止まる:b接点 ${nm(c.a)} がONなので開いている`;
  return '✕ ここで止まる';
}

/* ---------- 通電表示の更新 ---------- */
function updateLadderVis(){
  const vis=G.plc.vis;
  G.prog.forEach((rg,ri)=>{
    const res=vis && vis[ri] && vis[ri].closed.length===rg.cells.length ? vis[ri] : null;
    const R=rg.cells.length, C=rg.cells[0].length;
    const blk=res ? blockOf(rg,res) : null;
    for(let r=0;r<R;r++) for(let c=0;c<C;c++){
      const el=document.getElementById(`c-${ri}-${r}-${c}`); if(!el) continue;
      el.classList.toggle('pl', !!(res && res.nodes[c][r]));
      el.classList.toggle('cl', !!(res && res.closed[r][c]));
      el.classList.toggle('blk', !!(blk && blk.r===r && blk.c===c));
    }
    const se=document.getElementById(`rs-${ri}`);
    if(se){ const h=res?rungStatusHTML(rg,res,blk):''; if(se.dataset.h!==h){ se.dataset.h=h; se.innerHTML=h; se.className='rstat'+(res&&res.power?' ok':(blk?' ng':'')); } }
    for(let r=0;r<R-1;r++) for(let b=1;b<=C;b++){
      const el=document.getElementById(`v-${ri}-${r}-${b}`); if(!el) continue;
      el.classList.toggle('pl', !!(res && res.nodes[b][r] && res.nodes[b][r+1]));
    }
    const oe=document.getElementById(`o-${ri}`);
    if(oe){
      oe.classList.toggle('pl', !!(res && res.power));
      let q=false;
      const o=rg.out;
      if(o && res){
        if(o.t==='COIL') q=G.plc.get(o.a);
        else q=G.plc.get(o.n);
      }
      oe.classList.toggle('q', q);
      if(o && (o.t==='TON'||o.t==='TOF')){
        const e=document.getElementById(`et-${ri}`), t=G.plc.tm[o.n];
        if(e) e.textContent='ET '+((t?t.et:0)/1000).toFixed(1)+'s';
      }
      if(o && (o.t==='CTU'||o.t==='CTD')){
        const e=document.getElementById(`cv-${ri}`), c=G.plc.ct[o.n];
        if(e) e.textContent=String(c?c.cv:0);
      }
    }
  });
}

/* ---------- 機械 ---------- */
const IN_TYPES=['pb','sw','sensor'];
function devLabel(st, d){ return d.label || nameOf(st, A(d.a)) || ''; }
function renderMachine(){
  const st=G.stage;
  const devs=st.machine||[];
  let ip='', pl='';
  devs.forEach((d,i)=>{
    const a=A(d.a), lab=esc(devLabel(st,d)), ad=`<span class="ad">${a}</span>`;
    switch(d.type){
      case 'pb': ip+=`<div class="dev"><button class="pb ${d.color||'green'}" data-in="${a}" data-kind="pb" aria-label="${lab}"><i></i></button><span class="lbl">${lab}</span>${ad}</div>`; break;
      case 'sw': ip+=`<div class="dev"><button class="sw" data-in="${a}" data-kind="sw" aria-label="${lab}"></button><span class="lbl">${lab}</span>${ad}</div>`; break;
      case 'sensor': ip+=`<div class="dev"><button class="sens ${d.auto?'auto':''}" data-in="${a}" data-kind="${d.auto?'auto':'sw'}" aria-label="${lab}">センサ</button><span class="lbl">${lab}</span>${ad}</div>`; break;
      case 'lamp': pl+=`<div class="dev"><div class="lamp ${d.color||'yellow'}" data-out="${a}"></div><span class="lbl">${lab}</span>${ad}</div>`; break;
      case 'buzzer': pl+=`<div class="dev"><div class="buzz" data-out="${a}">🔔</div><span class="lbl">${lab}</span>${ad}</div>`; break;
      case 'motor': pl+=`<div class="dev"><div class="motor" data-out="${a}" ${d.rev?`data-rev="${A(d.rev)}"`:''}><svg viewBox="0 0 58 58"><circle cx="29" cy="29" r="26" fill="#2a3542" stroke="#56687b" stroke-width="3"/><g class="fan"><path d="M29 29 L29 6 A10 10 0 0 1 39 16Z M29 29 L52 29 A10 10 0 0 1 42 39Z M29 29 L29 52 A10 10 0 0 1 19 42Z M29 29 L6 29 A10 10 0 0 1 16 19Z" fill="#9fb0c0"/></g><circle cx="29" cy="29" r="4" fill="#cfd8e2"/></svg></div><span class="lbl">${lab}</span><span class="ad">${a}${d.rev?' / 逆 '+A(d.rev):''}</span></div>`; break;
      case 'conveyor': pl+=`<div class="dev"><div class="conv" data-out="${a}" ${d.rev?`data-rev="${A(d.rev)}"`:''}><div class="box"></div><div class="belt"></div></div><span class="lbl">${lab}</span><span class="ad">${a}${d.rev?' / 逆 '+A(d.rev):''}</span></div>`; break;
      case 'cylinder': pl+=`<div class="dev"><div class="cyl" data-cyl="${i}"><div class="body"></div><div class="rod"></div><div class="head"></div></div><span class="lbl">${lab}</span>${ad}</div>`; break;
      case 'tank': pl+=`<div class="dev"><div class="tank" data-tank="${i}"><div class="lv"></div></div><span class="lbl">${lab}</span><span class="ad">給水 ${A(d.a)}${d.drain?' / 排水 '+A(d.drain):''}</span></div>`; break;
    }
  });
  const hasPB=devs.some(d=>d.type==='pb');
  const el=document.getElementById('machine');
  el.innerHTML=`<h3>機械</h3><div class="mach-wrap">
      <div class="plant">${pl||'<span class="note">出力機器なし</span>'}</div>
      <div class="opanel">${ip||'<span class="note">操作盤なし</span>'}</div>
      <div class="mach-ctrl">
        ${hasPB?`<label><input type="checkbox" id="holdchk" ${G.hold?'checked':''}> 押しっぱなし(タップでON/OFF。2つ同時押し用)</label>`:''}
        <span class="clock" id="clock">停止中 0.0s</span>
      </div></div>`;
  const chk=el.querySelector('#holdchk');
  if(chk) chk.onchange=()=>{ G.hold=chk.checked; if(!G.hold){ el.querySelectorAll('.pb').forEach(b=>{ setIn(b.dataset.in,false); }); } updateMachineVis(); };
  el.querySelectorAll('[data-in]').forEach(btn=>{
    const a=btn.dataset.in, kind=btn.dataset.kind;
    if(kind==='auto') return;
    btn.addEventListener('contextmenu', e=>e.preventDefault());
    btn.addEventListener('pointerdown', e=>{
      e.preventDefault();
      SFX.play('press');
      if(kind==='sw' || G.hold){ setIn(a, !G.plc.inputs[a]); }
      else { setIn(a, true); try{ btn.setPointerCapture(e.pointerId); }catch(_){} }
    });
    const up=()=>{ if(kind==='pb' && !G.hold) setIn(a,false); };
    btn.addEventListener('pointerup', up);
    btn.addEventListener('pointercancel', up);
    btn.addEventListener('keydown', e=>{ if(e.key===' '||e.key==='Enter'){ e.preventDefault(); if(kind==='sw'||G.hold){ if(!e.repeat) setIn(a,!G.plc.inputs[a]); } else setIn(a,true);} });
    btn.addEventListener('keyup', e=>{ if((e.key===' '||e.key==='Enter') && kind==='pb' && !G.hold) setIn(a,false); });
  });
  updateMachineVis();
}
function setIn(a,v){ G.plc.inputs[a]=v; updateMachineVis(); }
function resetPhys(){
  G.phys={};
  (G.stage && G.stage.machine||[]).forEach((d,i)=>{
    if(d.type==='cylinder') G.phys[i]={pos:0};
    if(d.type==='tank') G.phys[i]={lv:d.init||0};
  });
  applyPhysSensors();
}
function physics(dt){
  (G.stage.machine||[]).forEach((d,i)=>{
    const p=G.phys[i]; if(!p) return;
    if(d.type==='cylinder'){
      const on=G.plc.get(A(d.a)), T=d.time||1000;
      p.pos=Math.max(0, Math.min(1, p.pos + (on?1:-1)*dt/T));
    }
    if(d.type==='tank'){
      const f=G.plc.get(A(d.a)), dr=d.drain?G.plc.get(A(d.drain)):false;
      p.lv=Math.max(0, Math.min(1, p.lv + (f?dt/(d.fill||5000):0) - (dr?dt/(d.drainTime||5000):0)));
    }
  });
  applyPhysSensors();
}
function applyPhysSensors(){
  (G.stage && G.stage.machine||[]).forEach((d,i)=>{
    const p=G.phys[i]; if(!p) return;
    if(d.type==='cylinder'){
      if(d.ext) G.plc.inputs[A(d.ext)] = p.pos>=1;
      if(d.ret) G.plc.inputs[A(d.ret)] = p.pos<=0;
    }
    if(d.type==='tank'){
      if(d.lo) G.plc.inputs[A(d.lo)] = p.lv>=0.15;
      if(d.hi) G.plc.inputs[A(d.hi)] = p.lv>=0.85;
    }
  });
}
function updateMachineVis(){
  const el=document.getElementById('machine'); if(!el) return;
  el.querySelectorAll('[data-in]').forEach(b=>{
    const on=!!G.plc.inputs[b.dataset.in];
    b.classList.toggle('on', on);
    if(b.classList.contains('pb')) b.classList.toggle('held', G.hold && on);
  });
  const outv=a=> G.running || G.plc.time>0 ? G.plc.get(a) : false;
  el.querySelectorAll('[data-out]').forEach(d=>{
    const f=outv(d.dataset.out), r=d.dataset.rev?outv(d.dataset.rev):false;
    if((f||r) && !d.classList.contains('on') && G.running){
      SFX.play('outOn'); burstAt(d, 10, {power:45, size:6, colors:['#ffc23d','#fff3a0','#7dffb8']});
      d.classList.remove('on-burst'); void d.offsetWidth; d.classList.add('on-burst');
    }
    d.classList.toggle('on', f||r);
    d.classList.toggle('rev', !f && r);
  });
  el.querySelectorAll('[data-cyl]').forEach(d=>{
    const p=G.phys[d.dataset.cyl]||{pos:0}, L=8+p.pos*60;
    d.querySelector('.rod').style.width=L+'px';
    d.querySelector('.head').style.left=(70+L)+'px';
  });
  el.querySelectorAll('[data-tank]').forEach(d=>{
    const p=G.phys[d.dataset.tank]||{lv:0};
    d.querySelector('.lv').style.height=(p.lv*100)+'%';
  });
  const ck=document.getElementById('clock');
  if(ck) ck.textContent=(G.running?'実行中 ':'停止中 ')+(G.plc.time/1000).toFixed(1)+'s';
}

/* ---------- 実行ループ ---------- */
function startRun(){
  if(G.running) return;
  G.running=true; G.acc=0; G.last=performance.now();
  updateRunUI();
  // 実時間に合わせてスキャンを進める(タブが裏に回っても時間がずれにくいよう setInterval を使用)
  const loop=()=>{
    if(!G.running) return;
    const ts=performance.now();
    let el=ts-G.last; G.last=ts;
    if(el>1000) el=1000;
    G.acc+=el;
    while(G.acc>=SCAN_MS){
      physics(SCAN_MS);
      G.plc.scan(G.prog, SCAN_MS);
      G.acc-=SCAN_MS;
    }
    updateLadderVis(); updateMachineVis();
  };
  G.raf=setInterval(loop, 20);
}
function stopRun(){
  G.running=false; clearInterval(G.raf);
  if(G.stage) updateRunUI();
}
function resetRun(){
  stopRun();
  G.plc=new PLC();
  resetPhys();
  updateLadderVis(); updateMachineVis();
}
function updateRunUI(){
  const ed=document.getElementById('editor'); if(ed) ed.classList.toggle('running', G.running);
  document.querySelectorAll('[data-act="run"]').forEach(b=>b.disabled=G.running);
  document.querySelectorAll('[data-act="stop"]').forEach(b=>b.disabled=!G.running);
  updateMachineVis();
}

/* ---------- 下部(課題・割付表・ヒント) ---------- */
function ioTableHTML(st){
  const P=prep(st);
  const kname={I:'入力',Q:'出力',M:'内部リレー'};
  let h=`<table class="io"><tr><th>名前</th><th>種類</th><th>アドレス(OpenPLC)</th><th>説明</th></tr>`;
  P.io.concat(P.mem).forEach(x=>{ h+=`<tr><td>${esc(x.name)}</td><td>${kname[kindOf(x.a)]||''}</td><td class="mono">${x.a}</td><td>${esc(x.desc||'')}</td></tr>`; });
  P.timers.forEach(n=>{ h+=`<tr><td>${n}</td><td>タイマ</td><td class="mono">${n}(TON/TOF)</td><td>接点では ${n}.Q として使う</td></tr>`; });
  P.counters.forEach(n=>{ h+=`<tr><td>${n}</td><td>カウンタ</td><td class="mono">${n}(CTU/CTD)</td><td>接点では ${n}.Q として使う</td></tr>`; });
  return h+'</table>';
}
function renderBottom(){
  const st=G.stage, P=prep(st), rec=stRec(st.id);
  const tabs=[['task','説明・評価'],['io','割付表'],['hint','ヒント ('+rec.hints+'/'+st.hints.length+')']];
  let h=`<div class="tabs">${tabs.map(([k,l])=>`<button class="${G.tab===k?'act':''}" data-act="tab" data-tab="${k}">${l}</button>`).join('')}</div>`;
  if(G.tab==='task'){
    h+=`${st.story?talkHTML(`<p class="story">${esc(st.story)}</p>`, 'normal'):''}
      <div class="goal">評価:★1 テスト合格 / ★2 接点数 ${P.target}個以下 / ★3 ヒントを使わずにクリア
      ${st.type==='short'?'<br><b>最短挑戦:</b>できるだけ少ない接点数でクリアを目指そう。'+(rec.best!=null?'(自己ベスト '+rec.best+'個)':''):''}
      ${st.type==='fill'?'<br><b>穴埋め:</b>「?」のマスだけ編集できます。':''}
      ${st.type==='bug'?'<br><b>バグ探し:</b>今のラダーには不具合があります。直してから判定しよう。':''}</div>`;
  } else if(G.tab==='io'){
    h+=ioTableHTML(st);
  } else {
    for(let i=0;i<rec.hints;i++) h+=`<div class="hint"><b>ヒント${i+1}</b> ${esc(st.hints[i])}</div>`;
    if(rec.hints<st.hints.length) h+=`<button class="btn" data-act="hint">ヒント${rec.hints+1}を見る(★3が消えます)</button>`;
    else h+='<div class="note">ヒントはここまで。「模範解答」ボタンで答えも見られます。</div>';
  }
  document.getElementById('bottom').innerHTML=h;
}
function openHint(){
  const st=G.stage, rec=stRec(st.id);
  if(rec.hints>=st.hints.length) return;
  rec.hints++; persist(); renderBottom(); SFX.play('hint');
}

/* ---------- 判定・クリア ---------- */
function failHTML(st, r){
  const name=a=>{ const n=nameOf(st,a); return n? `${n}(${dispAddr(a)})` : dispAddr(a); };
  const sec=t=>(t/1000).toFixed(2)+'秒';
  let tl='';
  for(const s of r.steps){
    if(s.t>r.t) break;
    const ins=Object.entries(s.in).map(([a,v])=>`${name(a)}を${v?'ON':'OFF'}`);
    if(ins.length) tl+=`<div>${sec(s.t)}:${esc(ins.join('、'))}</div>`;
  }
  let bad;
  if(r.forbid) bad=`${sec(r.t)}:危険! ${esc(r.forbid.msg || r.forbid.all.map(name).join(' と ')+' が同時にON')}`;
  else bad=`${sec(r.t)}:${esc(name(r.addr))} は <b>${r.exp?'ON':'OFF'}</b> のはずが、実際は <b>${r.act?'ON':'OFF'}</b>`;
  return `<p class="result-ng">不合格… テスト${r.idx+1}「${esc(r.name)}」</p>
    <div class="note">入力の流れ(すべて最初はOFF)</div>
    <div class="timeline">${tl||'<div>(入力の操作なし)</div>'}<div class="bad">${bad}</div></div>
    <p class="note">機械のボタンで同じ順番に操作すると、ラダー図の「✕」と下の説明で、どこで止まるか確かめられます。</p>`;
}
function judge(){
  if(G.judging) return;
  const st=G.stage, P=prep(st), r=runAllTests(G.prog, st);
  const finish=()=>{
    G.judging=false;
    if(!r.ok){
      SFX.play('fail');
      const bg=openModal(`${talkHTML(pick(LINES.fail),'sad')}${failHTML(st,r)}<div class="acts"><button class="btn primary" data-m="close">直してみる</button></div>`);
      bg.querySelector('.modal').classList.add('ng');
      return;
    }
    onClear();
  };
  if(reduced()){ finish(); return; }
  // 判定中の演出:テストを1つずつ確認していく(結果はすでに計算済み)
  G.judging=true;
  const upto = r.ok ? P.tests.length : r.idx+1;
  const ov=document.createElement('div'); ov.className='judging';
  ov.innerHTML=`<div class="jb"><h2><span>判</span><span>定</span><span>中</span><span>…</span><span>!</span></h2>
    ${P.tests.map((t,i)=>`<div class="jrow" id="jr${i}"><span class="mk"></span><span>テスト${i+1} ${esc(t.name||'')}</span></div>`).join('')}</div>`;
  document.body.appendChild(ov);
  let done=false;
  const end=()=>{ if(done) return; done=true; ov.remove(); finish(); };
  ov.addEventListener('click', end);   // タップで演出を飛ばす
  SFX.play('drum');
  const step=Math.max(160, Math.min(380, 1500/P.tests.length));
  let i=0;
  const next=()=>{
    if(done) return;
    if(i>0){
      const prev=ov.querySelector('#jr'+(i-1)), bad=!r.ok && i-1===r.idx;
      prev.classList.remove('run'); prev.classList.add(bad?'ng':'ok');
      prev.querySelector('.mk').textContent=bad?'✕':'✓';
      if(!bad){ SFX.play('testOk'); burstAt(prev.querySelector('.mk'), 8, {power:35, size:6, colors:['#22c58b','#7dffb8','#fff']}); }
    }
    if(i>=upto){ setTimeout(end, r.ok?260:520); return; }
    const cur=ov.querySelector('#jr'+i); cur.classList.add('run'); SFX.play('tick');
    i++; setTimeout(next, step);
  };
  setTimeout(next, 250);
}
function onClear(){
  const st=G.stage, P=prep(st), rec=stRec(st.id);
  const n=countContacts(G.prog);
  const stars=[true, n<=P.target, rec.hints===0 && !rec.peeked];
  const oldL=levelOf(G.save.xp);
  let gain=0;
  const base=st.xp || (10+st.area*10)*(st.boss?2:1);
  if(!rec.cleared) gain+=base;
  stars.forEach((s,i)=>{ if(s && !rec.stars[i]){ gain+=10; rec.stars[i]=true; } });
  const firstClear=!rec.cleared;
  rec.cleared=true;
  if(rec.best==null || n<rec.best) rec.best=n;
  const newDex=[];
  (st.unlock||[]).forEach(id=>{ if(!G.save.dex.includes(id)){ G.save.dex.push(id); newDex.push(id); } });
  G.save.xp+=gain;
  rec.hints=0; rec.peeked=false;          // 次の挑戦は★3を再び狙える
  persist();
  const newL=levelOf(G.save.xp);
  const next=nextStage(st);
  const dexNames=newDex.map(id=>{ const d=DEX.find(x=>x.id===id); return d?d.name:id; });
  const lvUp=newL>oldL, newTitle=titleOf(newL)!==titleOf(oldL);
  const html=`<div class="clear-wrap ${st.boss?'boss':''}"><p class="clear-title ${st.boss?'boss':''}">${st.boss?'BOSS CLEAR!':'CLEAR!'}</p>
    <p class="result-ok" style="text-align:center;margin:0">${st.id} ${esc(st.title)} 合格</p>
    <div class="bigstars">${stars.map((s,i)=>`<span class="s ${s?'on':'off'}" style="animation-delay:${.35+i*.25}s">★</span>`).join('')}</div></div>
    <ul class="starlist">
      <li class="${stars[0]?'got':''}">${stars[0]?'★':'☆'} テスト合格</li>
      <li class="${stars[1]?'got':''}">${stars[1]?'★':'☆'} 接点数 ${n}個(目標 ${P.target}個以下)</li>
      <li class="${stars[2]?'got':''}">${stars[2]?'★':'☆'} ヒント未使用</li>
    </ul>
    <div class="xpgain">${gain>0?`+<span id="xpcount">0</span> XP`:'<span class="note">(獲得XPなし:すでに取得済み)</span>'}</div>
    ${lvUp?`<div class="lvup">🎉 レベルアップ! Lv.${newL}${newTitle?` 称号「${esc(titleOf(newL))}」を獲得!`:''}</div>`:''}
    ${dexNames.length?`<div class="newdex">📖 命令図鑑に追加:<b>${esc(dexNames.join('、'))}</b></div>`:''}
    ${talkHTML(pick(st.boss?LINES.boss:LINES.clear),'happy')}
    <hr class="sep">
    ${openplcHTML(st)}
    <div class="acts">
      <button class="btn" data-m="close">このステージに残る</button>
      <button class="btn" data-m="map">マップへ</button>
      ${next?`<button class="btn primary" data-m="next">次のステージへ</button>`:''}
    </div>`;
  openModal(html, t=>{
    if(t.dataset.m==='map'){ closeModal(); saveDraft(); showMap(); }
    if(t.dataset.m==='next'){ closeModal(); saveDraft(); openStage(next); }
  });
  // 普通のステージは星と小さめの紙ふぶきだけ。花火・フラッシュ・後光はボスのときだけ
  SFX.play(st.boss?'boss':'clear');
  if(st.boss){ confetti(140); flash(); fireworks(5); }
  else confetti(45);
  document.querySelectorAll('.bigstars .s').forEach((s,i)=>{
    if(!s.classList.contains('on')) return;
    setTimeout(()=>{ SFX.play('star'); burstAt(s, 16, {power:70, size:8, colors:['#ffc23d','#fff3a0','#ffffff']}); }, (350+i*250)+200);
  });
  if(lvUp) setTimeout(()=>levelSplash(oldL, newL), st.boss?2200:1700);
  const xc=document.getElementById('xpcount');
  if(xc){ const t0=performance.now(), dur=900;
    const tick=()=>{ const k=Math.min(1,(performance.now()-t0)/dur); xc.textContent=Math.round(gain*k); if(k<1 && xc.isConnected) requestAnimationFrame(tick); };
    xc.textContent=gain; requestAnimationFrame(()=>{ xc.textContent='0'; tick(); }); }
  const head=document.querySelector('.stage-head .info'); if(head) head.innerHTML=starsHTML(rec.stars);
  renderBottom();
}
function nextStage(st){
  const i=STAGES.indexOf(st);
  for(let j=i+1;j<STAGES.length;j++) if(stageUnlocked(STAGES[j])) return STAGES[j];
  return null;
}
function openplcHTML(st){
  const P=prep(st), op=st.openplc||{};
  const usesT=P.answer.some(r=>r.out && (r.out.t==='TON'||r.out.t==='TOF'));
  const usesC=P.answer.some(r=>r.out && (r.out.t==='CTU'||r.out.t==='CTD'));
  return `<h2>OpenPLC Editorで同じ回路を組んでみよう</h2>
    <div class="note">割付表(変数表に登録。Type は BOOL、Location にアドレスを入力)</div>
    ${ioTableHTML(st)}
    <ol class="steps">
      <li>新規プロジェクトを作り、言語「LD」のプログラムを追加する</li>
      <li>上の割付表どおりに変数を登録する(変数名は「名前」の列を使うと分かりやすい)</li>
      <li>左パワーレール → 接点 → 出力 → 右パワーレール の順に置き、下の図と同じ形に線でつなぐ</li>
      ${usesT?'<li>タイマは関数ブロックの TON / TOF を置き、PT に時間(例: T#2s)を入れる。接点では インスタンス名.Q を使う</li>':''}
      ${usesC?'<li>カウンタは関数ブロックの CTU / CTD を置き、PV に設定値、R(CTDはLD)に信号をつなぐ</li>':''}
      <li>シミュレーションを開始し、入力を強制ON/OFFして次を確認する</li>
    </ol>
    ${(op.check||[]).length?`<div class="note">確認ポイント</div><ul>${op.check.map(c=>`<li>${esc(c)}</li>`).join('')}</ul>`:''}
    ${op.note?`<p class="note">${esc(op.note)}</p>`:''}
    <div class="note">参考:模範解答の形</div>
    ${P.answer.map((rg,i)=>`<div class="preview-svg">${rungSVGStatic(rg,i,st)}</div>`).join('')}`;
}
function rungSVGStatic(rg, i, st){
  // 読み取り専用で描画(穴埋めの「?」表示を出さないため一時的に種類を無視)
  const saved=G.stage; const fake=Object.assign({},st,{type:'build'});
  G.stage=fake;
  const s=rungSVG(rg, 'p'+i, st, {readonly:true});
  G.stage=saved;
  return s;
}
function showAnswer(){
  const st=G.stage, P=prep(st), rec=stRec(st.id);
  const view=()=>{
    openModal(`<h2>模範解答</h2>${P.answer.map((rg,i)=>`<div class="preview-svg">${rungSVGStatic(rg,i,st)}</div>`).join('')}
      <p class="note">接点数 ${countContacts(P.answer)}個。ほかの組み方でもテストに合格すればクリアです。</p>
      <div class="acts"><button class="btn" data-m="close">閉じる</button>${st.type==='fill'?'':'<button class="btn primary" data-m="load">エディタに読み込む</button>'}</div>`, t=>{
      if(t.dataset.m==='load'){
        if(!confirm('今の回路を模範解答で置き換えますか?')) return;
        G.prog=clone(P.answer); closeModal(); edited();
      }
    });
  };
  if(isCleared(st.id)) return view();
  openModal(`<h2>模範解答を見る?</h2><p>クリア前に見ると、このステージの★3(ヒント未使用)は取れなくなります。</p>
    <div class="acts"><button class="btn" data-m="close">やめる</button><button class="btn primary" data-m="yes">見る</button></div>`, t=>{
    if(t.dataset.m==='yes'){ rec.peeked=true; persist(); view(); }
  });
}

/* ---------- 命令図鑑 ---------- */
function showDex(){
  const got=G.save.dex;
  let h=`<h2>命令図鑑 (${DEX.filter(d=>got.includes(d.id)).length}/${DEX.length})</h2>`;
  for(const d of DEX){
    if(got.includes(d.id)){
      h+=`<div class="dex-item"><h4>${esc(d.name)}</h4><div class="op">${esc(d.op)}</div><p style="margin:4px 0">${esc(d.text)}</p><div class="note">ポイント:${esc(d.tip)}</div></div>`;
    } else {
      const ready=areaReady(d.area);
      h+=`<div class="dex-item locked"><h4>???</h4><div class="note">エリア${d.area}「${esc(AREAS[d.area-1].name)}」で解放${ready?'':'(準備中)'}</div></div>`;
    }
  }
  h+=`<div class="acts"><button class="btn primary" data-m="close">閉じる</button></div>`;
  openModal(h);
}

/* ---------- データ(書き出し/読み込み) ---------- */
function showData(){
  const html=`<h2>データ</h2>
    <p class="note">進捗はこのブラウザに自動保存されています。別の端末に移したり、後輩に渡したりするときはJSONファイルに書き出してください。</p>
    <div class="opts">
      <button class="btn primary" data-m="export">JSONに書き出す</button>
      <button class="btn" data-m="import">JSONを読み込む</button>
      <button class="btn stop" data-m="wipe">進捗をすべて消す</button>
    </div>
    <input type="file" id="impfile" accept=".json,application/json" class="hidden">
    <div class="acts"><button class="btn" data-m="close">閉じる</button></div>`;
  const bg=openModal(html, t=>{
    const m=t.dataset.m;
    if(m==='export') exportSave();
    if(m==='import') bg.querySelector('#impfile').click();
    if(m==='wipe'){
      if(confirm('進捗・XP・下書きをすべて消します。元に戻せません。よろしいですか?')){
        G.save=defaultSave(); persist(); closeModal(); showMap(); toast('進捗を消しました');
      }
    }
  });
  bg.querySelector('#impfile').addEventListener('change', e=>{
    const f=e.target.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=()=>{
      try{
        const s=JSON.parse(rd.result);
        if(!validSave(s)) throw new Error('形式が違います');
        if(!confirm('読み込んだデータで今の進捗を上書きします。よろしいですか?')) return;
        G.save=Object.assign(defaultSave(), s); persist(); closeModal(); showMap(); toast('読み込みました');
      }catch(err){ toast('読み込めませんでした:'+err.message); }
    };
    rd.readAsText(f);
  });
}
function exportSave(){
  const blob=new Blob([JSON.stringify(G.save,null,1)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='ladder_save_'+ymd(new Date()).replace(/-/g,'')+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
  toast('書き出しました');
}

/* ---------- 起動 ---------- */
function setupPWA(){
  // https(または localhost)で配信されているときだけ、オフライン用のサービスワーカーを登録する
  if(!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return;
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
  // 進捗がブラウザの容量整理で消されにくくなるよう依頼する(許可されなくても動作に影響なし)
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
}
function boot(){
  setupPWA();
  G.save=loadSave();
  window.addEventListener('beforeunload', ()=>{ if(G.stage) saveDraft(); });
  showTitle();
}
if(typeof document!=='undefined') boot();
</script>
